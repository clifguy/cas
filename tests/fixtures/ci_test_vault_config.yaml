# Minimal smoke-test vault config for the GitHub Actions Playwright e2e job.
#
# Copied into ~/sage_vaults/test/vault_config.yaml on the CI runner before
# SAGE starts, so SAGE's lifespan vault-discovery picks up the smoke-test
# vault alongside cas. The maintenance e2e spec
# (app/e2e/maintenance.spec.ts) ingests its deferred-abstract fixture
# here so the cas vault stays free of test sediment across runs (SAGE
# has no hard-delete; archived predecessors persist in the graph store).
#
# Shape mirrors VaultRegistryService.get_default_config in
# sage/services/vault_registry.py, pruned to the minimum the maintenance
# fixture exercises: markdown ingest of doc_type="document", lifecycle
# archive transition, tag/lifecycle/pipeline_status-filtered discover,
# and vault-config GET. Abstraction is disabled at vault scope so the
# maintenance seed produces an abstraction_skipped fixture directly
# (BH-025) without exercising the toggle dance the script runs in dev,
# and so MLX/Qwen3 is never touched on the Linux runner
# (SAGE_TEST_STUB_PROVIDERS=1 is the belt-and-suspenders fallback set
# by the workflow env).
vault:
  id: test
  name: Smoke-test vault
  owner: clif
  storage_root: ~/sage_vaults/test/sources
  brain_root: ~/sage_vaults/test/brain
  visibility: personal
document_types:
  doc_types:
    - value: document
      label: Document
      description: Catch-all document type.
      source_types:
        - markdown
lifecycle:
  base_states_required: true
  states:
    - value: active
      label: Active
    - value: completed
      label: Completed
    - value: archived
      label: Archived
      is_terminal: true
  transitions:
    - from_state: (new)
      action: ingest
      to_state: active
    - from_state: active
      action: supersede
      to_state: archived
      creates_edge: supersedes
    - from_state: active
      action: complete
      to_state: completed
    - from_state: active
      action: archive
      to_state: archived
    - from_state: completed
      action: archive
      to_state: archived
    - from_state: archived
      action: reactivate
      to_state: active
metadata_extraction:
  filename_extraction:
    separator: _
edge_inference:
  tier_assignments:
    - edge_type: supersedes
      tier: 1
      inference_rules:
        - method: version_chain
abstraction:
  enabled: false
