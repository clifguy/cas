  #
  # Each active patent gets a dedicated steward. The steward is sole authority
  # over its patent specification: content development, conformance audit,
  # quality audit, filing preparation, and claims integration. Level 3
  # (checkpoint) because content changes affect patent prosecution.
  #
  # Decision logs enabled: content decisions (what to add, what to reject,
  # what to defer) have lasting consequences for patent scope and prosecution.
  #
  # NOTE: This section registers currently active patents. Add new entries
  # as patents enter the portfolio. Retired patents are marked inactive
  # (SAGE User record persists for provenance).
  # ---------------------------------------------------------------------------

