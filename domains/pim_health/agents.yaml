# =============================================================================
# PIM Health Domain Instantiation: ROOT Harness Agent Registration
# =============================================================================
#
# Validates against: docs/fs/root_harness/agent.schema.json (FS v0.1)
# Instantiation checklist item: #8
# Target path: ~/repos/cas/domains/pim_health/agents.yaml
#
# Agent taxonomy (CAS-ADR-010):
#   Steward: owns a canonical artifact. Sole authority for reads and writes.
#   Orchestrator: owns a coordination lifecycle. Plans, dispatches, tracks.
#   Everything else is a tool, not an agent.
#
# patent_steward is a template: each active patent gets its own instance
# (e.g., pv01_steward, pv06_steward). This file registers the currently
# active instances. New patents entering the portfolio receive new
# registrations.
# =============================================================================

agents:
  # ===========================================================================
  # STEWARDS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Glossary Steward
  #
  # Terminology authority for the portfolio. Every Glossary version bump has
  # cross-patent blast radius (Content Rule 8c). Level 3 (checkpoint) so Clif
  # reviews before propagation proceeds.
  # ---------------------------------------------------------------------------
  - agent_id: glossary_steward
    display_name: "Glossary Steward"
    agent_type: steward
    owned_artifact: glossary
    decision_log_enabled: true           # Terminology decisions have portfolio-wide impact
    autonomy_level: 3                    # Checkpoint-gated: review at propagation boundaries
    capabilities:
      - terminology_governance
      - definition_sync
      - definition_query
      - blast_radius_analysis
    policy_ref: glossary_steward_policy
    llm_config:
      provider: anthropic
      model: "claude-opus-4-6"           # Terminology governance requires deep reasoning
      temperature: 0.0
      max_tokens: 8192
      system_prompt_ref: "prompts/glossary_steward.md"

  # ---------------------------------------------------------------------------
  # Formatting Standards Steward
  #
  # Document-state authority. Evaluates compliance against the finished-
  # document state. High-frequency reads (every formatting check), rare
  # mutations (FS updates). Level 4 (exception) because reads are safe
  # and mutations are exceptional.
  # ---------------------------------------------------------------------------
  - agent_id: formatting_stds_steward
    display_name: "Formatting Standards Steward"
    agent_type: steward
    owned_artifact: formatting_standards
    decision_log_enabled: false
    autonomy_level: 4                    # Exception-gated: escalates only on mutations
    capabilities:
      - format_compliance_evaluation
      - format_rule_query
    policy_ref: reference_steward_read_heavy
    llm_config:
      provider: anthropic
      model: "claude-sonnet-4-6"         # Mechanical compliance checks; Sonnet is sufficient
      temperature: 0.0
      max_tokens: 4096
      system_prompt_ref: "prompts/formatting_stds_steward.md"

  # ---------------------------------------------------------------------------
  # Integration Catalog Steward
  #
  # Functional descriptions authority. Source for CF-1 cross-reference
  # remediation (pim-verbatim-sync Mode C). Similar profile to Formatting
  # Standards Steward: high-frequency reads, rare mutations.
  # ---------------------------------------------------------------------------
  - agent_id: integration_catalog_steward
    display_name: "Integration Catalog Steward"
    agent_type: steward
    owned_artifact: integration_catalog
    decision_log_enabled: false
    autonomy_level: 4                    # Exception-gated
    capabilities:
      - ic_description_extraction
      - ic_query
    policy_ref: reference_steward_read_heavy
    llm_config:
      provider: anthropic
      model: "claude-sonnet-4-6"
      temperature: 0.0
      max_tokens: 4096
      system_prompt_ref: "prompts/integration_catalog_steward.md"

  # ---------------------------------------------------------------------------
  # Vault Steward
  #
  # Mediates cross-artifact infrastructure queries: semantic search, blast
  # radius analysis, graph traversals. Does not own a single document; owns
  # access to the vault's search and discovery surface. Ensures orchestrators
  # never call SAGE directly for discovery operations.
  # ---------------------------------------------------------------------------
  - agent_id: vault_steward
    display_name: "Vault Steward"
    agent_type: steward
    owned_artifact: null                 # Owns the search surface, not a document
    decision_log_enabled: false
    autonomy_level: 4                    # Exception-gated; read-only surface
    capabilities:
      - vault_search
      - blast_radius_analysis
      - graph_traversal
    policy_ref: vault_steward_policy
    llm_config:
      provider: anthropic
      model: "claude-sonnet-4-6"         # Search and traversal; Sonnet is sufficient
      temperature: 0.0
      max_tokens: 4096
      system_prompt_ref: "prompts/vault_steward.md"

  # ---------------------------------------------------------------------------
