  # ===========================================================================
  # ORCHESTRATORS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Planning Orchestrator
  #
  # Interactive design-judgment agent (per Interactive Scope Boundary pattern).
  # Collaborates with Clif to produce work plans, scope definitions, and
  # prerequisite evaluations. Level 2 (approval-gated) because every plan
  # element requires Clif's approval.
  # ---------------------------------------------------------------------------
  - agent_id: planning_orchestrator
    display_name: "Planning Orchestrator"
    agent_type: orchestrator
    owned_artifact: null
    decision_log_enabled: false          # Plans are the artifact; no separate log needed
    autonomy_level: 2                    # Approval-gated: interactive with human
    capabilities:
      - work_plan_authoring
      - scope_definition
      - prerequisite_evaluation
    policy_ref: planning_orchestrator_policy
    llm_config:
      provider: anthropic
      model: "claude-opus-4-6"           # Deep reasoning for planning
      temperature: 0.0
      max_tokens: 16384
      system_prompt_ref: "prompts/planning_orchestrator.md"

  # ---------------------------------------------------------------------------
  # Pipeline Orchestrator
  #
  # Dispatches mechanical execution against the work plan produced by the
  # planning orchestrator. Level 3 (checkpoint) with checkpoints at stage
  # transitions. Tracks progress, handles failures, reports status.
  # ---------------------------------------------------------------------------
  - agent_id: pipeline_orchestrator
    display_name: "Pipeline Orchestrator"
    agent_type: orchestrator
    owned_artifact: null
    decision_log_enabled: true           # Coordination decisions: dispatch sequencing,
                                         # workflow halt reasoning, cross-artifact reasoning
    autonomy_level: 3                    # Checkpoint-gated: reviews at stage transitions
    capabilities:
      - pipeline_dispatch
      - progress_tracking
      - failure_recovery
      - status_reporting
    policy_ref: pipeline_orchestrator_policy
    llm_config:
      provider: anthropic
      model: "claude-opus-4-6"
      temperature: 0.0
      max_tokens: 8192
      system_prompt_ref: "prompts/pipeline_orchestrator.md"

  # ---------------------------------------------------------------------------
  # Checklist Orchestrator
  #
  # Manages session-level state for checklist-governed functions. More
  # mechanical than the pipeline orchestrator. Level 4 (exception) with
  # target Level 5 after testing. The checklist instance is the authoritative
  # state machine; this orchestrator executes against it.
  # ---------------------------------------------------------------------------
  - agent_id: checklist_orchestrator
    display_name: "Checklist Orchestrator"
    agent_type: orchestrator
    owned_artifact: null
    decision_log_enabled: false          # Checklist instance is the execution record
    autonomy_level: 4                    # Exception-gated; target Level 5 after testing
    capabilities:
      - checklist_execution
      - session_management
      - precondition_verification
      - recovery_procedures
      - verification_hierarchy
    policy_ref: checklist_orchestrator_policy
    llm_config:
      provider: anthropic
      model: "claude-sonnet-4-6"         # Mechanical execution; Sonnet is faster and cheaper
      temperature: 0.0
      max_tokens: 8192
      system_prompt_ref: "prompts/checklist_orchestrator.md"
