# Hook repositories are pinned by commit, not tag: a tag can be moved after
# review. `pre-commit autoupdate --freeze` refreshes both the SHA and the
# `# frozen:` version comment. Keep the ruff pin in step with pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 6fec9b7edb08fd9989088709d864a7826dc74e80  # frozen: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
