name: Dependabot triage

# Surfaces actionable Dependabot alerts (a fix is published, advisory not on the
# accepted-risk allowlist) as a single tracking issue. The built-in Actions
# token cannot read the Dependabot alerts endpoint, so the read uses a
# fine-grained PAT in the DEPENDABOT_ALERTS_TOKEN secret; the script skips
# (exit 0) when that secret is absent, leaving this workflow dormant until it is
# provisioned. Issue writes use the least-privilege GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC, after the weekly Dependabot run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  versions:
    # Shared-component version manifest as job outputs, the same mechanism the
    # other workflows use so there is one way to consume a declared version
    # rather than one per workflow. See `docs/process/shared-version-parity.md`.
    # The reads are assignments, so `set -e` fails this job on a manifest path
    # that does not resolve. That is safe because `versions` is itself a required
    # status check: a failed prelude reports FAILURE and blocks the merge, rather
    # than being laundered into the satisfied-by-skip that a required check
    # missing from the ruleset would produce. Before that context existed the
    # echo form was the safer of the two -- it wrote `k=null` and let the
    # consuming job fail loudly instead. Do not revert to it while `versions`
    # remains required.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.declared.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: versions.json
          sparse-checkout-cone-mode: false
      - id: declared
        run: |
          set -euo pipefail
          python="$(jq -er .python.version versions.json)"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  triage:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `prune-cache: true` is pinned rather than left to the action default:
      # setup-uv v9 flipped that default to false (astral-sh/setup-uv#967) to
      # ease load on PyPI, at the cost of a materially larger saved cache. The
      # budget is real and has tightened: measured 2026-09-07, the repository
      # holds 7.18 GiB against a 10 GB ceiling. An unpruned uv cache at every
      # call site would crowd out entries other jobs depend on, and LRU eviction
      # would report nothing when it did. Drop the pin if the budget stops
      # binding; re-measure before assuming it has.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ needs.versions.outputs.python }}
      - run: uv sync --locked
      - run: .venv/bin/python -m scripts.triage_dependabot_alerts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DEPENDABOT_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
