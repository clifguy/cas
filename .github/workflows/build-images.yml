name: build-images

# Reusable container-image build. Builds the SAGE and CAS BFF images and — when
# called with push enabled and the target registry configured — pushes the
# immutable {version}-{short-sha} tag, plus a moving latest, to that tenant's
# Azure Container Registry. Authoring the build once here keeps the two callers
# from drifting.
#
# The two callers differ in one respect beyond the push. The CI workflow calls
# it with push off and gets the container smoke tests (SMK/BSMK) — it is the
# regression gate, and its images are discarded. The deploy pipeline calls it
# with push on and skips them: it is reached only for a commit whose own CI run
# concluded green, and because every base image is digest-pinned, that run built
# the same bytes from the same commit. The images it builds are the artifact.
#
# One gap follows, and is deliberate rather than overlooked. Nothing in this
# repository enforces the green-commit rule -- it lives in the operator tooling
# that normally dispatches a deploy, and any workflow_dispatch reaches this
# workflow with the push on. A dispatch that bypasses that tooling therefore
# pushes an image no smoke test has seen.
on:
  workflow_call:
    inputs:
      push:
        description: Push the built images to the tenant's registry.
        type: boolean
        default: false
      environment:
        description: GitHub Environment whose registry + deploy identity the push uses.
        type: string
        default: ''
    outputs:
      image_tag:
        description: Immutable {version}-{short-sha} tag the deploy pins the containers to.
        value: ${{ jobs.build.outputs.image_tag }}
      sage_build_version:
        description: The MAJOR.MINOR.PATCH version baked into the images.
        value: ${{ jobs.build.outputs.sage_build_version }}

# OIDC: the push authenticates with the tenant's Entra workload identity
# federated to this repository's GitHub OIDC token. No client secret is stored.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bind the tenant's Environment only when pushing, so the env-scoped registry
    # and deploy-identity variables resolve; the build-only (CI) call binds none.
    environment: ${{ inputs.push && inputs.environment || '' }}
    env:
      PYTHONUNBUFFERED: "1"
    outputs:
      image_tag: ${{ steps.ver.outputs.image_tag }}
      sage_build_version: ${{ steps.ver.outputs.sage_build_version }}
    services:
      # Real Postgres + pgvector for the smoke step's pytest run: tests/deploy/
      # includes suites (e.g. the sharepoint-validate faithful path) that boot
      # the real SAGE REST app, whose storage binding externalizes state to
      # Postgres (CAS-ADR-042). The storage harness creates disposable schemas
      # in this throwaway container DB; SAGE_TEST_PG_DSN (set on the smoke
      # step) points at it.
      #
      # It starts on the push arm too, where nothing consumes it, because
      # `services:` cannot be conditioned on a workflow input. That is a known
      # cost of keeping one job rather than splitting the build in two, not an
      # oversight.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so build_info's git describe can compute the
          # release version baked into the image as SAGE_BUILD_VERSION.
          fetch-depth: 0

      - name: Install uv
        # `prune-cache: true` is pinned rather than left to the action default:
        # setup-uv v9 flipped that default to false (astral-sh/setup-uv#967) to
        # ease load on PyPI, at the cost of a materially larger saved cache. This
        # repo already runs near half the 10 GB Actions cache ceiling, and an
        # unpruned uv cache at every call site would crowd out the entries other
        # jobs depend on. Drop the pin if the cache budget stops binding.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Install test dependencies
        run: uv sync --locked --extra test

      - name: Compute build version and image tag
        id: ver
        # Single-source the version from sage.build_info -- the same
        # MAJOR.MINOR.PATCH (PATCH = commit distance since the last vMAJOR.MINOR.0
        # tag) the dev box, the FastAPI/OpenAPI contract, and the conformance
        # suite resolve. A bare `git describe --abbrev=0` reports only the tag
        # name and would bake the tag floor into every image regardless of commit
        # distance; reusing build_info keeps the baked stamp and the derived image
        # tag honest. Requires the editable install above so `sage` imports.
        run: |
          SAGE_BUILD_VERSION="$(.venv/bin/python -c 'from sage import build_info as b; print(b.RELEASE_VERSION)')"
          SAGE_BUILD_IDENTITY="${GITHUB_SHA:0:7}"
          IMAGE_TAG="${SAGE_BUILD_VERSION}-${SAGE_BUILD_IDENTITY}"
          echo "sage_build_version=${SAGE_BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sage_build_identity=${SAGE_BUILD_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # The GitHub Actions cache backend authenticates with ACTIONS_RUNTIME_TOKEN
      # and ACTIONS_RESULTS_URL. The forge injects those into JavaScript actions
      # but not into `run:` steps, and the builds below are `run:` steps -- so
      # without this the `type=gha` exporter is unauthenticated. It then writes
      # nothing, reads nothing, and reports no error: caching that reads as
      # configured and never happens. Docker's documentation for the backend
      # calls out the manual exposure a hand-invoked buildx needs.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Log in to Azure (OIDC)
        # Ahead of the builds, because the registry arm now pushes from inside
        # the build rather than from a later step. Authenticates with the
        # selected Environment's federated deploy identity; stays dormant until
        # both the AZURE_CLIENT_ID and ACR_LOGIN_SERVER variables are
        # configured. The condition is step-level deliberately -- a job-level
        # `if` cannot see environment-scoped variables and would evaluate empty.
        if: >
          inputs.push
          && vars.AZURE_CLIENT_ID != ''
          && vars.ACR_LOGIN_SERVER != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the tenant's registry
        # Exchanges the workload-identity token for a registry token, which the
        # build steps below need in place before they push.
        if: >
          inputs.push
          && vars.AZURE_CLIENT_ID != ''
          && vars.ACR_LOGIN_SERVER != ''
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az acr login --name "${ACR%.azurecr.io}"

      - name: Build SAGE image
        env:
          SAGE_BUILD_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          SAGE_BUILD_IDENTITY: ${{ steps.ver.outputs.sage_build_identity }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
          # Both halves of the registry gate, resolved once. Step-level env: a
          # job-level one cannot carry a `steps.` context.
          PUSH_TO_REGISTRY: >-
            ${{ inputs.push
            && vars.AZURE_CLIENT_ID != ''
            && vars.ACR_LOGIN_SERVER != '' }}
        run: |
          set -euo pipefail
          args=(--platform linux/amd64
                --build-arg "SAGE_BUILD_VERSION=${SAGE_BUILD_VERSION}"
                --build-arg "SAGE_BUILD_IDENTITY=${SAGE_BUILD_IDENTITY}"
                --cache-from "type=gha,scope=sage-image"
                --cache-to "type=gha,mode=max,scope=sage-image")
          if [ "${PUSH_TO_REGISTRY}" = "true" ]; then
            # Straight to the registry. Loading into the local daemon first
            # would serialise every layer into docker's image format and
            # reimport it, only to upload the same bytes a step later.
            args+=(--push -t "${ACR}/sage:${IMAGE_TAG}" -t "${ACR}/sage:latest")
          else
            # The smoke step below runs against this local tag.
            args+=(--load -t cas-sage:ci)
          fi
          docker buildx build "${args[@]}" .

      - name: Build BFF image
        env:
          SAGE_BUILD_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
          PUSH_TO_REGISTRY: >-
            ${{ inputs.push
            && vars.AZURE_CLIENT_ID != ''
            && vars.ACR_LOGIN_SERVER != '' }}
        run: |
          set -euo pipefail
          args=(--platform linux/amd64
                -f Dockerfile.bff
                --build-arg "SAGE_BUILD_VERSION=${SAGE_BUILD_VERSION}"
                --cache-from "type=gha,scope=bff-image"
                --cache-to "type=gha,mode=max,scope=bff-image")
          if [ "${PUSH_TO_REGISTRY}" = "true" ]; then
            args+=(--push -t "${ACR}/bff:${IMAGE_TAG}" -t "${ACR}/bff:latest")
          else
            args+=(--load -t cas-bff:ci)
          fi
          docker buildx build "${args[@]}" .

      - name: Run container smoke tests (SAGE + BFF)
        # Non-push arm only. The deploy caller reaches this workflow solely for
        # a commit whose own CI run concluded green, and that run built from the
        # same digest-pinned bases and smoked the result -- so running the suite
        # again here re-proves a settled fact against the clock. The one gap is
        # that the green-commit rule is operator-side, not enforced here, so a
        # dispatch that skips it ships an image these tests never saw.
        if: ${{ !inputs.push }}
        env:
          SAGE_TEST_DOCKER: "1"
          SAGE_TEST_IMAGE: "cas-sage:ci"
          SAGE_TEST_IMAGE_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          SAGE_TEST_IMAGE_IDENTITY: ${{ steps.ver.outputs.sage_build_identity }}
          SAGE_TEST_BFF_IMAGE: "cas-bff:ci"
          SAGE_TEST_BFF_IMAGE_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          # Native amd64 runner; no cross-platform emulation overhead.
          SAGE_TEST_DOCKER_PLATFORM: ""
          # Points the storage harness at the Postgres service container above,
          # for the deploy suites that boot the real SAGE app in-process.
          SAGE_TEST_PG_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          .venv/bin/pytest -v --tb=short tests/deploy/
