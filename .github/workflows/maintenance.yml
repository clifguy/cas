name: maintenance

# Out-of-band cloud vault maintenance (CAS-ADR-043/034/029). The irreversible
# operations in SAGE — whole-vault teardown and document purge — stay OFF the
# reachable API surface and off the routine deploy pipeline: they run only when an
# operator dispatches this workflow, selects the tenant Environment (whose required
# reviewer is the approval gate) and the command, and supplies the per-invocation
# request. The bulk reabstract command rides the same path for a different reason:
# it destroys nothing, but it runs for tens of minutes against a whole vault, which
# is well past any synchronous call's ceiling. The workflow does not apply
# infrastructure — the in-VNet maintenance job is already deployed by infra.yml
# (main.bicep); this only applies the request to the job's environment, starts it,
# and waits.
#
# Per-command input semantics (workflow_dispatch caps the input count, so the
# generic target/confirm inputs carry per-command meanings):
#   delete_vault:   target unused; confirm retypes the vault id.
#   purge_document: target is the document id; confirm retypes it.
#   purge_chain:    target is the chain head id; confirm retypes it and
#                   confirm_length retypes the chain length.
#   purge_batch:    target is the ingested-since timestamp, target_extra the
#                   optional ingested-until; confirm retypes the target count.
#   reabstract:     target is the pipeline-status selector (comma-separated, or
#                   `all`; blank selects failed + abstraction_skipped),
#                   target_extra an optional cap on documents swept this run;
#                   confirm retypes the vault id. Re-dispatch semantics follow
#                   the selector: the worklist is recomputed from live pipeline
#                   status each run, so `failed` resumes (documents already
#                   recovered drop out) while `all` redoes every document.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Tenant GitHub Environment (carries its deploy identity + coordinates).
        type: environment
        required: true
      command:
        description: Maintenance operation to run.
        type: choice
        required: true
        options:
          - delete_vault
          - purge_document
          - purge_chain
          - purge_batch
          - reabstract
      vault_id:
        description: Vault id the operation targets (e.g. cas_smoke).
        type: string
        required: true
      target:
        description: 'Operation target: document id / chain head id / ingested-since timestamp / reabstract status selector (unused for delete_vault). Reabstract re-dispatch: ''failed'' resumes (recovered documents drop out); ''all'' redoes.'
        type: string
        required: false
        default: ''
      target_extra:
        description: 'purge_batch: optional ingested-until timestamp (exclusive). reabstract: optional cap on documents swept this run.'
        type: string
        required: false
        default: ''
      confirm:
        description: 'Typed confirmation: retype the vault id (delete_vault/reabstract), the target id (purge_document/purge_chain), or the target count (purge_batch). For the destructive commands this confirms PERMANENT deletion.'
        type: string
        required: true
      confirm_length:
        description: 'purge_chain only: retype the chain length.'
        type: string
        required: false
        default: ''
      apply:
        description: Apply the operation. Leave unchecked for a dry-run (prints the plan or worklist only).
        type: boolean
        default: false
      snapshot:
        description: 'delete_vault only: snapshot before destroy (pg_dump + manifest to the SharePoint archive).'
        type: boolean
        default: true
      reason:
        description: Reason for the operation (recorded in the audit record / deletion receipt).
        type: string
        required: true

concurrency:
  # Never run two maintenance operations against the same tenant concurrently.
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

# OIDC: the tenant's federated deploy identity requests a token; no stored secret.
permissions:
  contents: read
  id-token: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    # Outlasts the retry-inclusive poll budget below *and* leaves room for the
    # post-loop failure diagnostics, which wait on log ingestion before querying.
    # Without that reserve the runner kills the job the moment the poll expires,
    # in exactly the hang the diagnostics were written for.
    timeout-minutes: 140
    # The environment binding is the approval gate: its required reviewer must
    # approve before the job runs, and its scoped variables carry the identity and
    # the resource-group coordinate.
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
      RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      # The per-invocation request. Interpolated into env vars (never into the run
      # script directly), so a crafted input cannot inject shell.
      COMMAND: ${{ inputs.command }}
      VAULT_ID: ${{ inputs.vault_id }}
      TARGET: ${{ inputs.target }}
      TARGET_EXTRA: ${{ inputs.target_extra }}
      CONFIRM: ${{ inputs.confirm }}
      CONFIRM_LENGTH: ${{ inputs.confirm_length }}
      APPLY: ${{ inputs.apply }}
      SNAPSHOT: ${{ inputs.snapshot }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the in-VNet maintenance job and wait
        # Resolve the already-deployed job name from the last deployment's output,
        # apply the per-invocation request to the job's environment
        # (`--set-env-vars` merges, so the baked coordinate env survives), then
        # start the job plain so the execution inherits the full deployed
        # template — a start-time override flag (`--env-vars`, `--image`,
        # `--command`) would make the CLI rebuild the execution's container spec
        # from the flags alone, dropping the image and command. The applied
        # request persists in the job definition until the next run or redeploy
        # overwrites it; the job stays inert between dispatches because nothing
        # starts it. Dry-run is the job's default; APPLY=true is required before
        # any command changes state, and each entrypoint still enforces its typed
        # confirmation(s). The poll budget is derived from the job's own
        # replicaTimeout and the retry limit this dispatch applies, and is spent
        # against the wall clock rather than a count of iterations — the status
        # call's own latency would otherwise shorten an iteration-bounded loop by
        # an unbounded amount, leaving the diagnostics below unreachable in the
        # hang they exist for. So a long reabstract sweep reports its own terminal
        # status rather than timing out here first.
        #
        # Retry posture: the job is deployed with replicaRetryLimit 0, and every
        # dispatch re-pins the limit here — raised for the non-destructive
        # reabstract sweep (whose re-run resumes; see the input semantics above),
        # held at 0 for the destructive commands, whose re-execution stays a
        # deliberate operator dispatch (CAS-ADR-029). The update mutates the
        # standing job spec, so the limit is set on every dispatch rather than
        # only when raised — otherwise a destructive dispatch would inherit a
        # previously raised value.
        #
        # Failure diagnostics: on a pre-start failure no container ever ran, so
        # the log stream returns a container-not-found error and only the
        # Log Analytics system-log table has rows — keyed by JobName_s, because
        # Container App Jobs log with an empty ContainerAppName_s. The workspace
        # id composes from the deployment outputs so the workspace naming
        # convention stays single-sourced in Bicep.
        run: |
          set -euo pipefail
          MAINTENANCE_JOB="$(az deployment sub show --name "$ENVIRONMENT_NAME" \
            --query properties.outputs.maintenanceJobName.value -o tsv)"
          ENV_VARS=("SAGE_MAINTENANCE_COMMAND=$COMMAND")
          RETRY_LIMIT=0
          case "$COMMAND" in
            delete_vault)
              ENV_VARS+=(
                "SAGE_DELETE_VAULT_ID=$VAULT_ID"
                "SAGE_DELETE_CONFIRM=$CONFIRM"
                "SAGE_DELETE_APPLY=$APPLY"
                "SAGE_DELETE_SNAPSHOT=$SNAPSHOT"
                "SAGE_DELETE_REASON=$REASON"
              ) ;;
            purge_document)
              ENV_VARS+=(
                "SAGE_PURGE_VAULT_ID=$VAULT_ID"
                "SAGE_PURGE_DOCUMENT_ID=$TARGET"
                "SAGE_PURGE_CONFIRM=$CONFIRM"
                "SAGE_PURGE_APPLY=$APPLY"
                "SAGE_PURGE_REASON=$REASON"
              ) ;;
            purge_chain)
              ENV_VARS+=(
                "SAGE_PURGE_VAULT_ID=$VAULT_ID"
                "SAGE_PURGE_HEAD_ID=$TARGET"
                "SAGE_PURGE_CONFIRM=$CONFIRM"
                "SAGE_PURGE_CONFIRM_LENGTH=$CONFIRM_LENGTH"
                "SAGE_PURGE_APPLY=$APPLY"
                "SAGE_PURGE_REASON=$REASON"
              ) ;;
            purge_batch)
              ENV_VARS+=(
                "SAGE_PURGE_VAULT_ID=$VAULT_ID"
                "SAGE_PURGE_INGESTED_SINCE=$TARGET"
                "SAGE_PURGE_INGESTED_UNTIL=$TARGET_EXTRA"
                "SAGE_PURGE_CONFIRM=$CONFIRM"
                "SAGE_PURGE_APPLY=$APPLY"
                "SAGE_PURGE_REASON=$REASON"
              ) ;;
            reabstract)
              RETRY_LIMIT=1
              ENV_VARS+=(
                "SAGE_REABSTRACT_VAULT_ID=$VAULT_ID"
                "SAGE_REABSTRACT_STATUSES=$TARGET"
                "SAGE_REABSTRACT_LIMIT=$TARGET_EXTRA"
                "SAGE_REABSTRACT_CONFIRM=$CONFIRM"
                "SAGE_REABSTRACT_APPLY=$APPLY"
                "SAGE_REABSTRACT_REASON=$REASON"
              ) ;;
            *)
              echo "unknown command: $COMMAND"; exit 2 ;;
          esac
          az containerapp job update \
            --name "$MAINTENANCE_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
            --set-env-vars "${ENV_VARS[@]}" \
            --replica-retry-limit "$RETRY_LIMIT" \
            --output none
          EXECUTION="$(az containerapp job start \
            --name "$MAINTENANCE_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
            --query name -o tsv)"
          echo "Started maintenance job execution: $EXECUTION (command: $COMMAND, vault: $VAULT_ID, apply: $APPLY)"
          # Mirrors infra/modules/maintenance-job.bicep; the poll-budget gate binds
          # it to that module's replicaTimeout, so neither number can move alone.
          # RETRY_LIMIT is the limit this dispatch just applied, so a command
          # running without auto-retry gets the tighter budget it warrants.
          REPLICA_TIMEOUT=3600
          # Each attempt's image pull and container start are charged against its
          # replicaTimeout, so the product below bounds them; the slack covers the
          # queue wait before the replica exists and the lag before the execution
          # reports a terminal status after it ends.
          POLL_SLACK=300
          POLL_BUDGET=$(( REPLICA_TIMEOUT * (RETRY_LIMIT + 1) + POLL_SLACK ))
          POLL_DEADLINE=$(( $(date +%s) + POLL_BUDGET ))
          echo "Waiting up to ${POLL_BUDGET}s for the maintenance job to reach a terminal status"
          MAINTENANCE_SUCCEEDED=false
          STATUS=""
          while [ "$(date +%s)" -lt "$POLL_DEADLINE" ]; do
            STATUS="$(az containerapp job execution show \
              --name "$MAINTENANCE_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)"
            echo "maintenance job status: $STATUS"
            case "$STATUS" in
              Succeeded) MAINTENANCE_SUCCEEDED=true; break ;;
              Failed|Degraded|Stopped) echo "maintenance job did not succeed: $STATUS"; break ;;
            esac
            sleep 10
          done
          if [ "$MAINTENANCE_SUCCEEDED" != true ]; then
            echo "maintenance job did not reach Succeeded (last status: ${STATUS:-unknown}); execution record:"
            az containerapp job execution show \
              --name "$MAINTENANCE_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
              --job-execution-name "$EXECUTION" --output json || true
            echo "console logs (absent when no container started):"
            az containerapp job logs show \
              --name "$MAINTENANCE_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
              --execution "$EXECUTION" --container maintenance --tail 100 || true
            az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors || true
            LOG_CUSTOMER_ID="$(az deployment sub show --name "$ENVIRONMENT_NAME" \
              --query properties.outputs.logAnalyticsCustomerId.value -o tsv || true)"
            if [ -n "$LOG_CUSTOMER_ID" ]; then
              echo "system logs from Log Analytics (waiting for ingestion):"
              sleep 120
              az monitor log-analytics query --workspace "$LOG_CUSTOMER_ID" \
                --analytics-query "ContainerAppSystemLogs_CL | where JobName_s == '$MAINTENANCE_JOB' | where TimeGenerated > ago(2h) | order by TimeGenerated asc | project TimeGenerated, Log_s | take 200" \
                --output table || true
              echo "empty system-log output can be ingestion lag; re-run the query in a few minutes"
            else
              echo "deployment outputs carry no logAnalyticsCustomerId; redeploy infra to enable the system-log query"
            fi
            exit 1
          fi
