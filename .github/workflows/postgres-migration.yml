name: postgres-migration
on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true
      generation:
        description: Stable replacement generation (lowercase, 1-12 characters).
        type: string
        required: true
      action:
        type: choice
        options: [prepare, rehearse, cleanup-rehearsal, migrate, rollback]
        required: true
      rehearsal_run_id:
        description: 'Cleanup: original r<workflow-run-id>. Rehearsal: leave empty for a new identity.'
        type: string
        required: false
      confirm:
        description: For migrate or rollback, type the selected generation to authorize downtime.
        type: string
        required: false
concurrency:
  group: cas-tenant-${{ inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
      RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      GENERATION: ${{ inputs.generation }}
      MIGRATION_ACTION: ${{ inputs.action }}
      REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      MIGRATION_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check ownership of the migration fence
        run: bash deploy/postgres-migration-guard.sh migration "$RESOURCE_GROUP_NAME" "$GENERATION"
      - name: Prepare or run the offline migration
        run: bash deploy/postgres-migration.sh
      - name: Retrieve durable rehearsal report
        if: ${{ always() && (inputs.action == 'rehearse' || inputs.action == 'cleanup-rehearsal') && hashFiles('rehearsal-execution.json') != '' }}
        env:
          MIGRATION_ACTION: collect-report
        run: |
          az extension add --name log-analytics --yes --only-show-errors
          bash deploy/postgres-migration.sh
      - name: Retain rehearsal evidence
        if: ${{ always() && (inputs.action == 'rehearse' || inputs.action == 'cleanup-rehearsal') }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-rehearsal-${{ github.run_id }}
          path: |
            rehearsal-execution.json
            rehearsal-report.json
          if-no-files-found: error
          retention-days: 90
