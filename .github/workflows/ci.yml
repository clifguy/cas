name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  paths-filter:
    # Gate frontend jobs (vitest, playwright-e2e) on app/ changes so push
    # events that touch only sage/, root_harness/, docs/, etc. skip the
    # expensive Node + Playwright + browser-install setup (T-0128 AC:
    # "on every push and pull request that touches app/"). The Python
    # jobs below are not gated; they continue to run on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
              - 'tests/fixtures/ci_cas_vault_config.yaml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5-rev1
          restore-keys: |
            hf-${{ runner.os }}-nomic-embed-text-v1.5-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - name: Pre-cache nomic-embed-text model (via runtime path)
        run: |
          .venv/bin/python -c "from sage.adapters.embedding_nomic import NomicEmbeddingProvider; NomicEmbeddingProvider()"

      - name: Run pytest (full suite)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SAGE_TEST_STUB_PROVIDERS: "1"
        run: |
          .venv/bin/pytest -v --tb=short \
            --cov=sage --cov=app \
            --cov-report=term --cov-report=xml \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              log_opts="--no-merges --first-parent ${PR_BASE_SHA}^..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                log_opts="-1"
              else
                log_opts="--no-merges --first-parent ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
            *)
              log_opts=""
              ;;
          esac
          if [ -n "$log_opts" ]; then
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v --log-opts="$log_opts" || true
          else
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v || true
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: 0.15.12

      - run: ruff check --diff .
      - run: ruff format --check .

  lint-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - name: Run lint-imports
        run: |
          .venv/bin/lint-imports

  vitest:
    # Frontend unit tests + TypeScript/Vite build gate for the CAS app
    # (T-0128, T-0140). Pure Node; no Python or backend needed. Gated on
    # app/** changes via paths-filter. The build step (`npm run build` =
    # `tsc -b && vite build`) catches type errors and bundling failures
    # that the dev server (Vite) tolerates silently; this gate exists
    # because pre-T-0140 such errors could sit on main undetected.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Run Vitest
        run: npm test

  playwright-e2e:
    # Playwright e2e for the CAS app (T-0128). Starts SAGE backend via
    # the Playwright webServer block in app/playwright.config.ts.
    # SAGE_TEST_STUB_PROVIDERS=1 short-circuits the Qwen3 MLX provider
    # (MLX is Apple Silicon-only; the runner is ubuntu-latest). The
    # bootstrap step seeds ~/sage_vaults/cas/vault_config.yaml from the
    # checked-in CI fixture so SAGE's lifespan vault-discovery finds a
    # cas vault to ingest the e2e fixtures into.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SAGE_TEST_STUB_PROVIDERS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright Chromium (and system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        # Browser binaries restored from cache, but apt system libs
        # (libnss3, libnspr4, libatk-bridge2.0-0, etc.) are not cached
        # and must be reinstalled on every fresh runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Bootstrap cas and test vaults for SAGE
        run: |
          mkdir -p ~/sage_vaults/cas/sources/imports
          cp tests/fixtures/ci_cas_vault_config.yaml ~/sage_vaults/cas/vault_config.yaml
          mkdir -p ~/sage_vaults/test/sources/imports
          cp tests/fixtures/ci_test_vault_config.yaml ~/sage_vaults/test/vault_config.yaml

      - name: Run Playwright e2e
        working-directory: app
        run: npm run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
