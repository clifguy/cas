name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  paths-filter:
    # Gate frontend jobs (vitest, playwright-e2e) on app/ changes so push
    # events that touch only sage/, root_harness/, docs/, etc. skip the
    # expensive Node + Playwright + browser-install setup (T-0128 AC:
    # "on every push and pull request that touches app/"). The Python
    # jobs below are not gated; they continue to run on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
              - 'tests/fixtures/ci_cas_vault_config.yaml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5-rev1
          restore-keys: |
            hf-${{ runner.os }}-nomic-embed-text-v1.5-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - name: Pre-cache nomic-embed-text model (via runtime path)
        run: |
          .venv/bin/python -c "from sage.adapters.embedding_nomic import NomicEmbeddingProvider; NomicEmbeddingProvider()"

      - name: Run pytest (full suite)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SAGE_TEST_STUB_PROVIDERS: "1"
        run: |
          .venv/bin/pytest -v --tb=short \
            --cov=sage --cov=app \
            --cov-report=term --cov-report=xml \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.12

      - run: ruff check --diff .
      - run: ruff format --check .

  lint-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - name: Run lint-imports
        run: |
          .venv/bin/lint-imports

  vitest:
    # Frontend unit tests for the CAS app (T-0128). Pure Node; no Python
    # or backend needed. Gated on app/** changes via paths-filter.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  playwright-e2e:
    # Playwright e2e for the CAS app (T-0128). Starts SAGE backend via
    # the Playwright webServer block in app/playwright.config.ts.
    # SAGE_TEST_STUB_PROVIDERS=1 short-circuits the Qwen3 MLX provider
    # (MLX is Apple Silicon-only; the runner is ubuntu-latest). The
    # bootstrap step seeds ~/sage_vaults/cas/vault_config.yaml from the
    # checked-in CI fixture so SAGE's lifespan vault-discovery finds a
    # cas vault to ingest the e2e fixtures into.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SAGE_TEST_STUB_PROVIDERS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -e ".[test]"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright Chromium (and system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        # Browser binaries restored from cache, but apt system libs
        # (libnss3, libnspr4, libatk-bridge2.0-0, etc.) are not cached
        # and must be reinstalled on every fresh runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Bootstrap cas vault for SAGE
        run: |
          mkdir -p ~/sage_vaults/cas
          cp tests/fixtures/ci_cas_vault_config.yaml ~/sage_vaults/cas/vault_config.yaml

      - name: Run Playwright e2e
        working-directory: app
        run: npm run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
