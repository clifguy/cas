name: CI

# One run per push, one per landing.
#
# `pull_request` covers work in progress, and the required checks are satisfied
# from that run. `merge_group` is answered but dormant: no merge queue dispatches
# it, because merge queues are offered only on organization-owned repositories.
# The event costs nothing while idle and keeps the workflow ready if that
# changes. `push` is restricted to `main`: unrestricted, it fires alongside
# `pull_request` on the same commit and runs everything twice on every push to a
# branch. It is kept for `main` because the ruleset grants the repository-admin
# role an always-on bypass, so a direct push is reachable and would otherwise get
# no CI at all; because it is the only run whose coverage artifact belongs to a
# `main` commit; and because with no strict up-to-date policy it is the only run
# that sees the merged tree.
#
# The trade the restriction makes: a branch pushed without an open pull request,
# and a tag push, now get no run at all. Open the pull request (draft is enough)
# to get one. See docs/process/branch_protection.md.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  # Per commit for a push, per ref otherwise. A shared per-`main` group holds at
  # most one running and one pending run, so a third landing arriving inside the
  # test job's window evicts the second one's pending run — and the two reasons
  # this workflow runs on `main` at all, an admin-bypass push and a coverage
  # artifact belonging to a `main` commit, are exactly what that eviction takes.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Cancel a superseded pull-request run, and an orphaned queue run left behind
  # when an entry is dequeued and re-queued on an unchanged base. A *later* queue
  # entry never shares this group — the queue ref carries the pull request number
  # — so the only queue run reachable here is that orphan, and leaving it to run
  # would park the live re-queued entry behind it for a full CI duration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  paths-filter:
    # Gate frontend jobs (vitest, playwright-e2e) on app/ changes so runs that
    # touch only sage/, root_harness/, docs/, etc. skip the expensive Node +
    # Playwright + browser-install setup. The Python jobs below are not gated;
    # they run on every event this workflow answers.
    #
    # The filter resolves each event's base itself — the merge group's base_sha,
    # the push event's `before` — and fetches it when the checkout does not
    # already carry it, so this job needs no special checkout depth.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
              - 'tests/fixtures/ci_cas_vault_config.yaml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    services:
      # Real Postgres + pgvector so the storage tests exercise the engine the
      # deployment profiles externalize state to (CAS-ADR-042) instead of
      # skipping. The pgvector image ships the `vector` extension and, being
      # built on the official postgres image, the `pgstattuple` contrib module
      # the bootstrap enables. The storage harness creates disposable schemas
      # in this throwaway container DB; SAGE_TEST_PG_DSN (set on the pytest step)
      # points at it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        # `prune-cache: true` is pinned rather than left to the action default,
        # here and at the other setup-uv call sites in this file: setup-uv v9
        # flipped that default to false (astral-sh/setup-uv#967) to ease load on
        # PyPI, at the cost of a materially larger saved cache. This repo already
        # runs near half the 10 GB Actions cache ceiling, and an unpruned uv cache
        # at every call site would crowd out the entries other jobs depend on --
        # including the Playwright browser bundles this workflow restores. Drop
        # the pin if the cache budget stops binding.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5-rev1
          restore-keys: |
            hf-${{ runner.os }}-nomic-embed-text-v1.5-

      - name: Install dependencies (from lockfile)
        # --locked verifies uv.lock is current with pyproject.toml (a stale or
        # drifted lock fails the build) and installs exactly the resolved set
        # into .venv. torch resolves to the CPU build via the pytorch-cpu index
        # pinned in pyproject; mlx-lm is excluded (Apple-Silicon-only).
        run: uv sync --locked --extra test

      - name: Pre-cache nomic-embed-text model (via runtime path)
        run: |
          .venv/bin/python -c "from sage.adapters.embedding_nomic import NomicEmbeddingProvider; NomicEmbeddingProvider()"

      - name: Run pytest (full suite)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SAGE_TEST_STUB_PROVIDERS: "1"
          # Points the storage harness at the Postgres service container above.
          # The whole suite runs against it: the root conftest pins every
          # stack-config resolution path to this server and isolates tests by
          # schema.
          SAGE_TEST_PG_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          .venv/bin/pytest -v --tb=short \
            -n auto \
            --cov=sage --cov=app \
            --cov-report=term --cov-report=xml \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  storage-deploy-floor:
    # The deployed target is Postgres Flexible Server major 16, while every
    # other Postgres this repository runs against -- the `test` job above, the
    # image build, and the workstation -- is 17. A statement valid only on 17
    # therefore passes every gate and fails at deploy, where it surfaces as a
    # broken release rather than a red check. `ALTER COLUMN ... SET EXPRESSION`
    # is one such statement, and it will not be the only one.
    #
    # This job closes that by running the storage-touching tests against the
    # floor. Scoped to `tests/sage/` rather than the whole suite because the
    # risk is version-specific SQL and DDL, which lives there; running the rest
    # would double the runner minutes to re-prove behaviour that never opens a
    # connection. No coverage upload: the pg17 job above owns that, and two
    # reports of the same lines would race on the artifact name.
    name: storage tests on the deploy floor (pg16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5-rev1
          restore-keys: |
            hf-${{ runner.os }}-nomic-embed-text-v1.5-

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra test

      - name: Pre-cache nomic-embed-text model (via runtime path)
        run: |
          .venv/bin/python -c "from sage.adapters.embedding_nomic import NomicEmbeddingProvider; NomicEmbeddingProvider()"

      - name: Run the storage-touching tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SAGE_TEST_STUB_PROVIDERS: "1"
          SAGE_TEST_PG_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          .venv/bin/pytest -v --tb=short -n auto tests/sage/

  container:
    # Container packaging path: build both images and run the smoke tests
    # (SMK/BSMK) on every event this workflow answers, so a Dockerfile regression cannot merge
    # silently. Together with the native `test` job above this forms the
    # native/container profile matrix. Pushing to a registry is the deploy
    # pipeline's job — each tenant has its own registry, so the per-tenant push
    # lives in infra.yml; here the shared reusable build runs with push disabled.
    uses: ./.github/workflows/build-images.yml
    with:
      push: false
    permissions:
      contents: read
      id-token: write

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Every event this workflow triggers on needs an arm of its own. The
          # default arm below scans the full commit history of every branch
          # rather than the range this event introduced, so it can fail on a
          # secret that has sat on the default branch for months — a mode no
          # pull request ever exercises, and one that would fail the queue for
          # something the change under test did not do.
          #
          # `--first-parent` without `--no-merges`: if a head is a merge commit,
          # dropping merges leaves the range empty, and gitleaks reports success
          # on an empty range. Keeping the merge lets it be diffed against its
          # first parent, which is the incoming change.
          case "$EVENT_NAME" in
            pull_request)
              log_opts="--first-parent ${PR_BASE_SHA}^..${PR_HEAD_SHA}"
              ;;
            merge_group)
              # base_sha is the tip of the default branch, already scanned when
              # it landed, so the range excludes it exactly as the push arm does.
              log_opts="--first-parent ${MERGE_GROUP_BASE_SHA}..${MERGE_GROUP_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                log_opts="-1"
              else
                log_opts="--first-parent ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
            *)
              log_opts=""
              ;;
          esac
          # A ranged scan that selects nothing passes, and so does one whose
          # range is invalid: gitleaks exits 0 in both cases. Neither is a scan.
          # Resolve the range first and fail loudly if it is empty or unusable,
          # so a required check cannot go green having examined no commits.
          if [ -n "$log_opts" ] && [ "$log_opts" != "-1" ]; then
            if ! selected=$(git rev-list --count $log_opts 2>&1); then
              echo "secret scan range is invalid: git rev-list $log_opts: ${selected}" >&2
              exit 1
            fi
            if [ "$selected" -eq 0 ]; then
              echo "secret scan range '$log_opts' selects no commits; refusing to report a scan that examined nothing" >&2
              exit 1
            fi
            echo "secret scan range '$log_opts' selects ${selected} commit(s)"
          fi
          if [ -n "$log_opts" ]; then
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v --log-opts="$log_opts"
          else
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.12

      - run: ruff check --diff .
      - run: ruff format --check .

  lint-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra test

      - name: Run lint-imports
        run: |
          .venv/bin/lint-imports

  eslint:
    # Frontend eslint gate for the CAS app: runs `npm run lint`
    # (eslint . --max-warnings 0, zero errors and zero warnings). Pure Node;
    # gated on app/** via paths-filter like vitest/playwright-e2e so pushes
    # that don't touch app/ skip the Node setup.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

  vitest:
    # Frontend unit tests + TypeScript/Vite build gate for the CAS app.
    # Pure Node; no Python or backend needed. Gated on
    # app/** changes via paths-filter. The build step (`npm run build` =
    # `tsc -b && vite build`) catches type errors and bundling failures
    # that the dev server (Vite) tolerates silently; this gate exists
    # because previously such errors could sit on main undetected.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Run Vitest
        run: npm test

  playwright-e2e:
    # Playwright e2e for the CAS app. Starts SAGE backend via
    # the Playwright webServer block in app/playwright.config.ts.
    # SAGE_TEST_STUB_PROVIDERS=1 short-circuits the Qwen3 MLX provider
    # (MLX is Apple Silicon-only; the runner is ubuntu-latest). The
    # bootstrap step seeds ~/sage_vaults/cas/vault_config.yaml from the
    # checked-in CI fixture so SAGE's lifespan vault-discovery finds a
    # cas vault to ingest the e2e fixtures into.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SAGE_TEST_STUB_PROVIDERS: "1"
      # The e2e SAGE backend binds durable storage to the job's Postgres
      # service container via the checked-in CI stack config; the password
      # travels through the environment, never in config.
      SAGE_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures/ci_stack_config.yaml
      SAGE_PG_PASSWORD: postgres
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    services:
      # Same pgvector image as the test job: the e2e SAGE backend externalizes
      # graph and content state to it (CAS-ADR-042).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Install Python dependencies (from lockfile)
        run: uv sync --locked --extra test

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright Chromium (and system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        # Browser binaries restored from cache, but apt system libs
        # (libnss3, libnspr4, libatk-bridge2.0-0, etc.) are not cached
        # and must be reinstalled on every fresh runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Bootstrap cas and test vaults for SAGE
        run: |
          mkdir -p ~/sage_vaults/cas/sources/imports
          cp tests/fixtures/ci_cas_vault_config.yaml ~/sage_vaults/cas/vault_config.yaml
          mkdir -p ~/sage_vaults/test/sources/imports
          cp tests/fixtures/ci_test_vault_config.yaml ~/sage_vaults/test/vault_config.yaml

      - name: Run Playwright e2e
        working-directory: app
        run: npm run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
