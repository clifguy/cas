name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  paths-filter:
    # Gate frontend jobs (vitest, playwright-e2e) on app/ changes so push
    # events that touch only sage/, root_harness/, docs/, etc. skip the
    # expensive Node + Playwright + browser-install setup (T-0128 AC:
    # "on every push and pull request that touches app/"). The Python
    # jobs below are not gated; they continue to run on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
              - 'tests/fixtures/ci_cas_vault_config.yaml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    services:
      # Real Postgres + pgvector so the storage tests exercise the engine the
      # deployment profiles externalize state to (CAS-ADR-042) instead of
      # skipping. The pgvector image ships the `vector` extension and, being
      # built on the official postgres image, the `pgstattuple` contrib module
      # the bootstrap enables. The storage harness creates disposable schemas
      # in this throwaway container DB; SAGE_TEST_PG_DSN (set on the pytest step)
      # points at it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5-rev1
          restore-keys: |
            hf-${{ runner.os }}-nomic-embed-text-v1.5-

      - name: Install dependencies (from lockfile)
        # --locked verifies uv.lock is current with pyproject.toml (a stale or
        # drifted lock fails the build) and installs exactly the resolved set
        # into .venv. torch resolves to the CPU build via the pytorch-cpu index
        # pinned in pyproject; mlx-lm is excluded (Apple-Silicon-only).
        run: uv sync --locked --extra test

      - name: Pre-cache nomic-embed-text model (via runtime path)
        run: |
          .venv/bin/python -c "from sage.adapters.embedding_nomic import NomicEmbeddingProvider; NomicEmbeddingProvider()"

      - name: Run pytest (full suite)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SAGE_TEST_STUB_PROVIDERS: "1"
          # Pin service construction to the embedded stores; tests that
          # exercise the Postgres binding clear this per-test and use the
          # DSN below.
          SAGE_TEST_STORAGE_BACKEND: "embedded"
          # Points the storage harness at the Postgres service container above so
          # the PG-touching storage tests run here instead of skipping.
          SAGE_TEST_PG_DSN: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          .venv/bin/pytest -v --tb=short \
            --cov=sage --cov=app \
            --cov-report=term --cov-report=xml \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  container:
    # Container packaging path: build both images, run smoke tests (SMK/BSMK),
    # and push tagged images to ACR on pushes to main. Together with the native
    # `test` job above this forms the native/container profile matrix so a
    # Dockerfile regression cannot merge silently.
    # The ACR push step is dormant until both the AZURE_CLIENT_ID and
    # ACR_LOGIN_SERVER repository variables are set after infra deploy (same
    # pattern as infra.yml's AZURE_CLIENT_ID guard); gating login and push on
    # the same pair keeps `az acr login` from running without a prior OIDC login.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
      id-token: write  # OIDC token for ACR push on main
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so build_info's git describe can compute the
          # release version baked into the image as SAGE_BUILD_VERSION.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install test dependencies
        run: uv sync --locked --extra test

      - name: Compute build version and image tag
        id: ver
        # Single-source the version from sage.build_info -- the same
        # MAJOR.MINOR.PATCH (PATCH = commit distance since the last vMAJOR.MINOR.0
        # tag) the dev box, the FastAPI/OpenAPI contract, and the conformance
        # suite resolve. A bare `git describe --abbrev=0` reports only the tag
        # name and would bake the tag floor into every image regardless of commit
        # distance; reusing build_info keeps the baked stamp and the derived image
        # tag honest. Requires the editable install above so `sage` imports.
        run: |
          SAGE_BUILD_VERSION="$(.venv/bin/python -c 'from sage import build_info as b; print(b.RELEASE_VERSION)')"
          IMAGE_TAG="${SAGE_BUILD_VERSION}-${GITHUB_SHA:0:7}"
          echo "sage_build_version=${SAGE_BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build SAGE image
        env:
          SAGE_BUILD_VERSION: ${{ steps.ver.outputs.sage_build_version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "SAGE_BUILD_VERSION=${SAGE_BUILD_VERSION}" \
            --cache-from "type=gha,scope=sage-image" \
            --cache-to "type=gha,mode=max,scope=sage-image" \
            --load \
            -t cas-sage:ci \
            .

      - name: Build BFF image
        env:
          SAGE_BUILD_VERSION: ${{ steps.ver.outputs.sage_build_version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.bff \
            --build-arg "SAGE_BUILD_VERSION=${SAGE_BUILD_VERSION}" \
            --cache-from "type=gha,scope=bff-image" \
            --cache-to "type=gha,mode=max,scope=bff-image" \
            --load \
            -t cas-bff:ci \
            .

      - name: Run container smoke tests (SAGE + BFF)
        env:
          SAGE_TEST_DOCKER: "1"
          SAGE_TEST_IMAGE: "cas-sage:ci"
          SAGE_TEST_IMAGE_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          SAGE_TEST_BFF_IMAGE: "cas-bff:ci"
          SAGE_TEST_BFF_IMAGE_VERSION: ${{ steps.ver.outputs.sage_build_version }}
          # Native amd64 runner; no cross-platform emulation overhead.
          SAGE_TEST_DOCKER_PLATFORM: ""
        run: |
          .venv/bin/pytest -v --tb=short tests/deploy/

      - name: Log in to Azure (OIDC)
        if: >
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && vars.AZURE_CLIENT_ID != ''
          && vars.ACR_LOGIN_SERVER != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push images to ACR
        if: >
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && vars.AZURE_CLIENT_ID != ''
          && vars.ACR_LOGIN_SERVER != ''
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
        run: |
          set -euo pipefail
          az acr login --name "${ACR%.azurecr.io}"
          docker tag cas-sage:ci "${ACR}/sage:${IMAGE_TAG}"
          docker tag cas-sage:ci "${ACR}/sage:latest"
          docker push "${ACR}/sage:${IMAGE_TAG}"
          docker push "${ACR}/sage:latest"
          docker tag cas-bff:ci "${ACR}/bff:${IMAGE_TAG}"
          docker tag cas-bff:ci "${ACR}/bff:latest"
          docker push "${ACR}/bff:${IMAGE_TAG}"
          docker push "${ACR}/bff:latest"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              log_opts="--no-merges --first-parent ${PR_BASE_SHA}^..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                log_opts="-1"
              else
                log_opts="--no-merges --first-parent ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
            *)
              log_opts=""
              ;;
          esac
          if [ -n "$log_opts" ]; then
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v --log-opts="$log_opts"
          else
            /tmp/gitleaks/gitleaks detect --source . --redact --exit-code 2 --no-banner -v
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: 0.15.12

      - run: ruff check --diff .
      - run: ruff format --check .

  lint-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (from lockfile)
        run: uv sync --locked --extra test

      - name: Run lint-imports
        run: |
          .venv/bin/lint-imports

  vitest:
    # Frontend unit tests + TypeScript/Vite build gate for the CAS app
    # (T-0128, T-0140). Pure Node; no Python or backend needed. Gated on
    # app/** changes via paths-filter. The build step (`npm run build` =
    # `tsc -b && vite build`) catches type errors and bundling failures
    # that the dev server (Vite) tolerates silently; this gate exists
    # because pre-T-0140 such errors could sit on main undetected.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

      - name: Run Vitest
        run: npm test

  playwright-e2e:
    # Playwright e2e for the CAS app (T-0128). Starts SAGE backend via
    # the Playwright webServer block in app/playwright.config.ts.
    # SAGE_TEST_STUB_PROVIDERS=1 short-circuits the Qwen3 MLX provider
    # (MLX is Apple Silicon-only; the runner is ubuntu-latest). The
    # bootstrap step seeds ~/sage_vaults/cas/vault_config.yaml from the
    # checked-in CI fixture so SAGE's lifespan vault-discovery finds a
    # cas vault to ingest the e2e fixtures into.
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SAGE_TEST_STUB_PROVIDERS: "1"
      # The e2e SAGE backend has no Postgres service in this job; pin its
      # durable-storage binding to the embedded stores.
      SAGE_TEST_STORAGE_BACKEND: "embedded"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so setuptools-scm can compute the VCS-derived
          # version; a shallow checkout has no tags and falls to fallback_version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Python dependencies (from lockfile)
        run: uv sync --locked --extra test

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright Chromium (and system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        # Browser binaries restored from cache, but apt system libs
        # (libnss3, libnspr4, libatk-bridge2.0-0, etc.) are not cached
        # and must be reinstalled on every fresh runner.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Bootstrap cas and test vaults for SAGE
        run: |
          mkdir -p ~/sage_vaults/cas/sources/imports
          cp tests/fixtures/ci_cas_vault_config.yaml ~/sage_vaults/cas/vault_config.yaml
          mkdir -p ~/sage_vaults/test/sources/imports
          cp tests/fixtures/ci_test_vault_config.yaml ~/sage_vaults/test/vault_config.yaml

      - name: Run Playwright e2e
        working-directory: app
        run: npm run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
