name: teardown-vault

# Out-of-band cloud vault teardown (CAS-ADR-043/034). The most irreversible
# operation in SAGE, kept OFF the reachable API surface and off the routine deploy
# pipeline: it runs only when an operator dispatches this workflow, selects the
# tenant Environment (whose required reviewer is the approval gate), and supplies
# the per-invocation request. The workflow does not apply infrastructure — the
# in-VNet teardown job is already deployed by infra.yml (main.bicep); this only
# starts it, threading the request as job-start environment overrides, and waits.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Tenant GitHub Environment (carries its deploy identity + coordinates).
        type: environment
        required: true
      vault_id:
        description: Vault id to tear down (e.g. cas_smoke).
        type: string
        required: true
      confirm_vault_id:
        description: Retype the vault id to confirm PERMANENT deletion (must match exactly).
        type: string
        required: true
      apply:
        description: Apply the teardown. Leave unchecked for a dry-run (prints the plan only).
        type: boolean
        default: false
      snapshot:
        description: Snapshot before destroy (pg_dump + manifest to the SharePoint archive).
        type: boolean
        default: true
      reason:
        description: Reason for the deletion (recorded in the deletion receipt).
        type: string
        required: true

concurrency:
  # Never tear down the same tenant twice concurrently.
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

# OIDC: the tenant's federated deploy identity requests a token; no stored secret.
permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment binding is the approval gate: its required reviewer must
    # approve before the job runs, and its scoped variables carry the identity and
    # the resource-group coordinate.
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
      RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      # The per-invocation request. Interpolated into env vars (never into the run
      # script directly), so a crafted input cannot inject shell.
      VAULT_ID: ${{ inputs.vault_id }}
      CONFIRM_VAULT_ID: ${{ inputs.confirm_vault_id }}
      APPLY: ${{ inputs.apply }}
      SNAPSHOT: ${{ inputs.snapshot }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the in-VNet vault-teardown job and wait
        # Resolve the already-deployed job name from the last deployment's output,
        # start it with the per-invocation request injected as env-var overrides
        # (the job as deployed bakes none of these, so it is inert until started),
        # and poll to a terminal status. Dry-run is the job's default; APPLY=true is
        # required for any destruction, and the job itself still enforces the typed
        # confirmation (CONFIRM must equal VAULT_ID).
        run: |
          set -euo pipefail
          TEARDOWN_JOB="$(az deployment sub show --name "$ENVIRONMENT_NAME" \
            --query properties.outputs.vaultTeardownJobName.value -o tsv)"
          EXECUTION="$(az containerapp job start \
            --name "$TEARDOWN_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
            --env-vars \
              "SAGE_DELETE_VAULT_ID=$VAULT_ID" \
              "SAGE_DELETE_CONFIRM=$CONFIRM_VAULT_ID" \
              "SAGE_DELETE_APPLY=$APPLY" \
              "SAGE_DELETE_SNAPSHOT=$SNAPSHOT" \
              "SAGE_DELETE_REASON=$REASON" \
            --query name -o tsv)"
          echo "Started teardown job execution: $EXECUTION (vault: $VAULT_ID, apply: $APPLY)"
          TEARDOWN_SUCCEEDED=false
          STATUS=""
          for _ in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --name "$TEARDOWN_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)"
            echo "teardown job status: $STATUS"
            case "$STATUS" in
              Succeeded) TEARDOWN_SUCCEEDED=true; break ;;
              Failed|Degraded|Stopped) echo "teardown job did not succeed: $STATUS"; break ;;
            esac
            sleep 10
          done
          if [ "$TEARDOWN_SUCCEEDED" != true ]; then
            echo "teardown job did not reach Succeeded (last status: ${STATUS:-unknown}); recent logs:"
            az containerapp job logs show \
              --name "$TEARDOWN_JOB" --resource-group "$RESOURCE_GROUP_NAME" \
              --execution "$EXECUTION" --tail 100 || true
            exit 1
          fi
