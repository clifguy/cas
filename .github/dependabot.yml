version: 2
updates:
  # uv.lock is the source of truth for resolved dependencies; the "uv"
  # ecosystem opens lockfile-update PRs (a deliberate, reviewable relock)
  # rather than floating the pyproject.toml >= floors.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
