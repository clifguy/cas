version: 2
updates:
  # Routine uv version-update PRs are disabled (limit 0): the uv ecosystem
  # rewrites pyproject.toml floors/pins rather than doing lockfile-only updates
  # (dependabot-core#12162). Dependencies stay current via a deliberate
  # `uv lock --upgrade` (see CLAUDE.md). Dependabot vulnerability alerts are
  # enabled at the repo level for CVE notifications; automated security-update
  # PRs are intentionally left off, since a uv security PR would hit the same
  # floor-rewrite behavior — a flagged CVE is remediated by a scoped
  # `uv lock --upgrade-package <dep>`. Re-enable lockfile-aware version updates
  # with `versioning-strategy: lockfile-only` once the uv ecosystem supports it.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # npm version-update PRs ARE enabled (unlike uv above): the
  # pyproject-floor-rewrite defect (dependabot-core#12162) that disables uv
  # version-updates is specific to the uv ecosystem and does not affect npm,
  # so the frontend dependency tree gets ordinary lockfile-aware version
  # updates. `directory: /app` targets the app/package.json manifest.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node *runtime* major, not the latest published
      # major. CI and the container SPA build run Node 24 (see ci.yml's
      # setup-node pins), so the type definitions are held to the Node 24 line:
      # a major bump lets code reference newer-Node-only APIs that pass tsc but
      # don't exist at the runtime that builds and tests the bundle. Minor and
      # patch updates within the major still flow. Raise this in lockstep when
      # the Node runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript is held below 7 by typescript-eslint, which declares
      # `peerDependencies.typescript: ">=4.8.4 <6.1.0"`. Every published
      # typescript-eslint release carries that ceiling, so a TS 7 bump aborts
      # `npm ci` with ERESOLVE and reds every npm-dependent job. TS 7 is the
      # native-port rewrite; the lint toolchain has to catch up before the
      # compiler can move, and forcing the resolution would run type-aware lint
      # rules against a parser that does not support the compiler. Minor and
      # patch updates within the major still flow. Drop this ignore once
      # typescript-eslint publishes a peer range admitting TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Group ordering is load-bearing. A dependency joins only the FIRST group
    # whose rules it matches, in the order the groups appear here, so the
    # narrow `react` group must stay above the broad `dev-dependencies` group:
    # `@types/react` and `@types/react-dom` are devDependencies, and reversing
    # the order would pull them out of the react lockstep pair and into the
    # tooling group, reintroducing exactly the split-version breakage the
    # react group exists to prevent.
    groups:
      # react and react-dom are a lockstep pair: React's startup guard aborts
      # the app when the two packages resolve to different versions. Dependabot
      # treats them as independent packages, so an ungrouped run bumps one
      # without the other and breaks the build. Group the react family (runtime
      # packages plus their DefinitelyTyped types) into a single PR so the
      # versions always move together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Remaining devDependencies move as one PR. These are build, lint, and
      # test tooling (vite, vitest, eslint, typescript-eslint, jsdom, globals,
      # the testing-library packages): none of it ships in the bundle, and the
      # blast radius of a routine minor/patch release is a CI signal rather
      # than application behavior.
      #
      # Ungrouped, one week's tooling refresh opens a separate PR per package
      # against a single shared app/package-lock.json. Each landing invalidates
      # the others' lockfile, so they conflict pairwise and must be resolved and
      # re-run one at a time; the work scales with the number of packages rather
      # than with the amount of change. Grouped, it is one PR and one CI run.
      #
      # Majors are deliberately excluded: a breaking tooling change should land
      # in its own PR that can be reviewed and reverted on its own. Production
      # dependencies are excluded as well — they ship to users, so they stay
      # individually reviewable rather than being folded into a tooling batch.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
