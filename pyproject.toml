[project]
name = "cas"
dynamic = ["version"]
description = "Clif's Agentic System: SAGE, ROOT Harness, and CAS Application"
requires-python = ">=3.14"
dependencies = [
    # Hosted abstraction provider (Claude). Cross-platform pure-Python SDK with
    # no Apple-Silicon constraint, so it stays in the base dependency set and the
    # SAGE core can run a hosted-abstraction deployment on any target (CAS-ADR-042).
    "anthropic>=0.40",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "lancedb>=0.33.0",
    "sentence-transformers>=5.5.1",
    # Transitive via sentence-transformers / mlx-lm, but pinned directly to hold a
    # forward-looking ceiling: transformers 5.12 removes get_extended_attention_mask,
    # which nomic-embed-text's remote modeling code still calls at load time. The
    # bound turns a future float across 5.12 into a reviewable lock-time conflict
    # instead of a startup AttributeError. Resolves to 5.9.0 today (no version move).
    "transformers>=5.9,<5.12",
    # Direct so [tool.uv.sources] can route it through the CPU wheel index on
    # Linux (the default PyPI build there is CUDA). Resolved exactly by uv.lock.
    "torch>=2.11.0",
    "einops>=0.8",
    "pyarrow>=24.0.0",
    "python-docx>=1.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11",
    "pypdf>=6.11.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4.0",
    # Postgres storage engine: async driver + connection pool (`pool` adds
    # psycopg_pool's AsyncConnectionPool) and pgvector type registration
    # (CAS-ADR-042). Serving-path runtime dependencies since the local
    # profile's durable-storage binding defaults to the Postgres adapters;
    # the embedded SQLite/LanceDB fallback needs neither.
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.150",
    "jsonschema[format]>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "import-linter>=2.11",
]
mlx = [
    # Apple-Silicon-only; the marker keeps it out of the Linux resolution path
    # so the universal lock resolves (no Linux wheels exist for mlx-lm).
    "mlx-lm>=0.31.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
ocr = [
    "ocrmypdf>=16.0",
]
dev = [
    "ruff==0.15.12",
    "pre-commit>=4.0",
]

# Recompute the dynamic (setuptools-scm) version when the git commit or tags
# change, so an editable rebuild reflects new commits and the release tag.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# torch is a CPU-only workload everywhere (no CUDA). On Linux the default PyPI
# build is the large CUDA wheel, so route torch to the PyTorch CPU index there;
# on macOS the PyPI wheel is already CPU/MPS (the CPU index has no macOS wheels),
# so fall back to PyPI. The lock records the exact resolved build per platform.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.setuptools.packages.find]
include = ["sage*", "root_harness*", "app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "S"]
preview = false

[tool.ruff.lint.isort]
known-first-party = ["sage", "root_harness", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
# Ruff's defaults: double-quote, magic-trailing-comma, LF line endings.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
branch = false
source = ["sage", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
# Floor is baseline minus 2 percentage points; baseline 91% observed in CI.
fail_under = 89

[tool.importlinter]
root_packages = ["sage"]

[[tool.importlinter.contracts]]
name = "Services do not import from routers"
type = "forbidden"
source_modules = ["sage.services"]
forbidden_modules = ["sage.api.routers"]

[[tool.importlinter.contracts]]
name = "Routers do not import from storage directly"
type = "forbidden"
source_modules = ["sage.api.routers"]
forbidden_modules = ["sage.storage"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Models are a leaf layer"
type = "forbidden"
source_modules = ["sage.models"]
forbidden_modules = [
    "sage.api",
    "sage.services",
    "sage.storage",
    "sage.adapters",
    "sage.source_adapters",
    "sage.mcp_init",
    "sage.mcp_server",
    "sage.vault_management",
]

[[tool.importlinter.contracts]]
name = "Storage and adapters do not import from upstream layers"
type = "forbidden"
source_modules = [
    "sage.storage",
    "sage.adapters",
    "sage.source_adapters",
]
forbidden_modules = [
    "sage.api",
    "sage.services",
    "sage.mcp_init",
    "sage.mcp_server",
    "sage.vault_management",
]

[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

# VCS-derived versioning: the version is computed from git tags + commits,
# single-sourcing it from the repository instead of a hand-edited literal. The
# running version (sage.build_info.RELEASE_VERSION) is MAJOR.MINOR.PATCH with
# PATCH = commit distance since the last vMAJOR.MINOR.0 tag, read live from git
# at import; a build-time-baked SAGE_BUILD_VERSION env stamp and then this
# setuptools-scm metadata are the successive no-git fallbacks, where
# ``no-guess-dev`` keeps the commit distance in the ``.devN`` segment that
# build_info parses. The committed OpenAPI info.version tracks only MAJOR.MINOR,
# so it does not churn between minor releases. No ``version_file`` is written: a
# generated, tracked module would leave the working tree perpetually dirty.
# ``fallback_version`` mirrors build_info's runtime ``unknown`` degradation when
# built outside a git checkout.
[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
