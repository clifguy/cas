[project]
name = "cas"
version = "0.1.0"
description = "Clif's Agentic System: SAGE, ROOT Harness, and CAS Application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
    "einops>=0.8",
    "pyarrow>=17.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.150",
    "jsonschema[format]>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "import-linter>=2.0",
]
mlx = [
    "mlx-lm>=0.20",
]
ocr = [
    "ocrmypdf>=16.0",
]
dev = [
    "ruff==0.15.12",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["sage*", "root_harness*", "app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "S"]
preview = false

[tool.ruff.lint.isort]
known-first-party = ["sage", "root_harness", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
# Ruff's defaults: double-quote, magic-trailing-comma, LF line endings.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
branch = false
source = ["sage", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
# T-0065: floor is baseline - 2. Baseline 91% observed in CI run 25975319154 (commit a8f191e).
fail_under = 89

[tool.importlinter]
root_packages = ["sage"]

[[tool.importlinter.contracts]]
name = "Services do not import from routers"
type = "forbidden"
source_modules = ["sage.services"]
forbidden_modules = ["sage.api.routers"]

[[tool.importlinter.contracts]]
name = "Routers do not import from storage directly"
type = "forbidden"
source_modules = ["sage.api.routers"]
forbidden_modules = ["sage.storage"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Models are a leaf layer"
type = "forbidden"
source_modules = ["sage.models"]
forbidden_modules = [
    "sage.api",
    "sage.services",
    "sage.storage",
    "sage.adapters",
    "sage.source_adapters",
    "sage.mcp_init",
    "sage.mcp_server",
    "sage.vault_management",
]

[[tool.importlinter.contracts]]
name = "Storage and adapters do not import from upstream layers"
type = "forbidden"
source_modules = [
    "sage.storage",
    "sage.adapters",
    "sage.source_adapters",
]
forbidden_modules = [
    "sage.api",
    "sage.services",
    "sage.mcp_init",
    "sage.mcp_server",
    "sage.vault_management",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
