# SAGE Core API stack-wide configuration (CAS-ADR-030, T-0103).
#
# Per ADR-030, the abstraction provider and model identifier live here at
# stack scope rather than in each vault's vault_config.yaml. The local MLX
# provider is enforced as a SAGE-process-wide singleton; co-locating the
# config with the resource boundary avoids the layering contradiction
# that surfaced when per-vault model pins silently skipped vaults at
# startup. Per-vault knobs (enabled, token-budget tuning) remain in the
# vault config's `abstraction:` block.
#
# Schema: docs/fs/sage/sage_core_config.schema.json (v0.9).

# Deployment-profile marker (CAS-ADR-042). The single stack-scope selection
# that co-binds the adapter-port implementations for one deployment target.
# `local` -- the on-box, single-process deployment -- is the only profile
# available today; it is resolved once at startup and its bindings are the
# current behavior. An unrecognized value fails loud at startup.
profile: local

# Durable-storage binding selector (CAS-ADR-042). `postgres`, the storage
# port's sole binding, binds the graph and content stores to the Postgres
# adapters configured by the `postgres:` block below (each vault's rows live
# in a Postgres schema named by its vault id). See
# docs/process/postgres-local-runtime.md.
storage_backend: postgres

# Vault-source-store binding selector (CAS-ADR-043). `filesystem` persists each
# vault's configuration declaration and retained ingest source files under the
# vault root on local disk -- the on-box default, durable here. `document_store`
# selects the tenant-native external binding for a stateless deployment where the
# local filesystem is ephemeral. Independently selectable from either profile;
# like `storage_backend`, flipping it repoints the binding at restart and never
# moves data. Caller-local files reach a cloud-hosted vault through the
# transfer channel, not through this binding: when the server cannot read the
# caller's filesystem, the path-bearing MCP tools return a token-gated
# transfer recipe and the caller's environment moves the bytes (the cloud
# deployment's `transfer:` block declares the public endpoint base).
vault_source_backend: filesystem

abstraction:
  # Dispatch key. `local-mlx` loads the local MLX provider (Qwen3) with the
  # model identifier below. `anthropic` loads the hosted Claude provider
  # (model below = a Claude model id, e.g. claude-haiku-4-5; the API key is
  # read from ANTHROPIC_API_KEY) -- the option that lets this stack run on a
  # non-Apple target. `stub` opts the whole stack out of semantic abstract
  # generation (test/dev only).
  provider: local-mlx

  # LLM model identifier passed to the provider factory. The chosen
  # model is shared by every vault on this SAGE process.
  #
  # Qwen3-8B-4bit (the cas vault was already pinned to this via T-0084;
  # see also the operational note in T-0103). The 30B variant
  # (example_vault and editorial used it previously) trips the RAM warning
  # documented in CLAUDE.md (~38 GB resident with the rest of the SAGE
  # process). Existing 30B-generated abstracts in those vaults remain
  # unchanged per the T-0103 ticket ("no reabstract").
  model: mlx-community/Qwen3-8B-4bit

# Postgres storage-engine connection parameters (CAS-ADR-042). Both deployment
# targets externalize durable graph + content state to Postgres -- a local unix
# socket here, a managed endpoint in the cloud. Non-secret values only: the
# password (when a TCP/cloud endpoint needs one) is read from
# $SAGE_PG_PASSWORD, never from this file. Consumed by the live storage
# binding, the provisioning CLI (scripts/bootstrap_postgres.py), and the
# storage test harness. The local on-box default below connects over the unix
# socket as the OS user (peer auth, no password). The values here equal the
# schema/Pydantic defaults; they are spelled out for discoverability. pg_repack
# is enabled separately per docs/process/postgres-local-runtime.md (it is not
# in every target's allowlist).
postgres:
  host: null            # null => local unix-domain socket
  port: 5432
  database: sage
  user: null            # null => operating-system user (peer auth)
  sslmode: null         # e.g. "require" for a managed hosted endpoint
  min_pool_size: 1
  max_pool_size: 10
  extensions:
    - vector
    - pgstattuple
