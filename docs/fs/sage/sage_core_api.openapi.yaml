# =============================================================================
# SAGE Core API — OpenAPI Specification
# =============================================================================
#
# Formal Substrate artifact for CAS (Clif's Agentic System).
# Target path: ~/repos/cas/docs/fs/sage/sage_core_api.openapi.yaml
#
# Source authority: SAGE Architecture Reference, Section 7 (Core API
# Operations) and supporting sections (Object Model, Retrieval Architecture,
# Access Control and Governance, Lifecycle State Machine).
#
# This specification defines the REST surface consumed by the MCP adapter,
# the CAS Application (human-facing client), and any future protocol adapter.
# MCP tool schemas are derived from this spec by the MCP adapter layer; they
# are not defined here.
#
# Architectural invariants enforced by this API:
#   - No-delete invariant: documents are never deleted (SAGE Architecture
#     Reference §6.4); supersession and archival are the lifecycle
#     mechanisms. Edges may be removed via DELETE /sage_vaults/{vault_id}/
#     edges/{edge_id} (unlink) since the no-delete invariant applies to
#     documents only.
#   - Vault isolation: every endpoint is scoped to a single vault.
#   - Named operations: set_lifecycle and update_metadata are separate
#     endpoints per CAS-ADR-014.
#
# Related CAS ADRs: 001, 008, 011, 014.
# =============================================================================

openapi: "3.1.0"

info:
  title: SAGE Core API
  version: "2.2"
  description: >-
    Protocol-neutral Core API for SAGE (Salience-Aware Graph Engine). Exposes
    discovery, ingestion, lifecycle management, graph operations, and access
    control for a vault-scoped knowledge infrastructure system.


    This document is served by the deployment it describes and is reachable
    without a token, so it is self-contained: everything below is what a client
    needs beyond the operations themselves.


    ## Surfaces


    The paths under `/sage_vaults` are the Core API. The paths under `/app` are
    the web client's backend-for-frontend: the same server hosts them, they are
    usable directly, and they authenticate by browser session rather than by
    bearer token. SAGE also serves a Model Context Protocol endpoint at `/mcp`,
    which is a separate surface — an MCP client never calls the paths here, and
    a REST client never calls `/mcp`.


    ## Vault scoping


    Every Core API operation is scoped to a single vault and takes its id as the
    first path segment, `/sage_vaults/{vault_id}/...`. Three operations are not:
    `GET|POST /sage_vaults`, which list and create vaults, and the two transfer
    byte legs, whose vault binding travels inside the transfer token. No
    operation spans vaults.


    A vault id is supplied by the deployment's operator. `GET /sage_vaults`
    lists every vault on the deployment; the listing is not filtered per caller,
    and a valid token reaches every vault it names. There is no per-vault grant
    to request and no per-vault scope to add to a token, so provisioning is
    binary: a caller either has access to a deployment or does not.


    ## Two error envelopes


    They differ by origin, and a client has to handle both.


    Authentication failures (401 and 403) come from middleware ahead of the
    router, follow RFC 6750, and carry a `WWW-Authenticate` header naming the
    protected-resource metadata document:
    `{"error": "invalid_token", "error_description": "..."}`.


    Application errors (400, 404, 409, 413, 422) come from the API itself and
    carry `{"code": ..., "message": ..., "detail": {...}}`. Branch on `code`,
    never on `message`. `detail` is omitted when empty and its keys vary by
    `code`. The per-operation response descriptions below name the `code` values
    each operation can return.


    ## Invariants


    Documents are never deleted. There is no document DELETE, by design:
    supersession and archival are the lifecycle mechanisms, and a replacement is
    ingested as a successor carrying `predecessor_id`. Edges may be deleted, via
    `DELETE /sage_vaults/{vault_id}/edges/{edge_id}` — the no-delete rule covers
    documents only.


    ## File transfer is two-phase


    The server cannot see a caller's filesystem, so moving bytes in either
    direction is a mint-then-move handshake rather than a single call.


    To ingest a local file, `POST /sage_vaults/{vault_id}/documents` naming the
    source path returns a status of `upload_required` and a recipe carrying a
    `transfer_id` and a `PUT /upload` target. Move the bytes to that target,
    then repeat the ingest call citing the `transfer_id`.


    To retrieve document bytes,
    `GET /sage_vaults/{vault_id}/documents/{document_id}/download-url` mints a
    `GET /download/{transfer_id}` URL; fetch the bytes there. The sibling
    `.../content` operation returns bytes inline instead and fails with
    `content_too_large` above the inline ceiling, so prefer the transfer path
    for anything large.


    Both transfer legs are exempt from the bearer requirement because authority
    travels in the `transfer_id`, which is single-use and expiring. Treat it as
    a credential.


    ## Unauthenticated paths


    Every operation below requires a bearer token except the two transfer legs.
    Outside the documented surface, the liveness probe `/health`, this document
    at `/openapi.json`, and the OAuth discovery documents under `/.well-known/`
    are also reachable without one. The rendered explorers at `/docs` and
    `/redoc` are not.
  contact:
    name: CAS Project
  license:
    name: Proprietary

servers:
  - url: https://sage.{baseDomain}
    description: >-
      A deployed SAGE edge. Each deployment owns its own domain, Entra tenant,
      and audience, so `baseDomain` selects the target deployment.
    variables:
      baseDomain:
        default: cor.org
        description: Owned base domain of the target deployment.
  - url: http://localhost:8000
    description: Local profile. Authentication is disabled by default.

# Every operation requires a bearer token except the health probe and the two
# transfer byte-legs (PUT /upload, GET /download/{transfer_id}), whose
# authority travels in a single-use transfer_id rather than the Authorization
# header. Those three are declared with an empty `security: []` override.
security:
  - entraBearer: []

# =============================================================================
# Paths
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # Retrieval
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/discover:
    post:
      operationId: search
      summary: Retrieve documents by semantic search, keyword search, catalog enumeration, or deterministic extraction.
      description: >-
        The primary retrieval operation. Supports four modes:


        - **semantic**: Vector similarity search, optionally fused with BM25
          keyword matching. Returns ranked chunks with relevance scores.

        - **keyword**: BM25-only search. No embedding required. Terms are
          conjunctive: a chunk matches only if it carries every term, so each
          term added narrows the result and can empty it. A quoted phrase
          matches as a unit; a term prefixed with `-` is excluded; terms joined by
          or admit either. When a query of bare terms returns nothing,
          `hints.warnings` names the terms the query parsed to -- stopwords are
          dropped and the rest stemmed, so they are not the words typed. The
          other forms carry their own advisory or, where every term is
          optional, none.

        - **catalog**: Filter-only document enumeration via SQL. No vector
          search, no chunk content. Supports pagination via limit + offset.

        - **deterministic**: Exact content extraction by document ID and heading
          path. Bypasses vector search entirely. Used for governed content
          transfer between documents or agents.


        Results can be scoped (all, authoritative, specific, filtered) and
        filtered by metadata criteria.
      tags: [Retrieval]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverRequest"
      responses:
        "200":
          description: Retrieval results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverResponse"
        "400":
          description: Invalid parameters (unknown mode, scope, or filter field).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vault not found, or document not found (for specific/deterministic scope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Document Lifecycle and Metadata
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/lifecycles:
    post:
      operationId: update_lifecycles
      summary: Apply one or more lifecycle state transitions in a single call.
      description: >-
        Accepts N>=1 per-item transition requests per CAS-ADR-029 v4
        plural-noun convention. Each item carries `document_id`,
        `action`, and optional `successor_id`. Items are processed in
        order, each holding the per-document lock and a per-item
        database transaction. Length-1 is fully supported.


        **The action vocabulary is vault-config-defined**, not a fixed
        SAGE-wide set. Read `lifecycle.transitions` in the vault config
        (`GET /sage_vaults/{vault_id}/config`) for the authoritative
        list of `(from_state, action, to_state, creates_edge)` tuples
        in the target vault.


        **The `supersede` action is the canonical atomic form for
        replacing one document with another.** It both transitions the
        predecessor AND creates the `supersedes` edge (new → old) in a
        single operation. The predecessor's transition is the one the
        vault's table declares, not a fixed pair: the gate admits
        `supersede` from whichever `from_state` rows the table carries
        for it and moves the predecessor to that row's `to_state`. A
        vault declaring `completed --supersede--> archived` admits a
        completed predecessor directly, with no walk-back to `active`
        first. The alternative two-step pattern -- `POST /edges` with
        `edge_type=supersedes` followed by `POST /lifecycles` with
        `action=archive` -- ends in the same state but is required only
        when patching up an already-archived predecessor whose
        supersedes edge is missing.


        **The batch is NOT atomic.** A per-item `SAGEError` surfaces in
        the response's per-item error envelope but does not roll back
        earlier-or-later successful items. The endpoint returns HTTP
        200 even when some items fail; callers must inspect each
        `BulkLifecycleItemResult.status` and the aggregate
        `success_count` / `error_count` fields. HTTP 404 is reserved
        for the unknown-vault case; HTTP 422 covers request-body shape
        validation.


        Per-item error codes: `document_not_found` (the item's own
        document, or a `supersede` successor that does not exist),
        `invalid_action`, `invalid_lifecycle_transition` (carrying the
        `valid_actions` for the state the document is in), and
        `missing_successor_id`. Each appears as a per-item error
        envelope rather than as a batch-level 400/409.


        Two codes that belong to ingest do not appear here.
        `supersede_target_not_active` is the ingest surface's code for a
        predecessor whose state does not permit `supersede`; on this
        surface the same condition is `invalid_lifecycle_transition`,
        which is also what catches an already-superseded predecessor,
        through the absent `archived --supersede-->` row rather than a
        separate chain-head check. `identical_content_supersede`
        compares content hashes, which this surface never reads. A
        non-terminal `pipeline_status` is not among them either, on
        `complete` or on any other action: the transition applies and
        the item's `warnings` carries the pipeline-still-in-progress
        advisory. Waiting for a terminal `pipeline_status` is a
        judgement about whether to record a resting state on a document
        whose abstraction may still fail -- not a way to avoid a
        refusal, because none is raised.


        Empty `items` is valid: the response carries an empty `results`
        array and all counts are zero.
      tags: [Document Lifecycle]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLifecycleRequest"
      responses:
        "200":
          description: >-
            Batch processed. The response carries per-item outcomes
            (success or error envelope) and aggregate counts. A 200
            does NOT mean every item succeeded; check `error_count`
            and each `BulkLifecycleItemResult.status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLifecycleResponse"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/metadata:
    post:
      operationId: update_metadata
      summary: Patch mutable metadata fields on one or more documents.
      description: >-
        Accepts N>=1 per-item patch requests per CAS-ADR-029 v4
        plural-noun convention. Each item carries `document_id` plus
        any subset of the patchable metadata fields (`title`,
        `version_label`, `project`, `tags`, `doc_type`,
        `authority_scope`, `document_date`, `tier3_metadata`,
        `expected_version`). Items are processed in order, each holding
        the per-document lock and a per-item database transaction.
        Length-1 is fully supported.


        Scalars use set-or-omit semantics per item; list-valued fields
        (today: `tags`) take a `ListFieldPatch` ops-object
        (`{add, remove}`); `tier3_metadata` takes a `Tier3Patch`
        ops-object (`{set, unset}`). The ops-object shape is the
        substrate's concurrency-safety contract (CAS-ADR-038). The
        bare-list / bare-dict forms are no longer accepted.


        Per CAS-ADR-021, every successful per-item patch sets
        `metadata_confirmed=true` on the target document. The
        `doc_type` value must be one of the values defined under
        `document_types.doc_types` in the vault config; query
        `GET /sage_vaults/{vault_id}/config` for the authoritative
        list.


        **The batch is NOT atomic.** A per-item `SAGEError` surfaces in
        the response's per-item error envelope but does not roll back
        earlier-or-later successful items. The endpoint returns HTTP
        200 even when some items fail; callers must inspect each
        `BulkMetadataItemResult.status` and the aggregate
        `success_count` / `error_count` fields. HTTP 404 is reserved
        for the unknown-vault case; HTTP 422 covers request-body shape
        validation.


        Per-item error codes: `document_not_found`, `invalid_doc_type`,
        `tags_add_conflict`, `tags_remove_conflict`,
        `tag_patch_overlap`, `tier3_unset_conflict`,
        `tier3_patch_overlap`, `patch_empty`, `tier3_schema_violation`,
        `tier3_doc_type_change_stale_keys`, `legacy_form`,
        `stale_read`. Each appears as a per-item error envelope rather
        than as a batch-level 400/409.


        Empty `items` is valid: the response carries an empty `results`
        array and all counts are zero.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMetadataRequest"
      responses:
        "200":
          description: >-
            Batch processed. The response carries per-item outcomes
            (success or error envelope) and aggregate counts. A 200
            does NOT mean every item succeeded; check `error_count`
            and each `BulkMetadataItemResult.status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMetadataResponse"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `stale_read`: a per-item `expected_version` does not match
            the target document's current version (CAS-ADR-038
            Primitive B). Detail carries `document_id`,
            `expected_version`, and `current_version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Ingestion
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/documents:
    post:
      operationId: ingest_document
      summary: Ingest a source artifact into the vault.
      description: >-
        Triggers the three-stage ingestion pipeline:

        1. **Projection**: The source adapter reads the native format and
           produces structured text with heading hierarchy metadata.

        2. **Indexing**: The projection is chunked and embedded into the
           content store.

        3. **Abstraction**: A local LLM generates a density-proportional
           semantic abstract (if enabled in vault configuration).


        The HTTP endpoint runs all three stages synchronously and returns
        with `pipeline_status` at its terminal value
        (`abstraction_complete`, `abstraction_skipped`, or `failed`).
        This sequential execution bounds peak memory at one document's
        worth of embeddings and abstraction context (BH-026, BH-068),
        which is what the bulk-ingest callers rely on.


        The MCP `ingest_document` tool wraps this same service but dispatches
        Stages 2-3 as a background task and returns in seconds with
        `pipeline_status` at a non-terminal value (typically
        `indexing_in_progress`). MCP callers wait for a terminal
        `pipeline_status` on the document to observe the outcome, as a single
        bounded wait rather than one status read per unit of caller work. A
        wait must also accept `abstraction_interrupted`, which means the queue
        draining the work was stopped before it finished and the next server
        start re-runs it. This
        exists because the MCP client transport imposes a 60-second RPC timeout
        that abstraction on large documents can exceed (BH-130).


        If `predecessor_id` is provided, the supersede lifecycle
        transition (creating the `supersedes` edge and archiving the
        predecessor) runs synchronously with document record insertion,
        before Stages 2-3 begin. The version chain is complete the
        moment the call returns, regardless of pipeline-stage timing
        (BH-129).


        Records provenance: source_content_hash, adapter_version, created_by.


        Per CAS-ADR-021, callers are authoritative for metadata. Pass
        prepared values in the request body's metadata fields and leave
        `needs_review` at its default `false`; the document is
        committed with caller-supplied values authoritative and
        `metadata_confirmed=true`. Set `needs_review=true` to defer to
        the metadata-review queue: filename inference runs, parsed
        values populate fields the caller did not supply (the specific
        fields are vault-config-defined; see
        `metadata_extraction.filename_extraction` in
        `GET /sage_vaults/{vault_id}/config`), and the document is
        held with `metadata_confirmed=false` until a reviewer confirms
        via `POST /sage_vaults/{vault_id}/metadata`.
      tags: [Ingestion]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "201":
          description: >-
            Document record created. For the REST surface, the pipeline
            has reached a terminal `pipeline_status` value
            (`abstraction_complete`, `abstraction_skipped`, or
            `failed`) by the time this response returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: >-
            `adapter_not_found`: no source adapter is registered
            for `source_type`.


            `vault_source_path_refused`: the vault-source store refused
            the destination it would have retained the source at.


            `expected_head_version_requires_predecessor`:
            `expected_head_version` was supplied without
            `predecessor_id`. The token is bound to the chain head
            identified by the predecessor (CAS-ADR-038 Primitive C).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `source_file_not_found`: `source` does not resolve to a
            readable file on disk; or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `duplicate_content`: a document with the same `source_path`
            and content hash already exists. Use `force: true` to
            bypass detection and re-run the pipeline.


            `force_reingest_path_mismatch`: `force: true` and the
            content-hash match resolves to a document stored at a
            different `source_path` than `source`, without a
            `document_id` confirming the target. Force-reingest keys the
            record to reuse by content hash alone, so a byte-identical
            file at a different path can collide with an unrelated
            document; pass `document_id` to confirm the intended record.
            Detail carries `existing_document_id`, `existing_source_path`,
            `new_source_path`, and `source_content_hash`.


            `supersede_target_not_active`: `predecessor_id` was set but
            the vault's lifecycle transition table does not permit
            `supersede` from the predecessor's current state. Detail
            carries `current_state` and the `allowed_states` the table
            does permit; a table permitting `supersede` from no state
            reports an empty `allowed_states` and a `required_state` of
            `(none)` rather than naming a state the vault does not
            permit. There is no one remedy, because there is no one
            table: read `allowed_states`, or the vault's
            `lifecycle.transitions` via
            `GET /sage_vaults/{vault_id}/config`, for the states this
            vault admits. A vault may permit `supersede` from
            `completed` or another non-`active` state, in which case the
            predecessor needs no walk-back at all. Where one is needed,
            move the predecessor to a permitted state directly from
            where it stands via
            `POST /sage_vaults/{vault_id}/lifecycles` -- `reactivate`
            from `completed`, where the table declares it -- rather than
            archiving first, which records shipped work as dropped for
            the length of the walk.


            `identical_content_supersede`: the new file's content hash
            matches the predecessor's; supersede chains require
            distinct content per step.


            `stale_chain_head`: `expected_head_version` was supplied
            and did not match the predecessor's current `updated_at`
            at supersede time. Detail carries the current head id and
            version so the caller can pivot through the chain and
            retry (CAS-ADR-038 Primitive C).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Ingestion failure. The source adapter could not produce a
            valid projection (unsupported format, corrupt content).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that opened no usable upload session. Resolve it at the store before
            retrying; `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, a transient backend
            signal, an upload session it expired. The same request may succeed
            on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sage_vaults/{vault_id}/documents:batch:
    post:
      operationId: batch_ingest_documents
      summary: Upload files and run the batch-ingest pipeline server-side, streaming SSE progress.
      description: >-
        Hosted-profile bulk-ingest surface (CAS-ADR-042). Accepts uploaded
        file content as multipart/form-data -- the BFF and SAGE share no
        filesystem in the cloud profile, so content is delivered by upload
        rather than by path -- stages each file under the SAGE process with
        its original filename preserved, then runs the same three-phase batch
        pipeline -- plan the edges, ingest each file, then resolve the planned
        edges -- that the co-located profile drives in-process. Both profiles
        therefore produce equivalent ingest summaries.


        The `metadata` form field is a JSON-encoded BatchIngestUploadMetadata
        whose `files` array aligns by position with the uploaded file parts.
        `needs_review` and `infer_edges` are caller inputs (CAS-ADR-021): the
        CAS bulk-ingest workflow sets needs_review=true so every document
        lands in the metadata-review queue.


        Response is `text/event-stream`: per-file state transitions surface as
        `progress` events (status = started / completed / failed); a final
        `summary` event carries the batch counts. A per-file failure does not
        end the stream: it is collected into the summary's `errors`
        (BatchIngestFileError entries), where a typed SAGE error carries its
        code and detail and names the file as the caller uploaded it, never
        the server-side staging path. Edge resolution can refuse
        planned edges rather than create them -- notably a Tier-1 supersession
        whose target cannot be read, does not exist, or is in a lifecycle
        state that does not permit the transition; refusals are counted in the
        summary's `edges_dropped` and reported per edge in `edge_warnings`
        (EdgeWarning entries). The 400 and 404 error paths
        resolve synchronously BEFORE the stream is opened and return an
        application/json ErrorResponse envelope with no SSE events emitted.


        A failure of the batch itself, which can only surface after the 200
        is committed, ends the stream: it emits no further events -- there is
        no `error` event variant -- and closes the connection without a
        `summary`. A stream that ends without one did not complete, and the
        cause is logged server-side rather than sent. Clients should treat
        the `summary` event, not the end of the stream, as the completion
        signal.
      tags: [Ingestion]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: >-
                Multipart batch-ingest upload: the file parts plus a JSON
                metadata envelope describing them.
              required: [files, metadata]
              properties:
                files:
                  type: array
                  description: >-
                    Uploaded source files to ingest, aligned by position with
                    metadata.files.
                  items:
                    type: string
                    format: binary
                    description: One uploaded source file's binary content.
                metadata:
                  type: string
                  description: >-
                    JSON-encoded BatchIngestUploadMetadata: per-file
                    source_type and optional parsed_metadata, plus the batch
                    infer_edges and needs_review flags. See
                    components.schemas.BatchIngestUploadMetadata.
      responses:
        "200":
          description: >-
            Server-Sent Event stream of per-file progress events and a final
            summary event.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE stream. Each event is a `data:` line with a JSON payload
                  conforming to ProgressEvent or SummaryEvent. See
                  components.schemas.ProgressEvent and
                  components.schemas.SummaryEvent.
        "400":
          description: >-
            `empty_file_list`: no files were uploaded.


            `invalid_batch_metadata`: the `metadata` form field is not valid
            JSON for the BatchIngestUploadMetadata schema, or its `files`
            length does not match the number of uploaded file parts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}:
    get:
      operationId: get_document
      summary: Retrieve a document record by ID.
      description: >-
        Returns the full document record including all metadata tiers,
        lifecycle status, and pipeline status. By default does not include
        projection content or file bytes; use discover (deterministic
        mode) for targeted content extraction or export_projection for
        file-based inspection. Reports `pipeline_status` cheaply, so it is
        the endpoint a caller waits on for a terminal status after an async
        ingest call.


        When `include_content=true`, the response additionally contains
        the original source file bytes (base64-encoded) and the byte
        count. The bytes are read from the vault's internal authoritative
        copy at `storage_root/source_path`. Supports the agentic
        read-modify-reingest round-trip: an agent fetches the file,
        edits it locally, and re-ingests with
        `predecessor_id` (see POST /documents).


        When `write_to_path` is provided, SAGE writes the authoritative
        file bytes to the caller-specified filesystem path instead of
        returning them in the response body. The response carries only
        the Document record plus `written_to`, `content_size`, and
        `content_hash` for delivery verification. This avoids inflating
        the response with base64 payloads that exceed MCP tool-result
        ceilings. `include_content` and `write_to_path` are mutually
        exclusive.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
        - name: include_content
          in: query
          required: false
          description: >-
            When true, include the vault-local file bytes (base64) and
            byte count in the response. Default: false. Rejected with 413
            when the file exceeds the configured inline content ceiling.
            Mutually exclusive with `write_to_path`.
          schema:
            type: boolean
            default: false
        - name: write_to_path
          in: query
          required: false
          description: >-
            Absolute filesystem path. When supplied, SAGE writes the
            vault-local file bytes to this path and returns metadata
            (`written_to`, `content_size`, `content_hash`) without
            inlining the bytes in the response. Target path must not
            already exist; its parent directory must exist and be
            writable. Mutually exclusive with `include_content`.
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: >-
            Document record, optionally with inline file content or
            delivery metadata for a file that was written to disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentWithContent"
        "400":
          description: >-
            Request shape invalid: both `include_content` and
            `write_to_path` supplied (`content_delivery_conflict`),
            `write_to_path` is not absolute, or the parent directory of
            `write_to_path` is missing or not writable. Also returned with
            `binary_content_refused` when `include_content=true` targets a
            binary-container source (`.docx`, `.pptx`, `.pdf`, `.xlsx`): the read
            path declines to inline raw container bytes and directs the
            caller to `read_projection` for the extracted text
            (CAS-ADR-039).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            Vault or document not found. Also returned when
            `include_content=true` or `write_to_path` is set and the
            file at `storage_root/source_path` is absent from the vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `write_to_path` target already exists. Callers must supply a
            fresh path or delete the prior file before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: >-
            `include_content=true` requested, but the file exceeds the
            configured inline content ceiling (default 100 MB; override
            via `SAGE_MAX_INLINE_CONTENT_BYTES`). Does not apply to
            `write_to_path` delivery. Use `write_to_path` or a
            filesystem-based workflow for files above the ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that could not be used. Resolve it at the store before retrying;
            `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, or a transient backend
            signal. The same request may succeed on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Graph Operations
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/edges:
    post:
      operationId: create_edges
      summary: Create one or more typed graph edges between documents.
      description: >-
        Creates N>=1 edges in a single call per CAS-ADR-029 v4
        plural-noun convention. Each item carries the same fields as a
        single edge specification (`source_id`, `target_id`,
        `edge_type`, anchor fields, `retracted_edge_id`, `rationale`,
        `rationale_kind`, `notes`, `synced_from_*`) and is dispatched
        through the idempotent variant: a duplicate natural-key triple
        (`source_id`, `target_id`, `edge_type`) returns the existing
        edge with `created=false` rather than raising. Items are
        processed in order under the process-wide link lock and
        per-item database transactions. Length-1 is fully supported.


        **The batch is NOT atomic.** A per-item `SAGEError` surfaces in
        the response's per-item error envelope but does not roll back
        earlier-or-later successful items. The endpoint returns HTTP 200
        even when some items fail; callers must inspect each
        `BulkLinkItemResult.status` and the aggregate
        `success_count` / `error_count` fields. HTTP 404 is reserved
        for the unknown-vault case; HTTP 422 covers request-body shape
        validation.


        Per-item error codes (surfaced inside the response envelope):
        `self_referential_edge`, `edge_anchor_policy_violation`,
        `retract_target_not_edge`, `document_not_found`,
        `tbd_policy_edge`, `merged_from_validation`,
        `synced_from_inapplicable_edge_type`,
        `synced_from_version_not_in_source_chain`. Each appears as a
        per-item error envelope rather than as a batch-level 400.


        Empty `items` is valid: the response carries an empty `results`
        array and all counts are zero.
      tags: [Graph]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLinkRequest"
      responses:
        "200":
          description: >-
            Batch processed. The response carries per-item outcomes
            (success or error envelope) and aggregate counts. A 200
            does NOT mean every item succeeded; check `error_count`
            and each `BulkLinkItemResult.status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLinkResponse"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/traverse:
    post:
      operationId: traverse
      summary: Walk the graph from a starting document.
      description: >-
        Traverses the graph from a starting document, following edges
        of the specified type(s) in the given direction, up to the
        specified depth. Uses recursive CTEs against the graph store.
        Returns a tree of traversal nodes, each containing the document
        summary, the edge that led to it, and the traversal depth.


        Traversal honors chain-scoped edge resolution per CAS-ADR-017:
        anchor fields determine which edges are visible from the query
        version's lineage; `retracts` edges can suppress downstream
        edges; `merged_from` tombstones suppress predecessor-chain
        edges downstream of the termination point.


        **Outbound dedup on `transitive_both` edges.** For
        `transitive_both` edge types (`covers`, `references`,
        `bundles_with`, `depends_on`, `instantiated_from`), outbound
        traversal deduplicates by target document: at most one
        representative edge per (source-chain, target) pair is
        returned, with chain-scoped resolution selecting the winner
        from the query position's lineage. Distinct edges sourced from
        different chain members but pointing at the same target are
        masked. For comprehensive enumeration of every edge into a
        target chain, traverse **inbound** from the target instead. The
        `edge_counts.{edge_type}` field in the response reflects the
        total visible edges from the query position, including those
        masked by dedup; if `edge_counts > len(nodes)`, the result has
        masked siblings. `supersedes` is point-to-point and not subject
        to this dedup; the rule applies only to the five
        `transitive_both` edge types.
      tags: [Graph]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:
        "200":
          description: Traversal results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraverseResponse"
        "400":
          description: Invalid edge type or direction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vault or starting document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/chain:
    post:
      operationId: chain
      summary: Walk an edge chain to both ends from any starting document.
      description: >-
        Follows edges of a single type in both directions from the
        starting document, collecting all reachable nodes into an
        ordered list. Returns positional metadata (head, tail, query
        position) and an `is_linear` flag.


        Designed for version history retrieval (supersedes chains) but
        works with any edge type that forms a linear or near-linear
        chain. Three round-trips for a chain of two or more: an
        existence check on the starting document, then the walk itself
        -- one recursive CTE whatever the chain length -- then a query
        for the connecting edges. A chain whose `total_length` is 1
        skips that edge query and spends two round-trips on the
        `available_edge_types` hint instead, asking for the document's
        inbound and outbound edges separately: four in all. The hint
        turns on the whole chain being one document, not on a page of
        one, so a `limit` of 1 over a longer chain does not trigger it.


        The result is symmetric: any chain member returns the full
        ordered chain with that member's position indicated. A document
        with no edges of the requested type returns a single-entry
        chain (the document itself as both head and tail).


        `limit` and `offset` page the returned entries without changing
        the walk: `total_length` stays the size of the whole chain,
        `length` counts what this response carries, and each entry keeps
        its absolute `position` rather than being renumbered from the
        start of the page. `head_id` and `tail_id` likewise name the
        chain's own ends, which a page need not contain.


        `is_linear` is true when the chain is strictly linear: no
        document shares a predecessor or a successor of the requested
        edge type with another. False marks a fork or a merge in the
        lineage -- a data quality problem rather than an ordinary shape,
        and worth surfacing when chasing supersedes chains that have not
        yet been reconciled.
      tags: [Graph]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainRequest"
      responses:
        "200":
          description: Chain walk results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainResponse"
        "400":
          description: Invalid edge type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id; or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/preconditions/{function_id}:
    get:
      operationId: verify_preconditions
      summary: Check whether all depends_on targets for a function document are
        satisfied (dependency-satisfying lifecycle, pipeline not failed).
      description: >-
        Iterates the document's outbound `depends_on` edges; for each
        target, verifies the lifecycle status is one the vault's
        configuration declares dependency-satisfying (`active` or
        `completed` under the base lifecycle) and that
        `pipeline_status` is not `failed` — a target still
        mid-pipeline is not rejected.
        Returns a `satisfied` boolean plus a per-edge breakdown of
        failing reasons (e.g. predecessor still in projection, target
        archived) so the caller can act on the gap rather than
        re-querying each dependency. A target the vault does not hold
        is reported unsatisfied with `actual` of "not found" rather
        than raising.


        Despite the path parameter name `function_id`, this operation
        works on any document with outbound `depends_on` edges, not
        only documents typed as "function".
      tags: [Graph]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: function_id
          in: path
          required: true
          description: >-
            Document ID of the document whose preconditions to check.
            Parameter is named `function_id` for historical reasons;
            any document with outbound `depends_on` edges is valid.
          schema:
            type: string
      responses:
        "200":
          description: Precondition check results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreconditionResult"
        "404":
          description: >-
            `document_not_found`: no document with that id; or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Access Control
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/users:
    post:
      operationId: register_user
      summary: Register a user (human or agent) in the vault's user table.
      description: >-
        Registers a new actor for provenance tracking and access
        control. Both human users and agent identities are registered
        through this endpoint. The user ID is assigned by SAGE at
        registration time and is the canonical attribution source: it
        can be used as the `created_by` value on subsequent ingest
        calls and is recorded as the actor on lifecycle and edge
        mutations. Ad-hoc strings in `created_by` are accepted but are
        not linked to a registered user record.


        The `user_type` field (`human` or `agent`) is informational
        (attribution audit) and does not gate any operation's behavior.
      tags: [Access Control]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user type or missing required field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/editors:
    put:
      operationId: set_editors
      summary: Set the editor list for a document.
      description: >-
        Replaces the full editor list for a document wholesale (not a
        delta). Sending an empty array restores default-open access
        (any registered user can read and write). Sending one or more
        user IDs restricts write access to that set; all other
        registered users become read-only for this document.


        Editors are referenced by their registered user IDs (see
        `POST /sage_vaults/{vault_id}/users`). Vault-wide defaults for
        the editor model live under `access_control_defaults` in the
        vault config; this operation overrides the default at the
        per-document level.
      tags: [Access Control]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEditorsRequest"
      responses:
        "200":
          description: Editor list updated. Returns the current editor list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorList"
        "400":
          description: One or more user IDs are not registered in this vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id; or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: get_editors
      summary: Return the editor list for a document.
      description: >-
        Returns the list of users registered as editors for this
        document. An empty list means the document is in default-open
        mode (any registered user can write). Read-only operation; no
        side effects.
      tags: [Access Control]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Editor list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorList"
        "404":
          description: >-
            `document_not_found`: no document with that id; or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/documents/{document_id}/export:
    post:
      operationId: export_projection
      summary: Write stored projection to a Markdown file for inspection.
      description: >-
        Exports the stored projection text for a document to a
        specified file path inside the vault's `storage_root`. Used for
        debugging and manual inspection of the adapter's output. The
        projection is the structured plain-text rendering produced by
        the source adapter during ingestion.


        `output_path` may be relative (resolved against `storage_root`)
        or absolute, but it must resolve to a location inside the
        vault's `storage_root`. Targets outside the vault tree are
        refused with `path_traversal_denied`.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportProjectionRequest"
      responses:
        "200":
          description: Projection exported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportProjectionResponse"
        "400":
          description: >-
            `path_traversal_denied`: `output_path` resolves outside the
            vault's `storage_root`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id.


            `no_projection`: the document exists but has no stored
            projection (e.g. ingestion failed mid-pipeline).


            Or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/eval-retrieval:
    post:
      operationId: eval_retrieval
      summary: Run retrieval health assertions against the vault.
      description: >-
        Loads assertions from the YAML file referenced in
        `retrieval_health.assertions_file` of the vault config, runs
        each as a semantic search, and returns a pass/fail report.
        Each assertion is a `(query, expected_document_id, top_k)`
        triple: the assertion passes when the expected document
        appears within the top-k results for the query. Failures
        report the actual rank (out of `top_k * 5`) when the expected
        document was found beyond top-k, or `null` when it was not
        found at all. Used as a smoke test after bulk ingestion or
        configuration changes.


        The assertions YAML file is resolved relative to the vault's
        `storage_root`. The file must have a top-level `assertions:`
        key whose value is a list of objects; each object must include
        `query` and `expected_document_id` and may include `top_k`
        (default 10).
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Retrieval health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRetrievalResult"
        "400":
          description: >-
            `assertions_file_invalid`: the referenced YAML is malformed
            or has the wrong structure.


            `assertions_not_configured`: the vault config has no
            `retrieval_health.assertions_file` entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `assertions_file_not_found`: the configured assertions
            file does not exist under the vault's `storage_root`.


            Or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/refresh-views:
    post:
      operationId: recompute_views
      summary: Regenerate symlink-based browsable folder views.
      description: >-
        Drops and recreates the symlink trees under the vault's
        `storage_root` (typically `by_doc_type/` and `by_lifecycle/`)
        organized by the current graph state. Useful after bulk
        metadata updates that moved documents between `doc_type` or
        `lifecycle_status` buckets.


        The symlink views exist for human navigation in Finder or a
        file browser; no SAGE operation consumes them. The API is the
        primary interface for programmatic access.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Views regenerated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshViewsResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Vault Management
  # ---------------------------------------------------------------------------

  /sage_vaults:
    get:
      operationId: list_vaults
      summary: List all vaults registered with the running SAGE instance.
      description: >-
        Returns a VaultSummary for every vault in the in-memory registry.
        Each summary includes the vault's identity, its document count
        across every lifecycle state, configured doc types, lifecycle
        states, registered source adapters, and the set of distinct
        project identifiers observed in the vault's documents.


        Used by the CAS Application to populate the vault selector and
        to drive vault-scoped UI menus (doc_type pickers, lifecycle
        filter dropdowns, adapter registry table).
      tags: [Vault Management]
      responses:
        "200":
          description: List of vaults (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultSummary"

    post:
      operationId: create_vault
      summary: Create a new vault from a full configuration object.
      description: >-
        Validates the supplied configuration against the vault config
        schema (`docs/fs/sage/vault_config.schema.json`), creates the
        vault directory hierarchy, writes the YAML config to disk,
        initializes services, registers the vault in the running
        instance, and bootstraps the owner user. The new vault is
        usable immediately; no server restart is required.
      tags: [Vault Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "201":
          description: Vault created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSummary"
        "400":
          description: >-
            `vault_config_validation_error`: the supplied configuration
            failed schema validation (detail includes the list of
            failed constraints).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `vault_already_exists`: a vault with the requested `id` is
            already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/stats:
    get:
      operationId: get_vault_stats
      summary: Return Dashboard statistics and health indicators for a vault.
      description: >-
        Aggregates document, edge, storage, and pipeline-status counts
        from the graph store and content store. Used by the CAS
        Application Dashboard view. Inexpensive; safe to poll.


        Response contents: total document count; counts per lifecycle
        state; counts per `doc_type`; counts per `pipeline_status`;
        storage figures (`graph_store_size_bytes` is the live graph-store
        footprint, `content_store_size_bytes` is the live content-store
        footprint, `content_store_chunk_count` is the row count from the
        chunks table); and health indicators.


        Health indicators include pending metadata reviews, pending
        edge reviews, deferred abstracts (null when abstraction is
        disabled in the vault config), and failed ingestions.
      tags: [Vault Management]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Vault statistics and health indicators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatsResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/config:
    get:
      operationId: get_vault_config
      summary: Return the full vault configuration.
      description: >-
        Returns the configuration as a JSON object conforming to
        `docs/fs/sage/vault_config.schema.json`. Section structure
        follows the schema: `vault`, `document_types`, `lifecycle`,
        `metadata_extraction`, `edge_inference`, `adapter_defaults`,
        `abstraction`, `access_control_defaults`, `retrieval_health`.


        **This is the authoritative source for vault-config-defined
        vocabulary that other operations depend on.** Read this when
        you need:

        - The valid `action` vocabulary for
          `POST /sage_vaults/{vault_id}/lifecycles` (under
          `lifecycle.transitions`; each entry includes `from_state`,
          `action`, `to_state`, `creates_edge`).

        - The valid `doc_type` values for
          `POST /sage_vaults/{vault_id}/metadata` or for filtering
          `POST /sage_vaults/{vault_id}/discover` (under
          `document_types.doc_types`).

        - The per-adapter projection parameters this vault sets (under
          `adapter_defaults`, keyed by source type). Which adapters
          exist is not vault configuration; read `adapters` on the vault
          summary for the process-wide set.

        - The filename-parsing pattern and segment fields used by
          `POST /parse-filename` (under
          `metadata_extraction.filename_extraction`).

        - The edge-inference tier assignments relevant to
          `GET /staging-edges` (under
          `edge_inference.tier_assignments`).


        The returned dict is the live in-memory config; on-disk edits
        to `vault_config.yaml` made outside the running server are not
        reflected until the vault is reloaded.
      tags: [Vault Management]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Vault configuration.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Vault configuration object. Structure defined by
                  docs/fs/sage/vault_config.schema.json.
                additionalProperties: true
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: update_vault_config
      summary: Update vault configuration at the section level.
      description: >-
        Each top-level section provided in the request body replaces
        the current section wholesale; omitted sections are preserved
        unchanged. Partial-section merges are not supported -- callers
        must supply the complete section.


        After validation, the YAML file is rewritten and the running
        config is updated in place. Subsequent calls see the new
        vocabulary immediately; a separate vault reload is only
        required when external processes edited `vault_config.yaml`
        outside the running server.


        Destructive changes (removing a `doc_type` or lifecycle state
        that still has documents attached) are rejected with 409 and
        a warnings list unless the caller passes `?force=true`.
        Changing `vault.id` is never permitted, even with `force`; use
        `POST /sage_vaults` to create a new vault instead.
      tags: [Vault Management]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, proceed with destructive changes; warnings are
            returned in the response. When false (default), destructive
            changes return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultConfigRequest"
      responses:
        "200":
          description: Configuration updated and vault reloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateVaultConfigResponse"
        "400":
          description: >-
            `vault_config_validation_error`: the merged config failed
            schema validation, an unknown section name was passed, or
            the request attempts to change `vault.id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `destructive_config_change`: the update would orphan
            documents (removed `doc_type` or lifecycle state still has
            documents attached). Pass `force=true` to proceed; the
            warnings then appear in the success response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/hash-check:
    post:
      operationId: verify_hashes
      summary: Bulk hash existence check against the graph store.
      description: >-
        For each supplied SHA-256 hash, returns whether it matches an
        existing document and, if so, the matching document's `id` and
        `source_path`. Used during the directory-scan flow to
        differentiate new files from already-ingested ones before
        showing per-file ingestion decisions to the user.


        Every hash is normalized to the canonical
        `sha256:<64 lowercase hex>` (the `Sha256Str` shape) before
        lookup, so the canonical form, bare hex, and either with the
        digest uppercased all resolve to the same stored document. An
        uppercase algorithm prefix, a whitespace-padded value, a
        wrong-length digest, and a non-hex digest are rejected with
        `invalid_sha256` (400) naming the offending value as supplied.


        Response is a dict keyed by the *canonical* hash, one entry per
        distinct key. No input is omitted: an unmatched hash is present
        with `exists: false`. Two spellings of one digest in a single
        request therefore collapse to a single entry, and a caller that
        submitted bare hex reads its result back under the canonical
        key. An empty `hashes` array returns an empty object without
        consulting the graph store; since every non-empty request
        yields at least one entry, an empty response means the request
        was empty, not that nothing matched.
      tags: [Vault Management]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HashCheckRequest"
      responses:
        "200":
          description: Per-hash existence map.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/HashCheckMatch"
                description: Map of SHA-256 hash to existence record.
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Staging Edges (Tier 2 review queue)
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/staging-edges:
    get:
      operationId: list_staging_edges
      summary: List Tier 2 inferred edges awaiting review.
      description: >-
        SAGE's edge-inference subsystem runs edges through tiers
        defined in `edge_inference.tier_assignments` of the vault
        config:

        - **Tier 1** (e.g. `supersedes` via version_chain,
          `sync_target` via re_ingestion): high-confidence inferences.
          Created directly as production edges; do not appear here.

        - **Tier 2** (e.g. `references` via identifier_mention or the
          superseded content_reference placeholder, `covers` via
          filename_code_match): inferred edges that require human
          review. Land in the staging-edge table; surfaced by this
          operation until confirmed or dismissed.

        - **Tier 3**: agent-supplied edges (`derived_from`,
          `depends_on`); not inferred, so do not pass through staging.


        Each staging edge carries the source/target ids, edge_type,
        and the inference rule + evidence that produced it. The result
        list groups by source document
        (`staging_review_grouping=by_source_document`) so a reviewer
        can sweep all candidate edges from one document together.
      tags: [Staging Edges]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Staging edges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StagingEdge"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/staging-edges/{edge_id}/confirm:
    post:
      operationId: confirm_staging_edge
      summary: Confirm a staging edge by promoting it to a production edge.
      description: >-
        Inserts a production `Edge` with a fresh id mirroring the
        staging edge's `source_id`, `target_id`, and `edge_type`,
        copies `inference_evidence` into the new edge's `rationale`,
        then deletes the staging edge. The returned response carries
        the production `edge_id`, which is **distinct from the staging
        id passed in** -- staging and production tables do not share
        an id space.
      tags: [Staging Edges]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: edge_id
          in: path
          required: true
          description: Staging edge id to confirm.
          schema:
            type: string
      responses:
        "200":
          description: Staging edge confirmed; production edge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagingEdgeConfirmResponse"
        "404":
          description: >-
            `staging_edge_not_found`: the id is unknown (already
            confirmed, already dismissed, or never existed); or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/staging-edges/{edge_id}/dismiss:
    post:
      operationId: dismiss_staging_edge
      summary: Dismiss a staging edge by deleting it without promotion.
      description: >-
        Deletes the staging edge from the staging table. No production
        edge is created. Used when the inferred edge is incorrect or
        not useful.


        Dismissing the edge does not register a "do not re-stage"
        decision: the underlying inference rule is not re-applied for
        the same `(source_id, target_id, edge_type)` combination
        during the current ingest cycle, but a future re-ingest that
        re-triggers the same inference rule will re-stage the
        candidate. To make a dismissal permanent, change the source
        document's metadata so the rule no longer matches.
      tags: [Staging Edges]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: edge_id
          in: path
          required: true
          description: Staging edge id to dismiss.
          schema:
            type: string
      responses:
        "200":
          description: Staging edge dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagingEdgeDismissResponse"
        "404":
          description: >-
            `staging_edge_not_found`: the id is unknown (already
            confirmed, already dismissed, or never existed); or vault
            not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Pending Metadata
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/pending-metadata:
    get:
      operationId: list_pending_metadata
      summary: List documents whose extracted metadata is unconfirmed.
      description: >-
        Returns documents with `metadata_confirmed=false`. Each item
        includes the full `Document` record plus a per-field
        `ExtractedField` annotation (`value` + `source`: `"filename"`,
        `"content"`, or `"default"`; optionally an
        `alt_value`/`alt_source` for fields with a secondary
        candidate, e.g. title from content with filename as
        alternative). Used by the Metadata Review queue to drive the
        per-document review workflow.


        Per CAS-ADR-021, a document is pending typically because it
        was ingested with `needs_review=true`: the caller deferred
        metadata to filename inference, which populated fields the
        caller did not supply and held the document for review. The
        pending state is cleared on any successful
        `POST /sage_vaults/{vault_id}/metadata` call against the
        document (even a single-field update). The default ingest path
        (`needs_review=false`) lands documents with
        `metadata_confirmed=true`; those never appear here.
      tags: [Pending Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Documents awaiting metadata confirmation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingMetadataItem"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/parse-filename:
    post:
      operationId: get_filename_metadata
      summary: Parse a filename without ingesting.
      description: >-
        Side-effect-free wrapper over the vault's filename parsing.
        Returns the metadata fields the parser would extract from the
        supplied filename under the named adapter. No document is
        created; vault state is unchanged. Intended for callers that
        want filename-based suggestions to populate a UI before
        submitting an ingest with caller-authoritative metadata
        (CAS-ADR-021).


        **Which fields the parser extracts is vault-config-defined.**
        See `metadata_extraction.filename_extraction.segment_fields`
        in `GET /sage_vaults/{vault_id}/config` for the active
        mapping. In the `cas` vault, the configured pattern is
        `{date}_{project}_{code}_{title}_{version}`, so the parser
        returns `doc_date`, `project`, `doc_code`, `title`, and
        `version`. Other vaults may configure a different pattern and
        emit a different field set. When the vault has no
        `filename_extraction.pattern` configured, all parsed fields
        are returned as null.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseFilenameRequest"
      responses:
        "200":
          description: Parsed filename metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseFilenameResponse"
        "400":
          description: >-
            `adapter_not_found`: no source adapter is registered for
            `source_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Document Operations (read endpoints + local OS open)
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/documents/{document_id}/open:
    post:
      operationId: open_document
      summary: Open a document's source file using the local OS file association.
      description: >-
        Local-profile convenience endpoint. Invokes the host OS opener
        (open on macOS, xdg-open on Linux, os.startfile on Windows)
        fire-and-forget. It is meaningful only when the browser and SAGE
        share a machine, so it is gated to the local profile: under the
        cloud profile SAGE runs headless and the endpoint returns 501
        `local_open_only`. Deliver the document to a browser via
        `GET /documents/{document_id}/download-url` instead.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Open command dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenDocumentResponse"
        "404":
          description: Document, vault, or backing source file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: >-
            `local_open_only`: the host OS opener is a local-profile
            affordance and is gated off under the cloud profile, where
            SAGE runs headless.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/reabstract:
    post:
      operationId: recompute_abstract
      summary: Regenerate the semantic abstract for a single document.
      description: >-
        Re-runs abstraction on one existing document regardless of its
        current terminal pipeline_status (abstraction_complete,
        abstraction_skipped, abstraction_interrupted, or failed),
        reusing the shared per-document
        queue and single-flight machinery. Fire-and-forget: the call
        validates the document and its stored projection chunks, claims the
        document, flips pipeline_status to abstraction_in_progress,
        dispatches the abstraction work as a background task, and returns
        immediately. The regenerated abstract is written by that task, not
        by this call; wait on `GET /documents/{document_id}` for a terminal
        pipeline_status to observe the outcome, as a single bounded wait
        rather than one status read per unit of caller work. A wait must also
        accept `abstraction_interrupted`, which means the queue draining the
        work was stopped before it finished and the next server start re-runs
        it. Use this to
        refresh a stale-but-complete abstract after an abstraction-provider
        or model swap.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Re-abstraction job accepted and dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReabstractStartedResponse"
        "404":
          description: >-
            `document_not_found` / `no_projection` / `vault_not_found`: the
            document, its stored projection chunks, or the vault could not be
            resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `reabstract_document_already_in_flight`: a re-abstraction is
            already running for this document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/download-url:
    get:
      operationId: get_document_download_url
      summary: Mint a short-lived download URL for a document's source file.
      description: >-
        Browser-delivery path for the cloud profile: the active
        vault-source binding issues a short-lived, pre-authenticated URL
        the browser fetches directly from the backing store, so the
        source bytes never transit SAGE. Only a binding that supports the
        capability can answer -- the document-store binding does; the
        filesystem binding returns 501 `download_url_unavailable`.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: A short-lived download URL for the document's source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDownloadUrlResponse"
        "404":
          description: Vault or document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: >-
            `download_url_unavailable`: the active vault-source binding
            cannot issue a download URL (the filesystem binding has no
            equivalent to the document-store binding's pre-authenticated
            URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that could not be used. Resolve it at the store before retrying;
            `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, or a transient backend
            signal. The same request may succeed on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/content:
    get:
      operationId: get_document_content
      summary: Stream a document's retained source bytes as a raw download.
      description: >-
        The binding-agnostic browser-delivery path: bytes come chunked from
        the vault-source store's streaming read, so no hop holds the whole
        file and the inline-content size ceiling does not apply.
        Binary-container sources are served raw with their correct media
        type -- the refusal that guards text-scanning of container bytes
        inlined into JSON does not apply to this raw byte channel. The
        source's presence and size are resolved before the stream opens, so
        those failures arrive as structured JSON envelopes; a vault-source
        store refusal raised once the bytes are already flowing ends the body
        short of the promised `Content-Length` instead, which is what a
        caller checks the delivery against. The response carries a derived
        `Content-Type` and an `attachment` `Content-Disposition`.
      tags: [Document Metadata]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The retained source bytes, streamed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: >-
                  The raw source bytes. The concrete Content-Type is derived
                  from the source filename and may be more specific than
                  octet-stream.
        "404":
          description: >-
            Vault or document not found. Also returned with
            `content_file_missing` when the retained source file is absent
            from the vault-source store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that could not be used. Resolve it at the store before retrying;
            `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, or a transient backend
            signal. The same request may succeed on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/projection:
    get:
      operationId: read_projection
      summary: Return a document's full projection text.
      description: >-
        Reassembles the document projection (canonical text used
        during ingestion) and returns it as a single string alongside
        a metadata header. Equivalent to uploading the document into
        the caller's context. Useful for agents that need the full
        document in one read instead of stitching chunks from a
        `POST /discover` call.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Projection text and metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadProjectionResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id.


            `no_projection`: the document exists but has no stored
            projection (e.g. ingestion failed mid-pipeline or the
            document is awaiting reabstraction). Inspect
            `pipeline_status` via `GET /documents/{id}`.


            Or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/section/{heading_path}:
    get:
      operationId: read_section
      summary: Return a document section by heading path prefix.
      description: >-
        Returns the concatenated text of all chunks whose
        `heading_path` matches the supplied prefix exactly or descends
        from it (structural prefix match from the document root). The
        `heading_path` uses ` > ` as a separator (URL-encoded) and is
        captured as a path parameter, so nested heading paths with
        slashes are not supported.


        Prefix matching is from the root: requesting "Technical
        Description" returns that heading plus all children (e.g.
        "Technical Description > Composite Claim Binding"). Bare-text
        queries that match the *tail* of a stored path (e.g. "CLAIMS"
        against a stored "CLAIMS -- Remove Before Filing") will not
        match -- when this happens, the `heading_not_found` error
        response includes a `candidate_matches` field listing stored
        paths that contain the query as a substring, so callers can
        retry with the exact path.


        For free-text "find this section by name regardless of path
        position," prefer `POST /discover` in semantic or keyword mode;
        both index `heading_path` text alongside content.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
        - name: heading_path
          in: path
          required: true
          description: >-
            Heading path prefix (e.g. "Methods" or
            "Methods > Synchronization"). Matched as exact or
            descendant.
          schema:
            type: string
      responses:
        "200":
          description: Section text and chunk count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadSectionResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id.


            `heading_not_found`: no chunk's `heading_path` matches the
            supplied prefix. The error detail includes
            `candidate_matches`, a list of stored paths that contain
            the query as a substring.


            Or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/documents/{document_id}/headings:
    get:
      operationId: list_headings
      summary: List the heading paths of a document in document order.
      description: >-
        Returns the distinct heading paths present in a document,
        ordered by their position in the source. Body content is not
        read; the response is a structural table of contents.


        Use this to verify a document's structure or pick a heading
        path before calling `read_section`. Replaces the antipattern
        of calling `read_section` with a deliberately wrong heading
        path to harvest `available_headings` from the resulting
        `heading_not_found` error response.


        The synthetic header chunk is excluded from the
        result, so heading paths in this response are exactly those a
        caller may pass to `read_section`.
      tags: [Utilities]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Distinct heading paths in document order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHeadingsResponse"
        "404":
          description: >-
            `document_not_found`: no document with that id.


            `no_projection`: the document exists but has no stored
            projection (e.g. ingestion failed mid-pipeline or the
            document is awaiting reabstraction).


            Or vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Edge Deletion (unlink)
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/edges/{edge_id}:
    delete:
      operationId: delete_edge
      summary: Remove a production edge from the graph.
      description: >-
        Deletes the specified production edge. Documents are never
        deleted (per the no-delete invariant in SAGE Architecture
        Reference §6.4), but edges may be deleted directly when the
        relationship they record is no longer correct.


        **For staging-table edges (pre-confirmation), use
        `POST /staging-edges/{edge_id}/dismiss` instead.** The two
        tables are distinct and edge ids do not cross between them;
        an id minted in staging is not valid here once promoted, and
        vice versa.


        Idempotent in spirit: deleting a non-existent edge returns
        404. After deletion, traversal results no longer include the
        edge, and dependent operations (chain walks, precondition
        checks) proceed as if the edge had never existed.
      tags: [Graph]
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - name: edge_id
          in: path
          required: true
          description: Production edge id to delete.
          schema:
            type: string
        - name: dry_run
          in: query
          required: false
          description: >-
            When true, confirm the edge exists and
            preview the would-be projection of the deletion without
            persisting. The response carries `deleted=false`,
            `dry_run=true`, and `preview_edge` populated with the
            would-be-deleted edge. A missing edge_id raises the same
            `edge_not_found` error as a real-run. Note: unlink is an
            edge mutation, not a document field mutation, so the
            change surface is the existing `preview_edge` field rather
            than a separate `changes` block.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Edge deleted (or previewed on dry-run).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkResponse"
        "404":
          description: >-
            `edge_not_found`: no production edge with that id; or
            vault not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Maintenance / Admin (CAS-ADR-029)
  # ---------------------------------------------------------------------------

  /sage_vaults/{vault_id}/admin/detect-drift:
    post:
      operationId: verify_vault_drift
      summary: Audit active sync_target / derived_from edges for drift.
      description: >-
        Walks every active provenance-bearing edge in the vault and
        compares its recorded ``synced_from_*`` fields against the
        current head of the target's supersedes chain. Returns a
        DriftReport whose ``entries`` enumerate edges that need
        operator attention; edges whose recorded state still matches
        the head are absent from the report.


        Hash is the authoritative comparator (``synced_from_content_hash``
        vs the head's ``source_content_hash``); ``synced_from_version``
        is a display key. See ``StalenessBasis`` for the four-bucket
        classification (``content_drift`` — real drift, action required;
        ``chain_advanced_no_content_change`` — chain advanced but
        content unchanged, informational;
        ``recorded_null`` — legacy edge with no provenance signal;
        ``chain_nonlinear`` — data-quality flag for forked chains).


        Replaces the manual hand-walk phase of the verbatim-sync and
        terminology-remediation workflows.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Drift report (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftReport"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/admin/verify-source-files:
    post:
      operationId: verify_vault_source_files
      summary: Audit that every document's backing source file is present.
      description: >-
        Walks every document in the vault and verifies that its
        ``source_path`` resolves to an existing file under the vault
        storage root. Returns a SourceFileIntegrityReport whose
        ``entries`` enumerate documents whose source file is missing
        (``missing``), whose recorded path is a link rather than the
        retained copy (``symlinked``), whose recorded path resolves
        outside the vault's source tree (``out_of_root``), or, when
        ``check_hashes`` is set, present but no longer hashing to the
        digest recorded for the retained copy -- ``stored_content_hash``,
        or ``source_content_hash`` when that is null (``hash_mismatch``).
        Documents with an intact source file are absent from the report.
        Read-only.


        A ``symlinked`` row is reported in both modes and is never read
        through. The bytes behind a link are not the copy the record
        names, and the store refuses to write at such a path, so a repair
        of that document will be refused until the link is removed.


        An ``out_of_root`` row is reported in both modes and likewise
        never read through. The store refuses to write outside the
        vault's source tree whether or not anything resolves at the far
        end, so this outranks ``missing``: an absent copy at such a path
        is not repaired by re-delivering the content, but by re-pointing
        the path or reconfiguring the vault.


        An integrity check on the stored copy, not a provenance check: a
        store may retain a copy that is not byte-identical to what the
        caller delivered, in which case only the stored digest describes
        the bytes on the store.


        Audits the vault-local source files (the ``imports/`` copies that
        ``get_document`` delivers), distinct from the content store
        reclaimed by ``optimize_vault_content_store``.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFileIntegrityRequest"
      responses:
        "200":
          description: Source-file integrity report (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileIntegrityReport"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that could not be used. Resolve it at the store before retrying;
            `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, or a transient backend
            signal. The same request may succeed on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/admin/restore-source-file:
    post:
      operationId: restore_vault_source_file
      summary: Repair a document's retained source file by writing delivered bytes back over it.
      description: >-
        The repair counterpart of ``verify_vault_source_files``.
        That audit reports a retained copy that changed outside SAGE but
        cannot fix one, and re-ingesting cannot stand in: retention sees
        only that the offered bytes differ from what sits at its target --
        indistinguishable from a name collision -- so it homes the
        document at a second path and leaves the damaged copy in place.
        This writes to the path the document record already names, so the
        document does not move.


        SAGE keeps no pristine second copy of a source, so ``source``
        supplies the bytes. The target document is resolved from their
        digest against recorded provenance, which is why ``document_id``
        is normally unnecessary; supply it when that resolution is
        ambiguous or unavailable.


        Writes nothing when the retained copy already hashes to its
        recorded digest, returning ``status: already_intact``. Where a
        write does happen the store reports the digest of the copy it now
        holds -- reading it back only under a binding that may have
        rewritten the bytes -- and the record's ``stored_content_hash``
        follows it only where the store demonstrably did; the provenance
        digest is never touched.


        A recorded path that is a *link* is never reported
        ``already_intact``, however the bytes behind it hash: it is not the
        copy the record names, and the write is refused
        (``vault_source_path_refused``) rather than landing wherever the
        link points. Remove the link and re-run.


        Nor is a recorded path that resolves *outside* the vault's source
        tree, for the same reason and with the same refusal: the store
        will not write there, so the repair cannot land where the record
        names. Re-point the path or reconfigure the vault, then re-run.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFileRestoreRequest"
      responses:
        "200":
          description: Source-file restore report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileRestoreReport"
        "400":
          description: >-
            `restore_provenance_mismatch`: the pinned document was not
            ingested from the delivered bytes.
            `restore_source_not_absolute`: the source path is not absolute.
            `vault_source_path_refused`: the document's source_path cannot be
            written at the path it names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `vault_not_found`: no vault registered with that id.
            `restore_target_unresolved`: no single document claims the
            delivered bytes as its provenance.
            `document_not_found`: the supplied document_id names no document.
            `source_file_not_found`: the delivered source path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that opened no usable upload session. Resolve it at the store before
            retrying; `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, a transient backend
            signal, an upload session it expired. The same request may succeed
            on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/admin/migrate:
    post:
      operationId: migrate_vault
      summary: Apply pending schema migrations to a single vault in the running session.
      description: >-
        Per-vault schema-migration operation for the SAGE Core API
        maintenance surface (CAS-ADR-029). Runs the graph store's own
        migrating initialization: closes the running
        vault's graph_store, opens a fresh one to apply ALTER TABLE
        migrations and BACKFILL_PLAN backfills, then reloads the vault in
        the registry so subsequent operations observe the new schema.


        Two data backfills run, each naming itself in backfills_applied
        only when it changed rows. Documents already at a successful
        terminal pipeline_status that still carry the pipeline_error of a
        failure they have since recovered from get that field cleared.
        Documents holding a stored source_path in a spelling ingest no
        longer records -- a `.` segment, a doubled separator, or a
        trailing one -- have it reduced to its plain form, so that
        re-projecting them stops raising force_reingest_path_mismatch;
        each rewrite is reported in source_paths_normalized. A recorded
        path that walks out of the vault's source tree has no plain form
        inside it and is left as recorded.


        Idempotent: a re-call against an already-migrated vault with
        nothing left to repair returns a MigrationReport with empty
        columns_added and backfills_applied lists and no error; the
        registry reload is skipped on the no-op path to avoid pointless
        thrash.


        Cross-process staleness (F-10, CAS-ADR-029): the operation is not
        bulletproof if other MCP server processes hold imports of the
        same vault directory. Callers must restart any other open MCP
        sessions to observe the new schema.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Migration applied (or no-op when already current).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/admin/reabstract-deferred:
    post:
      operationId: recompute_deferred_vault_abstracts
      summary: Backfill semantic abstracts for documents whose pipeline_status is abstraction_skipped.
      description: >-
        Graduation of the standalone scripts/reabstract_deferred.py script
        to the maintenance API surface (CAS-ADR-029). Enumerates
        documents whose pipeline_status is 'abstraction_skipped', dispatches a
        reabstract per document, and polls until each
        reaches a terminal pipeline_status (abstraction_complete,
        abstraction_skipped, abstraction_interrupted, or failed).


        The per-document poll is bounded. A generation slow enough outlasts
        any waiter, so a document that has not settled within the server's
        wait ceiling is abandoned and recorded with outcome 'timeout'
        rather than polled indefinitely. Abandoning is a statement about the
        poll, not about the document: the generation may still complete. It
        is not, however, self-healing. This operation enumerates
        'abstraction_skipped' only, and an abandoned document sits at
        'abstraction_in_progress', so a later call reaches it only once
        something else advances it -- the generation finishing, startup
        recovery, or the out-of-band bulk sweep with a selector naming that
        status. Work dropped by a stopped abstraction worker is a separate
        case and does not land here: stopping the worker settles it at the
        terminal 'abstraction_interrupted', which the poll returns and the
        bulk sweep enumerates by default.


        Outcomes beyond `success` and `skipped_pdf` all count toward
        failed_count, which counts documents that did not reach
        abstraction_complete, and are reported apart because only
        `llm_failure` indicates an error the provider actually raised:
        `still_skipped` is a document that settled back at
        `abstraction_skipped`, having declined abstraction rather than
        failed at it; `timeout` is one abandoned at the ceiling; and
        `interrupted` is one whose work a stopped queue dropped before
        any provider was reached.


        Reuses the in-process abstraction provider that the running SAGE
        process loaded once at startup; does NOT initialize a second
        provider (the F-8 unified-memory cautionary tale). The
        complementary scripts/reabstract_deferred.py remains as the
        operator fallback for cron-style workflows where no MCP server is
        running.


        Single-flight per vault: a concurrent call against the same vault
        returns 409 reabstract_already_in_flight with the start_time of
        the running operation rather than queueing.


        Response is `text/event-stream`. Per-document state
        transitions surface as `progress` events
        (`status` = started / completed / failed / skipped); a final
        `summary` event carries the ReabstractReport payload. The 404
        and 409 error paths resolve synchronously BEFORE the stream is
        opened and return an application/json ErrorResponse envelope
        with no SSE events emitted.


        A failure of the run itself, which can only surface after the 200
        is committed, ends the stream: it emits no further events -- there is
        no `error` event variant -- and closes the connection without a
        `summary`. A stream that ends without one did not complete, and the
        cause is logged server-side rather than sent. Clients should treat
        the `summary` event, not the end of the stream, as the completion
        signal.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReabstractRequest"
      responses:
        "200":
          description: >-
            Server-Sent Event stream of per-document progress events
            and a final summary event.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE stream. Each event is a `data:` line with a JSON
                  payload conforming to ReabstractProgressEvent or
                  ReabstractSummaryEvent. See
                  components.schemas.ReabstractProgressEvent and
                  components.schemas.ReabstractSummaryEvent.
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`reabstract_already_in_flight`: a reabstract is already running on this vault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sage_vaults/{vault_id}/admin/optimize-content-store:
    post:
      operationId: optimize_vault_content_store
      summary: Reclaim bloat in the per-vault content store.
      description: >-
        Per-vault content-store reclamation operation for the SAGE Core
        API maintenance surface (CAS-ADR-029). Runs a
        ``VACUUM (FULL, ANALYZE)`` against the per-vault chunks table:
        removes dead tuples, returns free space to the OS, and shrinks
        the relation.


        Postgres MVCC writes a new row version on every update or
        delete rather than reclaiming space in place, so disk usage on
        actively-churned vaults grows until this operation is called.


        Runs on its own autocommit connection (VACUUM cannot run inside
        a transaction block) and holds no lock that blocks concurrent
        reads or writes. On a first run against a highly churned vault
        the call may take minutes and exceed an MCP client's call
        timeout; subsequent runs against the same vault settle to
        seconds.


        The underlying operation returns nothing; the caller-visible
        evidence of reclamation comes from the pre/post observations of
        relation byte size, retained version count, and fragment counts
        captured by this report. ``cleanup_older_than_days`` has no
        Postgres analog (VACUUM reclaims every eligible dead tuple
        regardless of age) and is accepted only for the port contract.
      tags: [Maintenance]
      parameters:
        - $ref: "#/components/parameters/VaultId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeContentStoreRequest"
      responses:
        "200":
          description: >-
            Optimization completed. Pre/post byte, version, and fragment
            counts let the caller observe the reclamation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeContentStoreReport"
        "404":
          description: "`vault_not_found`: no vault registered with that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /upload:
    put:
      operationId: transfer_upload
      # Exempt from the global bearer requirement: authority travels in the
      # single-use transfer_id minted by the originating call, not in an
      # Authorization header.
      security: []
      summary: Deliver a pending transfer's bytes against a one-time upload token.
      description: >-
        The byte-delivery leg of a caller-local ingest against a deployment
        that cannot see the caller's filesystem. The originating call mints a
        short-lived one-time token and returns an upload recipe; the caller's
        environment sends the raw file body here with the token, and the
        bytes are staged server-side until the authenticated completion call
        redeems them. The token is the sole credential on this path -- the
        route carries no bearer authentication -- and admits exactly one
        successful delivery. The body is streamed to staging under an
        incremental byte ceiling, so an oversize upload aborts mid-stream
        without filling the container's disk.
      tags: [Transfer]
      parameters:
        - name: X-Upload-Token
          in: header
          required: true
          description: >-
            The one-time upload token from the recipe. Presented on exactly
            one successful delivery; any later presentation is refused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw source file bytes, unencoded.
      responses:
        "201":
          description: >-
            Bytes staged. The receipt carries the size and digest of what the
            server received, so the sender can verify the delivery against
            the local file before issuing the completion call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferUploadResult"
        "409":
          description: >-
            `transfer_token_already_used`: this transfer already holds staged
            bytes awaiting completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: >-
            `transfer_token_invalid`: the token names no redeemable pending
            transfer (unknown, expired, already used, or scoped to a
            different direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: >-
            `transfer_content_too_large`: the body exceeded the transfer
            ceiling and the delivery was aborted; the partial staging file is
            removed and the token stays retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download/{transfer_id}:
    get:
      operationId: transfer_download
      # Exempt from the global bearer requirement: authority travels in the
      # single-use transfer_id minted by the originating call, not in an
      # Authorization header.
      security: []
      summary: Fetch a pending transfer's bytes against a one-time download token.
      description: >-
        The byte-fetch leg of a caller-local export against a deployment that
        cannot write to the caller's filesystem. The originating call mints a
        short-lived one-time token and returns a download recipe carrying
        this URL together with the exact size and digest of the bytes it
        serves; the caller's environment fetches here with the token and
        verifies the result locally. The token is the sole credential on this
        path -- the route carries no bearer authentication -- and is consumed
        at redemption, so a failed fetch is retried by re-issuing the
        originating call, never by replaying the token. Bytes stream chunked
        from the vault-source store, so no hop holds the whole file.
      tags: [Transfer]
      parameters:
        - name: transfer_id
          in: path
          required: true
          description: Public identifier of the pending transfer, from the recipe URL.
          schema:
            type: string
        - name: X-Download-Token
          in: header
          required: true
          description: >-
            The one-time download token from the recipe. Consumed at
            redemption; a second presentation is refused.
          schema:
            type: string
      responses:
        "200":
          description: The transfer's bytes, streamed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: >-
                  The raw bytes. The concrete Content-Type is derived from
                  the transfer's filename and may be more specific than
                  octet-stream.
        "410":
          description: >-
            `transfer_token_invalid`: the token names no redeemable pending
            transfer (unknown, expired, already redeemed, or scoped to a
            different direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            `vault_source_store_refused`: the vault-source store declined the
            operation on its merits -- quota, a permission it withdrew, a reply
            that could not be used. Resolve it at the store before retrying;
            `detail.store_status` carries the status it declined with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `vault_source_store_unavailable`: the vault-source store declined to
            serve the operation just now -- throttling, or a transient backend
            signal. The same request may succeed on a later attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


# =============================================================================
# Components
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------

  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Microsoft Entra ID access token, presented as `Authorization: Bearer
        <token>`.


        The token is accepted when it carries either the delegated scope
        `<resource>/Sage.Access` or the application role `Sage.Reader`.


        Deployment-portable clients must not hardcode the scope, tenant, or
        token endpoint: all three vary by deployment, and the scope string is
        derived from the deployment's own domain (for example
        `https://sage.cor.org/Sage.Access`). Resolve them at runtime from the
        unauthenticated discovery documents published by the target edge:


        - `GET /.well-known/oauth-protected-resource` advertises `resource`
          and `scopes_supported`.

        - `GET /.well-known/oauth-authorization-server` advertises the
          `authorization_endpoint`, `token_endpoint`, and `jwks_uri`.


        This scheme is declared as a plain bearer credential rather than an
        `oauth2` flow precisely because the flow URLs are per deployment;
        pinning them here would produce generated clients bound to one tenant.

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------

  parameters:
    VaultId:
      name: vault_id
      in: path
      required: true
      description: Vault identifier. All operations are scoped to a single vault.
      schema:
        type: string

    DocumentId:
      name: document_id
      in: path
      required: true
      description: Immutable document identifier (short hash + title hint).
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # -------------------------------------------------------------------------
    # Enumerations
    # -------------------------------------------------------------------------

    SourceType:
      type: string
      enum: [markdown, docx, xlsx, pptx, pdf, email, onenote, teams_chat]
      description: >-
        Source artifact format. Determines which source adapter processes
        the file during ingestion.

    EdgeType:
      type: string
      enum:
        - supersedes
        - derived_from
        - instantiated_from
        - covers
        - references
        - bundles_with
        - authoritative_for
        - depends_on
        - sync_target
        - retracts
        - merged_from
      description: >-
        Typed, directed relationship between documents. See SAGE
        Architecture Reference Section 4.6 for semantics and traversal
        use cases. Each edge type has a resolution_policy declared in
        the vault's edge_type_registry controlling how chain-scoped
        resolution treats it during traversal (CAS-ADR-017).

        `instantiated_from` models live-tracking derivation (e.g., a
        checklist instantiated from a template that should propagate
        template updates). `retracts` is a meta-edge pointing at an
        earlier edge instance that the retracting chain now disclaims.
        `merged_from` is a meta-edge recording that a successor chain
        absorbs predecessor chains, tombstoning their downstream edges.

    RationaleKind:
      type: string
      enum:
        - version_chain
        - references_mention
        - filename_code_match
        - manual
      default: manual
      description: >-
        Typed discriminator for the provenance source of an edge's
        `rationale` text. Promoted from the rationale-prefix convention
        introduced in CAS-ADR-019 (auto edge inference may delete only its
        own edges) to a typed, indexed column on the edges table.
        Auto-inference paths stamp this explicitly:
        `version_chain` for chain-repair supersedes edges,
        `references_mention` for the (future) references-mention inference
        rule, and `filename_code_match` for the filename code
        match inference rule. `manual` is the default for any edge whose
        rationale lacks a recognized prefix (hand-curated edges via
        create_edge, legacy edges, edges written before this column existed).
        Storage enforces NOT NULL with DEFAULT 'manual'.

    ResolutionPolicy:
      type: string
      enum:
        - none
        - transitive_source
        - transitive_target
        - transitive_both
        - TBD
      description: >-
        How the chain-scoped edge resolver treats an edge type during
        traversal (CAS-ADR-017).

        `none`: the edge is a lineage fact, not a propagating relationship
        (meta-edges: supersedes, retracts, merged_from).

        `transitive_source`: the edge's source anchor must lie in the
        queried document's supersedes lineage; target endpoint is frozen
        at derivation (no target anchor; target_valid_from_version is null)
        (e.g., derived_from).

        `transitive_target`: mirror of transitive_source. The edge's target
        anchor must lie in the queried document's supersedes lineage;
        source endpoint is frozen at derivation (no source anchor;
        source_valid_from_version is null).

        `transitive_both`: both source and target anchors must lie in
        their respective chains' lineages relative to the query document
        (e.g., covers, references, bundles_with, depends_on,
        instantiated_from).

        `TBD`: policy not yet frozen. Any attempt to create or migrate an
        edge with a TBD policy raises a write-time error.

    LifecycleStatus:
      type: string
      enum: [active, completed, archived]
      description: >-
        Base lifecycle states. Vaults may define additional domain-specific
        states (e.g., "filed" in Example Portfolio). The base set is
        declared by every vault whose lifecycle keeps
        `base_states_required` true (the default).

    LifecycleAction:
      type: string
      enum: [supersede, complete, archive, reactivate]
      description: >-
        Base lifecycle transition actions. Vaults may define additional
        domain-specific actions (e.g., "file" in Example Portfolio).

    RetrievalMode:
      type: string
      enum: [semantic, keyword, catalog, deterministic]
      description: >-
        Retrieval mode. Semantic returns ranked approximate results via
        vector + optional BM25 fusion. Keyword returns BM25-only results.
        Catalog returns all documents matching filter predicates via direct
        SQL query (no vector search, no chunk content, supports pagination
        via offset). Deterministic returns exact content by address.

    RetrievalScope:
      type: string
      enum: [all, authoritative, specific, filtered]
      description: >-
        Controls which documents are eligible for retrieval, independent
        of mode.

    RetrievalTarget:
      type: string
      enum: [documents, edges, facets]
      default: documents
      description: >-
        Discriminates what search enumerates: documents, edges, or
        facets. "documents" (default) preserves the historical surface:
        results are DiscoverHit rows. "edges" switches the dispatch to
        first-class edge enumeration: results are EdgeHit rows carrying
        edge_id, endpoints, edge_type, anchor versions, rationale, and
        retraction state. "facets" switches to vocabulary aggregation:
        results are FacetHit rows carrying the requested facet fields'
        top distinct values with counts (every facet field when none
        are selected), each row capped to a per-field value limit and
        carrying the field's true distinct-value total, so the response
        stays bounded at any corpus size and tagging density. "edges" and "facets" are valid
        only with mode="catalog"; other modes are rejected at request
        validation.

    FacetField:
      type: string
      enum: [doc_type, lifecycle_status, source_type, pipeline_status, tags]
      description: >-
        A document metadata field exposed for facet aggregation. The
        closed vocabulary of the facet_fields request parameter: search
        with target="facets" aggregates any subset of these, defaulting
        to all of them.

    ResponseMode:
      type: string
      enum: [light, full]
      description: >-
        Canonical payload-depth selector across SAGE surfaces.
        "light" omits large per-item fields and returns only
        identity/status; "full" returns the complete envelope. When
        unset, surfaces that honor this parameter apply their own
        default-resolution rule (search edges and the bulk
        mutation tools both default to "light" when their result/batch
        size exceeds five, otherwise "full"). Per-
        surface light-mode shape varies: search(target="edges")
        keeps edge identity columns; the bulk mutation tools drop the
        per-item document body entirely. Failure entries always carry
        the full structured error envelope regardless of mode.

    CatalogSortBy:
      type: string
      enum: [title, doc_type, document_date, lifecycle_status]
      description: >-
        Sort key for catalog mode results. Ignored by other retrieval modes.

    SortOrder:
      type: string
      enum: [asc, desc]
      description: >-
        Sort direction for catalog mode results. Ignored by other modes.

    UserType:
      type: string
      enum: [human, agent]
      description: Actor type for provenance and access control.

    PipelineStatus:
      type: string
      enum:
        - projection_complete
        - indexing_in_progress
        - indexing_complete
        - abstraction_in_progress
        - abstraction_complete
        - abstraction_skipped
        - abstraction_interrupted
        - failed
      description: >-
        Tracks progress of the three-stage ingestion pipeline.
        "abstraction_skipped" indicates the vault has abstraction
        disabled or the LLM was unavailable (graceful degradation
        per CAS-ADR-011).


        "abstraction_interrupted" records abstraction work that was
        dropped rather than attempted: the queue draining it was
        stopped before the work ran or finished. It is terminal
        because nothing is left running to advance the document, and
        it is not a success -- pipeline_error carries the cause.
        Unlike the other non-success terminal status it says nothing
        about the document or the provider, so startup recovery
        re-enqueues it where it leaves "failed" alone.

    TraversalDirection:
      type: string
      enum: [outbound, inbound, both]
      description: Edge traversal direction relative to the starting document.

    # -------------------------------------------------------------------------
    # Identifiers
    # -------------------------------------------------------------------------
    #
    # The named identifier types that response schemas reference. The
    # like-named entries under `components/parameters` describe the same
    # values arriving as path parameters; these describe them appearing
    # as properties of a response body.

    VaultId:
      type: string
      description: Vault identifier. All operations are scoped to a single vault.

    DocumentId:
      type: string
      description: Immutable document identifier (short hash + title hint).

    # -------------------------------------------------------------------------
    # Core Entities
    # -------------------------------------------------------------------------

    Document:
      type: object
      description: >-
        The primary entity in SAGE. Represents a single source artifact
        with its identity, metadata, relationships, and lifecycle state
        managed in the graph store.
      required:
        - id
        - title
        - source_type
        - source_path
        - lifecycle_status
        - created_by
        - created_at
        - last_modified_by
        - updated_at
        - pipeline_status
      properties:
        id:
          type: string
          description: Immutable, assigned at creation (short hash + hint from title).
        title:
          type: string
          description: Human-readable display name, editable via update_metadata.
        source_type:
          $ref: "#/components/schemas/SourceType"
        source_path:
          type: string
          description: Location of the original artifact (local file path or URI).
        lifecycle_status:
          type: string
          description: >-
            Current lifecycle state. Uses the base LifecycleStatus enum
            plus any vault-defined extensions.
        version_label:
          type: string
          nullable: true
          description: Human-readable version indicator (v1, v2, draft, final, etc.).
        project:
          type: string
          nullable: true
          description: Project or workstream identifier.
        tags:
          type: array
          items:
            type: string
          description: Freeform tags, extractable from YAML frontmatter or assigned manually.
        authority_scope:
          type: string
          nullable: true
          description: Content domain this document governs, if authoritative.
        doc_type:
          type: string
          nullable: true
          description: >-
            Vault-configured document type (Tier 2 metadata). Values are
            defined in the vault's document_types configuration.
        source_content_hash:
          type: string
          description: >-
            Hash of source file content at last ingestion (provenance). The
            SHA-256 of the bytes the caller delivered, so a caller holding the
            original can match it and duplicate detection is keyed to content
            identity rather than to how any store chose to retain it.
        stored_content_hash:
          type: string
          nullable: true
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            SHA-256 of the source bytes as retained by the vault-source store.
            Equal to `source_content_hash` when the store keeps the delivered
            bytes verbatim, and different when the binding rewrites the copy at
            rest (CAS-ADR-043). The source-file integrity audit compares the
            retained copy against this value, falling back to
            `source_content_hash` when it is null. Null identifies a document
            ingested before the two hashes were recorded separately; for those
            the provenance hash is the as-stored hash and the delivered-byte
            hash is unrecoverable.
        adapter_version:
          type: string
          description: Version of the source adapter used at last ingestion.
        created_by:
          type: string
          description: User ID of the actor (human or agent) that created this document.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
        last_modified_by:
          type: string
          description: >-
            User ID of the actor responsible for the most recent
            modification. Set to created_by at document creation;
            updated on lifecycle transitions and metadata changes.
        updated_at:
          type: string
          format: date-time
          description: Last modification timestamp.
        projected_at:
          type: string
          format: date-time
          nullable: true
          description: Last time the source adapter ran against this source.
        indexed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Last time projection was chunked and embedded into content store.
            Null until indexing completes (pipeline_status reaches
            indexing_complete). Not updated by abstraction (Stage 3).
        source_modified_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Modification timestamp of the source file at time of ingestion.
            Extracted by source adapters from filesystem metadata (st_mtime).
            Null for non-file sources or when the adapter does not provide it.
        document_date:
          type: string
          nullable: true
          description: >-
            Authoritative content date in YYYY-MM-DD format. Derived from
            the filename date code when present, falling back to the date
            portion of source_modified_at. Null for non-file sources when
            neither is available.
        semantic_abstract:
          type: string
          nullable: true
          description: >-
            LLM-generated abstract with density-proportional length.
            Generated at ingestion Stage 3, regenerated on re-ingestion.
            Null if abstraction is disabled or pending (CAS-ADR-011).
        pipeline_status:
          $ref: "#/components/schemas/PipelineStatus"
        pipeline_error:
          type: string
          nullable: true
          description: >-
            Why the pipeline did not succeed. When pipeline_status is
            "failed", the error message from the failing pipeline stage
            (projection, indexing, or abstraction); when it is
            "abstraction_interrupted", which work was dropped and why.
            Null when the pipeline has neither failed nor been
            interrupted, and cleared when the document next reaches a
            successful terminal pipeline_status, so a recovered document
            carries no record of what it recovered from.
        tier3_metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Source-type-specific metadata (Tier 3). Structure varies by
            source_type. Stored as key-value pairs in the graph store.
        metadata_confirmed:
          type: boolean
          description: >-
            True when the document's metadata has been confirmed (no
            filename inference needed or inferred values have been
            reviewed). False marks the document as pending in the
            metadata-review queue.

    DocumentSummary:
      type: object
      description: Compact document representation for list and search results.
      required:
        - id
        - title
        - lifecycle_status
        - source_type
      properties:
        id:
          type: string
          description: Unique document identifier.
        title:
          type: string
          description: Human-readable document title.
        lifecycle_status:
          type: string
          description: Current lifecycle state of the document (active, archived, etc.).
        source_type:
          $ref: "#/components/schemas/SourceType"
        version_label:
          type: string
          nullable: true
          description: Caller-supplied version label for the document (e.g. "v1.2"); null when no version is tracked.
        project:
          type: string
          nullable: true
          description: Project the document belongs to within the vault's domain; null when unscoped.
        doc_type:
          type: string
          nullable: true
          description: Vault-domain document type from the doc_types vocabulary; null when not classified.
        tags:
          type: array
          items:
            type: string
          description: Caller-supplied tags applied to the document.
        semantic_abstract:
          type: string
          nullable: true
          description: >-
            LLM-generated semantic abstract of the document content.
            Present when the ingestion pipeline completed abstraction;
            null when abstraction was skipped or the document predates
            abstract generation. Enables steward agents and vault-steward
            discovery to access document orientation without a separate
            get_document call (CAS-ADR-011).
        tier3_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Typed per-doc_type metadata (CAS-ADR-028). Opaque dict whose
            key set is determined by the document's doc_type tier3 schema;
            consumers should probe for keys defensively because the shape
            varies by doc_type. Null when the document carries no tier3
            metadata, either because the doc_type declares no schema or
            because no values have been set. Surfaced on the projection
            so callers can read fields like ticket_priority or
            failure_class from a single catalog/semantic/keyword pass
            without follow-up get_document round-trips.
        source_path:
          type: string
          nullable: true
          description: Location of the original artifact, when present.
        source_modified_at:
          type: string
          format: date-time
          nullable: true
          description: Source file modification timestamp at last ingestion.
        document_date:
          type: string
          nullable: true
          description: >-
            Authoritative content date in YYYY-MM-DD format (calendar
            date, not a UTC-anchored instant). Matches the on-disk
            Document.document_date shape — the projection passes the
            string through unchanged so the wire serialization stays a
            bare calendar date. Consumers that need a datetime (e.g.,
            recency scoring) parse it at the use site.

    DocumentSummaryLight:
      type: object
      description: >-
        Stripped DocumentSummary returned by `search` with
        `target="documents", mode="catalog", response_mode="light"`.
        Carries only the identity columns plus the two fields
        most callers need for triage (doc_type and tier3_metadata).
        Other DocumentSummary fields (source_type, source_path,
        version_label, project, tags, document_date, source_modified_at,
        semantic_abstract) are intentionally absent to keep bulk catalog
        enumerations inside the MCP inline-output budget. Callers who
        need the omitted fields pass `response_mode="full"` (returns
        DocumentSummary) or fall back to `get_document` per id.
      required:
        - id
        - title
        - lifecycle_status
      properties:
        id:
          type: string
          description: Unique document identifier.
        title:
          type: string
          description: Human-readable document title.
        lifecycle_status:
          type: string
          description: Current lifecycle state of the document (active, archived, etc.).
        doc_type:
          type: string
          nullable: true
          description: Vault-domain document type from the doc_types vocabulary; null when not classified.
        tier3_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Typed per-doc_type metadata (CAS-ADR-028). Opaque dict whose
            key set is determined by the document's doc_type tier3 schema.

    Edge:
      type: object
      description: >-
        A typed, directed relationship between two documents in the
        graph store. Duplicate edges (same source, target, type) are
        permitted; each has a unique id. Anchor fields
        (source_valid_from_version, target_valid_from_version,
        valid_until_version) and retracted_edge_id participate in
        chain-scoped resolution (CAS-ADR-017); which anchor fields are
        required at write time depends on the edge type's
        resolution_policy.
      required:
        - id
        - source_id
        - edge_type
        - created_at
      properties:
        id:
          type: string
          description: >-
            Unique edge identifier, auto-generated at creation. The
            production edges table enforces UNIQUE (source_id, target_id,
            edge_type), so at most one edge per natural-key triple ever
            exists; the id is still per-edge for retracted_edge_id targeting
            and for audit trails.
        source_id:
          type: string
          description: Origin document ID.
        target_id:
          type: string
          nullable: true
          description: >-
            Target document ID. Null on `retracts` edges, which target
            an edge instance rather than a document (see
            retracted_edge_id).
        edge_type:
          $ref: "#/components/schemas/EdgeType"
        resolution_policy:
          $ref: "#/components/schemas/ResolutionPolicy"
          nullable: true
          description: >-
            Effective resolution policy, copied from the vault's
            edge_type_registry at edge creation time. Frozen on the
            row so later registry edits do not retroactively change
            resolution behavior for existing edges. Null when an Edge
            is constructed without policy resolution (e.g., the
            traversal-node Edge views returned by traverse).
        source_valid_from_version:
          type: string
          nullable: true
          description: >-
            Document ID of the version on the source chain where this
            edge becomes applicable. Required for policies
            `transitive_source` and `transitive_both`; must be null for
            policy `none` (except `retracts`, which carries a one-sided
            anchor on the retracting chain).
        target_valid_from_version:
          type: string
          nullable: true
          description: >-
            Document ID of the version on the target chain where this
            edge becomes applicable. Required for policy
            `transitive_both`; frozen at edge creation for policy
            `transitive_source` and copied from target_id; must be null
            for policy `none`.
        valid_until_version:
          type: string
          nullable: true
          description: >-
            Document ID marking the chain head at which this edge is
            tombstoned by a `merged_from` termination. Null on a live
            edge. Set atomically by the merge operation on predecessor
            edges. Resolution ignores tombstoned edges downstream of
            this version.
        retracted_edge_id:
          type: string
          nullable: true
          description: >-
            Set only on `retracts` edges; identifies the edge instance
            being retracted. Null on all other edge types.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the edge was created.
        notes:
          type: string
          nullable: true
          description: Optional annotation on why the relationship exists.
        rationale:
          type: string
          nullable: true
          description: >-
            Decision rationale for this relationship. Particularly
            valuable on supersedes edges for capturing why the
            transition occurred (CAS-ADR-011).
        rationale_kind:
          $ref: "#/components/schemas/RationaleKind"
          description: >-
            Typed discriminator for the rationale's provenance source.
            Promoted from the rationale-text prefix convention in
            CAS-ADR-019 to a typed, indexed column. Auto-
            inference paths stamp this explicitly; hand-curated edges
            and legacy rows take the default `manual`.
        synced_from_version:
          type: string
          nullable: true
          description: >-
            The source-chain version (document id) the content was
            copied or derived from at the moment this edge was
            asserted. Semantically meaningful on `sync_target` (Tier 1,
            populated automatically at re-ingestion when the Tier-1
            inference subsystem ships) and `derived_from` (Tier 3,
            agent-supplied via create_edge). Distinct from
            `source_valid_from_version`, which records chain-scoped
            edge visibility per CAS-ADR-017 — the two must not be
            conflated. Unset = explicit null; never inferred from chain
            anchors.
        synced_from_content_hash:
          type: string
          nullable: true
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            The source document's `source_content_hash` captured at
            the moment this edge was asserted. Optional companion to
            `synced_from_version`; recommended on derivations because
            version labels are reused and can drift from content
            (in-place edits). Always the canonical
            `sha256:` + 64 lowercase hex form; request schemas accept
            wider spellings and normalize to it;
            unset = explicit null.

    User:
      type: object
      description: >-
        Any actor (human or agent) registered in the vault. Serves
        provenance tracking and access control.
      required:
        - id
        - display_name
        - user_type
        - created_at
      properties:
        id:
          type: string
          description: Immutable, assigned at registration.
        display_name:
          type: string
          description: Human-readable name for the user (shown in audit logs and UIs).
        user_type:
          $ref: "#/components/schemas/UserType"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the user was registered.

    # -------------------------------------------------------------------------
    # Request Schemas
    # -------------------------------------------------------------------------

    DiscoverRequest:
      type: object
      description: >-
        Retrieval request. Required fields vary by mode:

        - semantic: query is required.

        - keyword: query is required. Use query="*" for filter-only listing.

        - catalog: no query required. Returns document-level metadata only
          (no chunks or scores). Queries the graph store directly with filter predicates.
          Supports pagination via limit + offset.

        - deterministic: document_id and heading_path are required.
      required: [mode]
      properties:
        query:
          type: string
          description: >-
            Search query text. Required for semantic and keyword modes.
            Ignored in catalog mode.
        mode:
          $ref: "#/components/schemas/RetrievalMode"
        scope:
          $ref: "#/components/schemas/RetrievalScope"
          default: all
          description: >-
            Retrieval scope that narrows the candidate set before
            relevance ranking. Default "all" applies no scope filter.
        filters:
          $ref: "#/components/schemas/RetrievalFilters"
        document_id:
          type: string
          description: >-
            Target document for deterministic extraction.
            Required for deterministic mode.
        heading_path:
          type: string
          description: >-
            Heading hierarchy path for deterministic extraction
            (e.g., "Section 3 > Definitions > Normalization").
            Required for deterministic mode.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Maximum number of results to return.
        offset:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Number of results to skip before returning. Used with limit
            for pagination in catalog mode. Ignored by other modes.
        use_hybrid:
          type: boolean
          default: true
          description: >-
            Enable hybrid retrieval (vector + BM25 fusion) in semantic
            mode. Valuable when queries contain both natural language
            and specific identifiers. Set to false for pure vector
            similarity search.
        use_abstract_prefilter:
          type: boolean
          default: true
          description: >-
            Enable two-pass abstract-boosted retrieval (CAS-ADR-011).
            When true, documents whose semantic abstract matches the
            query receive a score boost above documents whose abstract
            does not match. Applies to semantic and keyword modes.
            Documents without abstracts are not excluded. Set to false
            for pure content-only relevance ranking.
        include_abstracts:
          type: boolean
          default: false
          description: >-
            When true, include the `semantic_abstract` field on each
            returned chunk's document record. Off by default because
            abstracts are large strings and inflate the response
            payload; turn on when the caller needs to inspect or
            display abstracts. Applies to semantic and keyword modes.
        min_relevance:
          type: number
          nullable: true
          description: >-
            Minimum relevance score (0.0-1.0) required for a chunk to
            appear in results. Null (default) applies no threshold.
            Used to suppress weak matches when the caller wants tight
            precision; the filter is applied after ranking and before
            limit is applied, so weak-match suppression may reduce the
            returned result count below the requested limit.
        sort_by:
          $ref: "#/components/schemas/CatalogSortBy"
          description: >-
            Sort key for catalog mode results. Optional. Default when
            omitted: active lifecycle first, then document_date descending.
            Ignored by other retrieval modes.
        sort_order:
          $ref: "#/components/schemas/SortOrder"
          description: >-
            Sort direction for catalog mode results. Optional. Defaults
            to ascending when sort_by is specified. Ignored by other modes.
        target:
          $ref: "#/components/schemas/RetrievalTarget"
          default: documents
          description: >-
            Selects what the query enumerates: documents (default),
            edges, or facets. "edges" is valid only with mode=catalog
            and with edge-only filter keys (source_id, target_id,
            edge_type). "facets" is valid only with mode=catalog and
            document-only filter keys, and rejects non-default
            pagination and payload-shape parameters (limit, offset,
            sort_by, sort_order, response_mode). Other mode/parameter
            combinations are rejected via mode_parameter_mismatch.
        response_mode:
          $ref: "#/components/schemas/ResponseMode"
          nullable: true
          description: >-
            Canonical payload-depth selector across SAGE surfaces.
            Semantics by target and
            mode: (edges) `light` returns identity columns only
            (edge_id, endpoints, edge_type); `full` carries the
            complete envelope; default obeys a >5-results threshold
            rule. (documents+catalog) `light` returns a stripped
            DocumentSummaryLight; `full` returns the full
            DocumentSummary; the threshold rule does NOT apply --
            default is full-equivalent. (documents+semantic/keyword)
            `light` suppresses chunk_content; `full` includes it.
            (documents+deterministic) ignored; deterministic always
            returns chunk content.
        facet_fields:
          type: array
          items:
            $ref: "#/components/schemas/FacetField"
          minItems: 1
          nullable: true
          description: >-
            Facet fields to aggregate for the facets target. Any subset
            of: doc_type, lifecycle_status, source_type,
            pipeline_status, tags. Null (default) aggregates all five.
            Rows return in that fixed field order regardless of the
            order given here. Not valid for other targets.
        facet_value_limit:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Per-field cap on the number of facet values returned for
            the facets target, keeping the top values by descending
            count then value. Minimum 1. Null (default) applies the
            built-in cap of 50. Each row's total_distinct reports the
            true distinct-value count regardless of the cap, so
            truncation is always detectable; to read a full vocabulary,
            re-call with facet_value_limit set to the reported
            total_distinct. Not valid for other targets.

    RetrievalFilters:
      type: object
      description: >-
        Metadata filters applied before retrieval. Used when scope
        is "filtered", but also applicable as additional constraints
        with other scopes.
      properties:
        doc_type:
          type: string
          description: Filter by vault-configured document type.
        project:
          type: string
          description: Filter by project identifier.
        lifecycle_status:
          type: string
          description: Filter by lifecycle state.
        tags:
          type: array
          items:
            type: string
          description: Filter by tags (documents must have all specified tags).
        document_ids:
          type: array
          items:
            type: string
          description: >-
            Restrict to a specific set of documents. Used with
            scope "specific". A malformed id rejects the request with
            invalid_document_id (400) rather than resolving to no
            match.
        pipeline_status:
          type: string
          description: >-
            Filter by pipeline status (e.g., "failed",
            "abstraction_complete"). Overrides the default exclusion
            of failed-pipeline documents.
        source_type:
          $ref: "#/components/schemas/SourceType"
          description: >-
            Filter by the source artifact format the document was
            ingested from (e.g. "docx", "markdown"). Typed against the
            SAGE SourceType enum, so a value outside the closed set is
            rejected at validation time via invalid_filter_value rather
            than silently returning zero rows.
        tier3_metadata:
          type: object
          additionalProperties: true
          description: >-
            Tier 3 (per-doc_type typed metadata) filter, applied in
            SQL. Each key/value pair in the dict is matched against
            the document's `tier3_metadata` dict via exact equality,
            compared by JSON type: a string matches a stored string,
            and a number, integer, or boolean matches a stored value
            of that same JSON type. Numbers compare by value rather
            than by rendered text, so a stored 1.0 matches a filter
            of 1. A value of null matches documents whose stored
            field is either null or absent from the tier3_metadata
            dict. All pairs AND together; an empty dict is treated
            as no filter.
        source_id:
          type: string
          description: >-
            Edge-only filter. Filter edges by source document
            id. Valid only when target="edges"; document-target requests
            that set this are rejected via mode_parameter_mismatch.
        target_id:
          type: string
          description: >-
            Edge-only filter. Filter edges by target document
            id. Valid only when target="edges". Note: retracts-type edges
            have target_id=NULL and are not selected by this filter.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
          description: >-
            Edge-only filter. Filter edges by edge_type (e.g.,
            "references", "depends_on"). Valid only when target="edges".
            Typed against the SAGE EdgeType enum so a typo like
            "refrences" is rejected at validation time rather than
            silently returning zero rows.

    SetLifecycleRequest:
      type: object
      required: [action]
      description: Request body for the set-lifecycle endpoint; selects a lifecycle transition action and, when superseding, the replacement version.
      properties:
        action:
          type: string
          description: >-
            Lifecycle transition action. The action vocabulary is
            vault-config-defined; see `lifecycle.transitions` in the
            vault config for the authoritative list. Examples seen in
            practice: `supersede`, `complete`, `archive`, `reactivate`
            (cas vault) plus `file` (example_vault vault). Neither vault
            defines `activate`; the action for `archived → active` is
            `reactivate`.
        successor_id:
          type: string
          description: >-
            Document ID of the replacement version. Required when
            `action="supersede"`; forbidden for all other actions. SAGE
            creates a `supersedes` edge from the new version to this
            document atomically with the lifecycle transition. The
            successor document must already exist and be active; this
            operation does not create it.
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, run all validators and compute
            the would-be projection of the post-transition state, but
            do NOT persist. The response carries the would-be
            `document`, `dry_run=true`, and a `changes` block
            with a single `lifecycle_status` entry when the action
            changes state; for `supersede`, the would-be `created_edge`
            is also populated with the nil-UUID sentinel id
            `00000000-0000-0000-0000-000000000000` so a caller that
            mistakes it for a real edge id fails loudly on lookup
            (not duplicated in `changes`). The per-document lock is
            still acquired so the preview is consistent with
            concurrent mutations.

    UpdateMetadataRequest:
      type: object
      additionalProperties: false
      description: >-
        Partial update of mutable document metadata. Only fields present
        in the request are modified. Scalar fields (title, version_label,
        project, doc_type, authority_scope, document_date) use set-or-omit
        semantics: pass a value to set, omit to leave unchanged. List-
        valued metadata fields (today: `tags`) take a `ListFieldPatch`
        ops-object; `tier3_metadata` takes a `Tier3Patch`. The signature
        deliberately omits a wholesale-replace mode; the patch shape is
        the single path for collection-field edits. See CAS-ADR-028 for
        the ingest-vs-update shape asymmetry rationale and CAS-ADR-038
        for the concurrency-safety contract behind the ops-object form.
      properties:
        title:
          type: string
          description: New human-readable title; omit to leave unchanged.
        version_label:
          type: string
          description: New caller-supplied version label; omit to leave unchanged.
        project:
          type: string
          description: New project scope for the document; omit to leave unchanged.
        tags:
          $ref: "#/components/schemas/ListFieldPatch"
        doc_type:
          type: string
          description: Must be a valid value in the vault's document_types configuration.
        authority_scope:
          type: string
          nullable: true
          description: New authority scope (read-classification scope used by access-control filtering); omit to leave unchanged.
        document_date:
          type: string
          format: date
          description: >-
            Document calendar date (YYYY-MM-DD). Editable to correct
            fallback-derived dates that misattributed across UTC midnight.
        tier3_metadata:
          $ref: "#/components/schemas/Tier3Patch"
        expected_version:
          type: string
          nullable: true
          description: >-
            Optimistic-concurrency token (CAS-ADR-038 Primitive B). When
            supplied, the substrate verifies it against the document's
            current version inside the per-document lock at write time;
            on mismatch the write is rejected with a structured
            `stale_read` 409 carrying the current version in detail. When
            omitted (the default), behavior is last-writer-wins and
            unchanged from the pre-Primitive-B contract. The version
            source is the document's `updated_at` value as observed on
            a prior read.
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, run all validators and compute
            the would-be projection of the post-patch state, but do NOT
            persist. The response carries the would-be `document`,
            `dry_run=true`, and a `changes` block enumerating
            field-level deltas (scalar fields by bare name; tier3 keys
            as dotted paths; tags as full before/after lists); no
            chunk-store sync, no `metadata_confirmed` flip, no
            `updated_at` advance. The per-document lock is still
            acquired so the preview is consistent with concurrent
            mutations.

    ListFieldPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Patch operations on a list-valued metadata field. At least one
        of `add` or `remove` must be present and non-empty. Adding a
        value already present, or removing a value not present, returns
        400 (`{field}_add_conflict` / `{field}_remove_conflict`, e.g.
        `tags_add_conflict`). `add` and `remove` must be disjoint;
        duplicates within either list are rejected at request validation.
        See CAS-ADR-038 for the concurrency-safety contract this shape
        implements (parallel adds of distinct values are commutative).
      properties:
        add:
          type: array
          items:
            type: string
          minItems: 1
          description: Values to add. None may already be present on the field.
        remove:
          type: array
          items:
            type: string
          minItems: 1
          description: Values to remove. All must currently be present on the field.

    Tier3Patch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Patch operations on the document's tier3_metadata dict. At
        least one of `set` or `unset` must be present and non-empty.
        `set` keys overwrite existing values without error (the verb
        is literal: assert this post-state value). `unset` keys must
        currently be present (else 400 `tier3_unset_conflict`). `set`
        and `unset` keys must be disjoint. The merged result is
        validated against the resolved doc_type's `metadata_schema`
        after applying the patch in memory; an individually-valid
        patch that produces an invalid merged dict returns 400
        `tier3_schema_violation`. When the same call also changes
        `doc_type`, any merged keys not present in the new schema's
        `properties` raise 400 `tier3_doc_type_change_stale_keys`
        before schema validation runs; the error's `detail.stale_keys`
        names the keys the caller must add to `unset`. A new doc_type
        with no `metadata_schema` allows no keys, so every merged key
        is stale.
      properties:
        set:
          type: object
          minProperties: 1
          additionalProperties: true
          description: Key-value pairs to set. Overwrites existing keys.
        unset:
          type: array
          items:
            type: string
          minItems: 1
          description: Keys to remove. All must currently be present.

    IngestRequest:
      type: object
      required: [source, source_type]
      description: >-
        Request body for the ingest endpoint. Identifies the source
        artifact and source_type to project it through, plus optional
        caller-authoritative metadata, supersession hints, and
        pipeline-control flags. See CAS-ADR-021 for the metadata
        precedence chain.
      properties:
        source:
          type: string
          description: >-
            Path or URI to the source artifact. Resolved relative to
            the vault's storage_root.
        source_type:
          $ref: "#/components/schemas/SourceType"
          description: >-
            Source artifact format. Determines which source adapter
            processes the artifact. Must be a source type with a
            registered adapter.
        config:
          type: object
          additionalProperties: true
          description: >-
            Adapter-specific configuration overrides. Structure depends
            on the adapter type.
        created_by:
          type: string
          description: >-
            User ID of the actor initiating ingestion. Used for
            provenance tracking. Phase 2+ implementations may derive
            this from the authenticated caller identity.
        force:
          type: boolean
          default: false
          description: >-
            When true, bypasses duplicate content detection and re-runs
            the full pipeline on the existing document record (if one
            exists with the same source_path and source_content_hash).
            Returns 200 (re-processed) instead of 201 (new). The
            document ID is preserved. Use for pipeline failure recovery.
        needs_review:
          type: boolean
          default: false
          description: >-
            When true, the document is held in the metadata-review queue
            after ingest: filename inference runs, parsed values populate
            the document where the caller did not supply them, and
            metadata_confirmed is set to false so the document appears in
            pending-metadata. When false (default per CAS-ADR-021),
            filename inference is skipped entirely; the document is
            committed with caller-supplied metadata authoritative and
            metadata_confirmed=true. Bulk-ingest UIs that want human
            confirmation of inferred values pass needs_review=true
            explicitly; agent ingests with prepared metadata leave it
            at the default.
        metadata:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          nullable: true
          description: >-
            Caller-supplied metadata fields to merge into the document
            record at ingestion time. Per CAS-ADR-021, callers are
            authoritative for metadata; SAGE applies values per-field
            with the precedence chain caller > filename parse (only
            when needs_review=true) > chain inherit (predecessor's
            doc_type, project, authority_scope when predecessor_id
            is set and the caller omitted the field) > vault default
            (doc_type only, falls through to `misc`). Fields with null
            values are ignored. Unknown field names are stored but have
            no schema-enforced semantics. Values are strings except
            tags, which may be supplied as a list of strings or as a
            comma-separated string (parity with update_metadata's
            list-typed tags field).
        predecessor_id:
          type: string
          nullable: true
          description: >-
            When provided, the ingested document is treated as a new
            version that supersedes the named predecessor. After
            successful ingestion, SAGE applies the `supersede` lifecycle
            transition on the predecessor: creates a `supersedes` edge
            from the new document to the predecessor and moves the
            predecessor to the state the vault's transition table lands
            `supersede` in (`archived` in the create-vault scaffold).
            Predecessor validation (exists + the vault's transition
            table permits `supersede` from its current state + different
            content hash) runs before projection; failures return
            404/409 before any pipeline work begins.
        expected_head_version:
          type: string
          nullable: true
          description: >-
            Optimistic-concurrency token on the chain head identified
            by `predecessor_id` (CAS-ADR-038 Primitive C). When
            supplied, the substrate verifies it against the
            predecessor's current `updated_at` inside the
            per-predecessor lock at supersede time; on mismatch the
            supersede is rejected with a structured `stale_chain_head`
            409 carrying the current head id and version in detail.
            When omitted (the default), the supersede proceeds without
            a version check (back-compat for callers that have not
            adopted the contract). The version source is the
            predecessor's `updated_at` value as observed on a prior
            `GET /documents/{id}` read, in its canonical wire form
            (ISO 8601 with `Z` suffix). Requires `predecessor_id`;
            supplying this token on a fresh-chain ingest returns 400
            `expected_head_version_requires_predecessor`.
        tier3_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Caller-authoritative tier-3 typed metadata applied at
            create time per CAS-ADR-021. Validated against the
            doc_type's `metadata_schema` declared in vault config
            (`document_types.{doc_type}.metadata_schema`); if the
            doc_type has no schema declared, the ingest fails with
            400 `tier3_schema_violation`. Bare-dict form: the entire
            object is the tier-3 metadata for the new document. This
            is the ingest-vs-update shape asymmetry called out in
            CAS-ADR-028: ingest takes the literal dict, whereas
            `UpdateMetadataRequest.tier3_metadata` takes a
            `Tier3Patch` ops-object with `set`/`unset` semantics.
        document_id:
          type: string
          nullable: true
          description: >-
            Pins the force-reingest target. Force-reingest keys the
            record to reuse by content hash alone; when the incoming
            file is byte-identical to an existing document stored at a
            different source_path, the hash match may be an unrelated
            document. To protect that document's identity, a
            different-path collision is rejected with 409
            `force_reingest_path_mismatch` unless this field names the
            record the caller intends to overwrite (for example,
            re-ingesting a document whose file legitimately moved).
            Consulted only when `force=true` and a content-hash
            collision exists; ignored otherwise.

    ParseFilenameRequest:
      type: object
      required: [filename, source_type]
      description: >-
        Inputs for the side-effect-free filename parser endpoint.
        Carries the bare filename (basename, not a full path) and the
        source_type under whose vault configuration the parse should
        run.
      properties:
        filename:
          type: string
          description: >-
            Filename to parse. Should be the basename of the source
            file; the parser does not consume directory components.
        source_type:
          $ref: "#/components/schemas/SourceType"
          description: >-
            Source artifact format whose filename_extraction
            configuration governs the parse. Must be a source type
            with a registered adapter.

    ParseFilenameResponse:
      type: object
      description: >-
        Metadata fields the FilenameParser extracted from the supplied
        filename. All fields are nullable; a field is null when the
        parser could not extract it (no pattern configured, pattern
        did not match, or the captured segment was empty). No document
        is created and vault state is unchanged.
      properties:
        title:
          type: string
          nullable: true
          description: Title segment extracted from the filename; null when no title was captured.
        project:
          type: string
          nullable: true
          description: Project code extracted from the filename via project_identifier; null when none captured.
        version_label:
          type: string
          nullable: true
          description: Version label extracted from the filename; null when none captured.
        document_date:
          type: string
          nullable: true
          description: ISO-8601 date string when extractable.
        doc_type:
          type: string
          nullable: true
          description: >-
            Resolved doc_type after applying the vault's
            keyword_to_doc_type and code_to_doc_type maps over the
            parsed segments. Null when no mapping fires.
        codes:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Code segments extracted from the filename via
            known_code_patterns or the configured filename pattern.
            Null when the parser has no pattern; empty list when the
            pattern ran but matched no codes.

    LinkRequest:
      type: object
      required: [source_id, edge_type]
      description: >-
        Create an edge. `target_id` is required for all edge types
        except `retracts` (which uses `retracted_edge_id` instead).
        Anchor fields (`source_valid_from_version`,
        `target_valid_from_version`) are required, optional, or
        forbidden depending on the edge type's `resolution_policy` per
        CAS-ADR-017. Write-time validation enforces the policy-keyed
        invariant and returns 400 `edge_anchor_policy_violation` on
        violation. Creating an edge whose registry policy is `TBD`
        returns 400 `tbd_policy_edge`.
      properties:
        source_id:
          type: string
          description: Origin document ID.
        target_id:
          type: string
          nullable: true
          description: >-
            Target document ID. Must be null on `retracts` edges;
            required for every other edge type.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
        source_valid_from_version:
          type: string
          nullable: true
          description: >-
            Document ID on the source chain where this edge becomes
            applicable. Required for policies `transitive_source` and
            `transitive_both`; also required (one-sided) for `retracts`.
            Must be null for policy `none` on non-retracts edges. Must
            lie in the supersedes lineage of source_id (or of the
            retracting chain head for `retracts`).
        target_valid_from_version:
          type: string
          nullable: true
          description: >-
            Document ID on the target chain where this edge becomes
            applicable. Required for policy `transitive_both`; must be
            null for policies `transitive_source`, `none`, and for
            `retracts` edges. Must lie in the supersedes lineage of
            target_id when supplied.
        retracted_edge_id:
          type: string
          nullable: true
          description: >-
            Required for `retracts` edges; must identify an existing
            edge in this vault. Must be null for all other edge types.
        notes:
          type: string
          nullable: true
          description: Optional annotation.
        rationale:
          type: string
          nullable: true
          description: Decision rationale for creating this relationship.
        rationale_kind:
          $ref: "#/components/schemas/RationaleKind"
          nullable: true
          description: >-
            Optional explicit discriminator (CAS-ADR-019).
            When omitted or null, the service derives the value from
            the rationale text prefix and falls back to `manual` for
            unrecognized or absent rationale. Callers should pass this
            only when they have stronger provenance information than
            the prefix-derivation rule.
        synced_from_version:
          type: string
          nullable: true
          description: >-
            The source-chain version (document id) the content was
            copied or derived from at the moment this edge was
            asserted. Semantically meaningful on `sync_target` (Tier 1,
            populated automatically at re-ingestion when the Tier-1
            inference subsystem ships) and `derived_from` (Tier 3,
            agent-supplied via create_edge). Distinct from
            `source_valid_from_version`, which records chain-scoped
            edge visibility per CAS-ADR-017 — the two must not be
            conflated. Unset = explicit null; never inferred from chain
            anchors.
        synced_from_content_hash:
          type: string
          nullable: true
          pattern: "^(sha256:)?[0-9a-fA-F]{64}$"
          description: >-
            The source document's `source_content_hash` captured at
            the moment this edge was asserted. Optional companion to
            `synced_from_version`; recommended on derivations because
            version labels are reused and can drift from content
            (in-place edits). Accepted as `sha256:<hex>` or bare
            hex, digest in either case; normalized to
            `sha256:` + 64 lowercase hex on the way in, and always
            returned in that form;
            unset = explicit null.
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, run all validators (including
            the natural-key pre-check) and compute the would-be
            projection of the edge, but do NOT persist. The response
            carries the would-be `edge` with the nil-UUID sentinel id
            `00000000-0000-0000-0000-000000000000` (or the existing
            edge id on a natural-key collision, with `created=false`)
            and `dry_run=true`. Note: link is an edge mutation, not a
            document field mutation, so the change surface is the
            existing `edge` field rather than a separate `changes`
            block. The process-wide `_link_lock` is still
            acquired so the preview is consistent with concurrent link
            writes.

    TraverseRequest:
      type: object
      required: [start_id]
      description: >-
        Request body for the graph traversal endpoint. Walks the document
        graph from a starting document along the specified edge type(s)
        with chain-scoped resolution per CAS-ADR-017.
      properties:
        start_id:
          type: string
          description: Document ID to start traversal from.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
          description: >-
            Edge type to follow. If omitted, all edge types are traversed.
        direction:
          $ref: "#/components/schemas/TraversalDirection"
          default: outbound
          description: Traversal direction relative to the starting document.
        depth:
          type: integer
          minimum: 1
          maximum: 1000
          default: 3
          description: Maximum traversal depth.
        debug:
          type: boolean
          default: false
          description: >-
            When true, the response populates `resolution_path` with a
            per-event trace of chain-scoped resolution decisions
            (anchor hits and misses, retractions applied, tombstones
            applied). Opt-in; response is unchanged when false
            (CAS-ADR-017).

    ChainRequest:
      type: object
      required: [document_id, edge_type]
      description: >-
        Request body for the chain walk endpoint. Walks an edge chain in
        both directions from the named document, returning an ordered
        list of chain entries.
      properties:
        document_id:
          type: string
          description: >-
            Document ID to start the chain walk from. The walk proceeds
            in both directions from this document.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
          description: >-
            Edge type to follow. Required (no default). The chain walk
            follows only this edge type in both directions.
        limit:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Maximum number of chain entries to return after offset is
            applied. Null (default) returns the entire chain. Pagination
            is caller-side slicing performed on the full chain returned
            by the graph walk; the walk itself is unbounded.
        offset:
          type: integer
          default: 0
          minimum: 0
          description: >-
            Number of chain entries to skip from the start of the
            ordered chain before applying `limit`. Used together with
            `limit` to page through long chains.

    RegisterUserRequest:
      type: object
      required: [display_name, user_type]
      description: Request body for the user-registration endpoint.
      properties:
        display_name:
          type: string
          description: Human-readable name for the user or agent.
        user_type:
          $ref: "#/components/schemas/UserType"

    SetEditorsRequest:
      type: object
      required: [user_ids]
      description: Request body for the set-editors endpoint that replaces the editor allowlist on a document.
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: >-
            User IDs to set as editors. An empty array restores
            default-open access.

    ExportProjectionRequest:
      type: object
      required: [output_path]
      description: Request body for the export-projection endpoint that writes the document projection to a Markdown file.
      properties:
        output_path:
          type: string
          description: >-
            File path to write the projection Markdown file. Resolved
            relative to the vault's storage_root.

    # -------------------------------------------------------------------------
    # Response Schemas
    # -------------------------------------------------------------------------

    DiscoverResponse:
      type: object
      required: [mode, results]
      description: Response body for the discover endpoint; carries the retrieval mode used and the ordered list of hits. Row type in `results` is discriminated by `target`.
      properties:
        mode:
          $ref: "#/components/schemas/RetrievalMode"
        target:
          $ref: "#/components/schemas/RetrievalTarget"
          default: documents
          description: >-
            The result row type. "documents" (default) yields DiscoverHit
            rows; "edges" yields EdgeHit rows; "facets" yields FacetHit
            rows. Consumers switch on this field to know how to read
            `results`.
        results:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/DiscoverHit"
              - $ref: "#/components/schemas/EdgeHit"
              - $ref: "#/components/schemas/FacetHit"
          description: >-
            Retrieval hits, ordered by descending relevance
            (semantic/keyword) or by sort_by (catalog) for documents;
            ordered by edge created_at DESC for edges; one FacetHit row
            per requested facet field for facets. Row type is
            discriminated by `target`.
        total_available:
          type: integer
          description: >-
            Total number of results available (before pagination).
            May be approximate for semantic mode. For target="facets",
            the count of documents matching the filters (the facet
            denominator).
        hints:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Optional retrieval hints surfaced to the caller. Null when
            no hints apply. Empty-result hints (semantic and keyword
            modes): `total_before_filtering`, plus `active_filters` and
            `scope` when applicable. Catalog budget hint (fires when
            the serialized response exceeds the MCP inline
            ceiling): `reason="response_exceeds_inline_budget"`,
            `response_size_bytes`, `budget_bytes`, `recommended_limit`
            (re-page at this limit to fit inline). Vocabulary warnings
            (all modes): `warnings`, a list of advisories naming any
            filter value outside this vault's configured doc_type or
            lifecycle_status vocabulary. Absent when every filter value
            is recognized.
        read_meta:
          $ref: "#/components/schemas/ReadMeta"

    DiscoverHit:
      type: object
      description: >-
        A single retrieval result. Fields populated depend on the
        retrieval mode.
      required: [document]
      properties:
        document:
          description: >-
            Compact summary of the matching document. Returns
            DocumentSummaryLight (stripped) when the request set
            `target="documents", mode="catalog",
            response_mode="light"`; DocumentSummary (full)
            otherwise.
          oneOf:
            - $ref: "#/components/schemas/DocumentSummary"
            - $ref: "#/components/schemas/DocumentSummaryLight"
        chunk_content:
          type: string
          description: >-
            Retrieved text content. For semantic mode, the matching
            chunk. For deterministic mode, the extracted content at
            the specified heading path.
        heading_path:
          type: string
          nullable: true
          description: >-
            Heading hierarchy path of the retrieved chunk
            (e.g., "Section 3 > Definitions > Normalization").
        relevance_score:
          type: number
          nullable: true
          description: >-
            Relevance score (semantic mode only). Higher is more
            relevant. Scale depends on the retrieval implementation.
        matched_chunk_count:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Number of chunks from this document that matched the query.
            Present in semantic and keyword modes. A document with many
            matching chunks is a stronger hit than one with a single match
            at a similar peak score. Useful as a reranking signal.

    EdgeHit:
      type: object
      description: >-
        A single edge enumeration result. Returned by
        search when target="edges". Field population depends on
        response_mode: "light" returns only identity columns (edge_id,
        source_id, target_id, edge_type); "full" returns the complete
        envelope including anchor versions, rationale, and retraction
        state. Retraction fields disambiguate two perspectives:
        `retracted_edge_id` is the native column on retracts-type rows
        (the id of the edge being disclaimed); `retracted_at` and
        `retracted_by_edge_id` are computed via LEFT JOIN and populate
        on non-retracts rows that have been disclaimed by a later
        retracts edge.
      required: [edge_id, source_id, edge_type]
      properties:
        edge_id:
          type: string
          description: UUID of this edge row.
        source_id:
          type: string
          description: Source document id.
        target_id:
          type: string
          nullable: true
          description: >-
            Target document id. Null for retracts-type edges
            (CAS-ADR-017).
        edge_type:
          $ref: "#/components/schemas/EdgeType"
          description: Edge type (e.g., "references", "retracts").
        source_valid_from_version:
          type: string
          nullable: true
          description: >-
            Source-chain anchor version (CAS-ADR-017). Omitted in light
            mode.
        target_valid_from_version:
          type: string
          nullable: true
          description: >-
            Target-chain anchor version (CAS-ADR-017). Omitted in light
            mode.
        rationale:
          type: string
          nullable: true
          description: >-
            Human or machine rationale for this edge. Omitted in light
            mode.
        rationale_kind:
          type: string
          nullable: true
          description: >-
            Typed provenance discriminator (manual,
            version_chain, references_mention, filename_code_match).
            Omitted in light mode.
        retracted_edge_id:
          type: string
          nullable: true
          description: >-
            Native column. Populated only on retracts-type rows; carries
            the id of the edge being disclaimed by this retracts edge.
            Omitted in light mode.
        retracted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Computed. When this edge (a non-retracts row) has been
            disclaimed by a later retracts edge, carries the timestamp
            of the earliest disclaiming edge. Null when this edge is
            still live. Omitted in light mode.
        retracted_by_edge_id:
          type: string
          nullable: true
          description: >-
            Computed. The edge_id of the earliest retracts edge that
            disclaims this row. Null when this edge is still live.
            Omitted in light mode.

    FacetHit:
      type: object
      required: [field, values, total_distinct]
      description: >-
        A single facet aggregation result. Returned by search when
        target="facets": one row per requested facet field, carrying
        the field's top distinct values with matching-document counts
        plus the true distinct-value total. The row count is fixed by
        the facet field set and each value map is capped, so the
        response stays bounded regardless of how many documents the
        vault holds or how densely they are tagged.
      properties:
        field:
          type: string
          description: >-
            The faceted document metadata field. One of the fixed facet
            field set: doc_type, lifecycle_status, source_type,
            pipeline_status, tags.
        values:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Distinct non-null values of the field mapped to the count
            of matching documents, ordered by descending count and then
            by value, capped to the top facet_value_limit entries (50
            when unset). Fewer entries than total_distinct means the
            enumeration was truncated. Documents where the field is
            null are excluded from the value counts but still counted
            in the response's total_available; tag counts may sum above
            it (multi-tag documents) or below it (untagged documents).
            Empty when no matching document carries the field.
        total_distinct:
          type: integer
          description: >-
            True count of the field's distinct non-null values within
            the filter slice, computed before the value cap is applied.
            Truncation occurred exactly when this exceeds the entry
            count of values. Counts distinct values, unlike the
            response's total_available, which counts matching
            documents.

    FieldChange:
      type: object
      additionalProperties: false
      required: [path]
      description: >-
        A single field-level delta inside a dry-run response.
        Used by `UpdateMetadataResponse`, `SetLifecycleResponse`,
        `BulkLifecycleItemResult`, and `BulkMetadataItemResult` to
        enumerate the would-be deltas a dry-run would persist on a
        real run. `path` uses dotted notation for nested keys
        (`title`, `lifecycle_status`, `tier3_metadata.severity`,
        `tags`). Collection fields like `tags` carry the full ordered
        before/after lists. `before` is `null` when the path was
        absent before the patch; `after` is `null` when the path is
        removed by the patch. Populated only on dry-run responses.
      properties:
        path:
          type: string
          description: >-
            Dotted path to the changed field (e.g., `title`,
            `lifecycle_status`, `tier3_metadata.severity`, `tags`).
        before:
          description: >-
            Pre-patch value at `path`, or null if the path was absent
            before the patch. Type matches the underlying field
            (string, list, object, etc.).
        after:
          description: >-
            Would-be post-patch value at `path`, or null if the path is
            removed by the patch. Type matches the underlying field.

    SetLifecycleResponse:
      type: object
      description: >-
        Returned after a successful lifecycle transition. Includes the
        updated document record and optional warnings (e.g., when the
        ingestion pipeline is still in progress).
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        warnings:
          type: array
          items:
            type: string
          description: >-
            Advisory messages about non-blocking concerns. Present when
            the document's pipeline_status is non-terminal at the time
            of the lifecycle transition. Absent or empty when there are
            no warnings.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`; in that
            case no state was written and `document` carries the
            would-be projection of the post-transition state without
            the persisted `updated_at` advance.
        changes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldChange"
          description: >-
            Field-level deltas the transition would persist on a
            real run. Populated only when `dry_run=true`; null on
            real-run responses. For lifecycle transitions, contains a
            single entry for `lifecycle_status` when the action changes
            state. The would-be `supersedes` edge surfaces in
            `created_edge` and is NOT duplicated in `changes` (edge
            mutations are a separate concept from field-level deltas).
        created_edge:
          $ref: "#/components/schemas/Edge"
          nullable: true
          description: >-
            Populated only when `action=supersede`. On a real
            run, this is the `supersedes` edge that was created
            atomically with the lifecycle flip. On a dry-run, this is
            the would-be edge with the nil-UUID sentinel `id`
            `00000000-0000-0000-0000-000000000000`; the real `id` is
            non-deterministic and assigned at commit time.

    BulkLifecycleItem:
      type: object
      required: [action]
      description: >-
        One lifecycle transition request inside a bulk batch. Mirrors
        `SetLifecycleRequest` plus the `document_id` carried in the
        request body (since the bulk endpoint does not address documents
        via the URL path).
      properties:
        document_id:
          type: string
          description: >-
            Target document id for this item. Accepts `doc_id` as a
            back-compatible alias; supply exactly one of `document_id` or
            `doc_id` per item.
        doc_id:
          type: string
          description: >-
            Back-compatible alias for the per-item `document_id`; supply
            exactly one of `document_id` or `doc_id` per item.
        action:
          type: string
          description: >-
            Lifecycle transition action. Vault-config-defined; same
            shape as `SetLifecycleRequest.action`.
        successor_id:
          type: string
          description: >-
            Document id of the replacement version. Required when
            `action="supersede"`; forbidden for all other actions. Same
            shape and semantics as `SetLifecycleRequest.successor_id`.

    BulkLifecycleRequest:
      type: object
      required: [items]
      description: >-
        Request body for `POST /sage_vaults/{vault_id}/lifecycles`.
        Carries an ordered list of per-item lifecycle requests. The
        list may be empty; the response then has an empty `results`
        array.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BulkLifecycleItem"
          description: >-
            Items processed in order. Each item runs in its own
            per-document lock and its own database transaction; the batch
            as a whole is NOT atomic (CAS-ADR-029). A bad item does not
            roll back earlier-or-later successful items.
        response_mode:
          $ref: "#/components/schemas/ResponseMode"
          nullable: true
          description: >-
            Per-item payload depth. "full" returns each
            success item's complete `document` body (including the
            potentially-large `semantic_abstract`); "light" strips the
            per-item `document` field entirely, returning only identity
            + status + warnings + error so the response stays inside
            the MCP inline-output budget. Failure entries carry the
            full structured error envelope regardless of mode. When
            unset, batches with more than 5 items default to "light",
            smaller batches default to "full".
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, every item runs in dry-run
            mode — validators execute, the would-be projection of the
            post-state is computed, and each per-item result carries a
            `changes` block with a single `lifecycle_status`
            entry on state-changing transitions (preserved under
            `response_mode=light`). No persistence occurs. Per-item
            override is not supported. **Limitation:** each item's
            dry-run is evaluated against the committed state at batch
            start; no item's would-be effects are visible to
            subsequent items. For full preview accuracy under
            sequential dependencies (e.g., item N supersedes a
            document and item N+1 tries to mutate it), dry-run each
            item separately.

    BulkLifecycleItemResult:
      type: object
      required: [status]
      description: Outcome record for a single item inside a bulk lifecycle response.
      properties:
        document_id:
          type: string
          nullable: true
          description: >-
            The target document id from the corresponding request item.
            Null only when the item supplied neither `document_id` nor
            `doc_id` (a `missing_document_identifier` error).
        status:
          type: string
          enum: [success, error]
          description: >-
            `success` if the per-item transition committed; `error` if
            the item raised a SAGEError and the batch continued with
            the next item.
        document:
          $ref: "#/components/schemas/Document"
          description: >-
            The updated document record when `status=success`. Absent
            on error entries. Also absent on success entries when the
            request's `response_mode=light`.
        warnings:
          type: array
          items:
            type: string
          description: >-
            Same advisory shape as `SetLifecycleResponse.warnings`;
            present on success entries when the underlying transition
            emits warnings.
        error:
          type: object
          description: >-
            Error envelope when `status=error`. Shape matches the MCP
            `error_response` envelope: `{error: <code>, message: <text>,
            detail: <dict>}` where `detail` is present iff the
            underlying SAGEError carries one.
        changes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldChange"
          description: >-
            Field-level deltas the per-item transition would
            persist on a real run. Populated only when the envelope's
            `dry_run=true` and the per-item transition succeeds; null
            on real-run responses, error entries, and no-op
            transitions. Preserved under `response_mode=light` (it's
            small and is the most useful summary for dry-run callers).
        created_edge:
          $ref: "#/components/schemas/Edge"
          nullable: true
          description: >-
            The atomic supersedes edge produced by the per-item
            transition, populated only for `action=supersede` items.
            Carries the real edge id on a successful real run and the
            nil-UUID sentinel id on a successful dry-run. Null on error
            entries and on every non-supersede action. Preserved under
            `response_mode=light` (small; the only signal supersede
            callers have for the edge's wire shape).

    BulkLifecycleResponse:
      type: object
      required: [results, success_count, error_count, total]
      description: >-
        Response body for the bulk lifecycle endpoint. Carries per-item
        outcomes plus aggregate counts. Aggregate counts are redundant
        with iterating `results` and exist for caller ergonomics.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkLifecycleItemResult"
          description: Per-item outcomes in request order.
        success_count:
          type: integer
          minimum: 0
          description: Number of items with `status=success`.
        error_count:
          type: integer
          minimum: 0
          description: Number of items with `status=error`.
        total:
          type: integer
          minimum: 0
          description: Total items processed; equals `len(results)`.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`. Every
            per-item result reflects the dry-run path: success items
            carry the would-be projection of the post-transition
            document (subject to `response_mode`) and a `changes` block
            enumerating field-level deltas, and no state was
            written.

    BulkLinkItem:
      type: object
      required: [source_id, edge_type]
      description: >-
        One edge-creation request inside a bulk batch. Mirrors
        `LinkRequest` field-for-field except for the envelope-level
        `dry_run` (which lives on `BulkLinkRequest` and is propagated to
        each item; per-item override is not supported per CAS-ADR-029).
      properties:
        source_id:
          type: string
          description: Origin document ID.
        target_id:
          type: string
          nullable: true
          description: >-
            Target document ID. Must be null on `retracts` edges;
            required for every other edge type.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
        source_valid_from_version:
          type: string
          nullable: true
          description: >-
            Source-chain anchor (same semantics as
            `LinkRequest.source_valid_from_version`).
        target_valid_from_version:
          type: string
          nullable: true
          description: >-
            Target-chain anchor (same semantics as
            `LinkRequest.target_valid_from_version`).
        retracted_edge_id:
          type: string
          nullable: true
          description: >-
            Required for `retracts` edges; null for every other edge
            type.
        notes:
          type: string
          nullable: true
          description: Optional annotation.
        rationale:
          type: string
          nullable: true
          description: Decision rationale for creating this relationship.
        rationale_kind:
          $ref: "#/components/schemas/RationaleKind"
          nullable: true
          description: >-
            Optional explicit discriminator (CAS-ADR-019). Same
            semantics as `LinkRequest.rationale_kind`.
        synced_from_version:
          type: string
          nullable: true
          description: >-
            Provenance field. Same semantics as
            `LinkRequest.synced_from_version`.
        synced_from_content_hash:
          type: string
          nullable: true
          pattern: "^(sha256:)?[0-9a-fA-F]{64}$"
          description: >-
            Provenance field. Same semantics as
            `LinkRequest.synced_from_content_hash`.

    BulkLinkRequest:
      type: object
      required: [items]
      description: >-
        Request body for `POST /sage_vaults/{vault_id}/edges`.
        Carries an ordered list of per-item link requests. The list
        may be empty; the response then has an empty `results` array.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BulkLinkItem"
          description: >-
            Items processed in order. Each item runs under the
            process-wide `_link_lock` and a per-item database transaction;
            the batch as a whole is NOT atomic (CAS-ADR-029). A bad
            item does not roll back earlier-or-later successful items.
        response_mode:
          $ref: "#/components/schemas/ResponseMode"
          nullable: true
          description: >-
            Per-item payload depth. "full" returns
            each success item's complete `edge` body (the persisted
            edge, or the would-be edge under dry-run); "light" strips
            the per-item `edge` field entirely, returning only identity
            + status + created + existing_rationale + error so the
            response stays inside the MCP inline-output budget. Failure
            entries carry the full structured error envelope regardless
            of mode. When unset, batches with more than 5 items default
            to "light", smaller batches default to "full".
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, every item runs in dry-run
            mode — validators execute (including the natural-key
            pre-check), the would-be projection of the edge is
            computed, and each per-item result carries the would-be
            `edge` with the nil-UUID sentinel id (or the existing edge
            id on a natural-key hit, with `created=false`). No
            persistence occurs. Note: link is an edge mutation, not a
            document field mutation, so the change surface is the
            per-item `edge` field (subject to `response_mode`) rather
            than a separate `changes` block. Envelope-level
            only; per-item override is not supported. **Limitation:**
            each item's dry-run is evaluated against the committed
            state at batch start; no item's would-be effects are
            visible to subsequent items. For full preview accuracy
            under sequential dependencies (e.g., item N creates an
            edge and item N+1 references it via retracted_edge_id),
            dry-run each item separately.

    BulkLinkItemResult:
      type: object
      required: [source_id, edge_type, status]
      description: Outcome record for a single item inside a bulk-link response.
      properties:
        source_id:
          type: string
          description: Echoed from the request item for caller correlation.
        target_id:
          type: string
          nullable: true
          description: >-
            Echoed from the request item for caller correlation. Null
            on `retracts` items (where the request also carries null).
        edge_type:
          $ref: "#/components/schemas/EdgeType"
        status:
          type: string
          enum: [success, error]
          description: >-
            `success` if the per-item link committed (real-run) or
            would have committed (dry-run); `error` if the item raised
            a SAGEError and the batch continued with the next item.
        edge:
          $ref: "#/components/schemas/Edge"
          description: >-
            The edge record when `status=success`. Absent on error
            entries. Also absent on success entries when the request's
            `response_mode=light`. On a real run this is the
            persisted edge (with `created=true`) or the existing edge
            that satisfied the natural-key idempotency check (with
            `created=false`). On a dry-run this is the would-be edge
            with the nil-UUID sentinel id (or the existing edge id on
            a natural-key hit).
        created:
          type: boolean
          nullable: true
          description: >-
            Idempotency flag. True iff a new edge was (or would
            be) created for this item; false on the natural-key
            idempotency path where an edge already exists for
            `(source, target, edge_type)`. Null on error entries.
        existing_rationale:
          type: string
          nullable: true
          description: >-
            When `created=false`, the rationale stored on the existing
            edge that satisfied the idempotency check. Null on
            create-path successes and on error entries. Preserved
            under `response_mode=light` so callers can distinguish the
            no-op outcome from a fresh insert without the full `edge`
            body.
        error:
          type: object
          description: >-
            Error envelope when `status=error`. Shape matches the MCP
            `error_response` envelope: `{error: <code>, message: <text>,
            detail: <dict>}` where `detail` is present iff the
            underlying SAGEError carries one.

    BulkLinkResponse:
      type: object
      required: [results, success_count, error_count, total]
      description: >-
        Response body for the bulk-link endpoint. Carries
        per-item outcomes plus aggregate counts. Aggregate counts are
        redundant with iterating `results` and exist for caller
        ergonomics.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkLinkItemResult"
          description: Per-item outcomes in request order.
        success_count:
          type: integer
          minimum: 0
          description: Number of items with `status=success`.
        error_count:
          type: integer
          minimum: 0
          description: Number of items with `status=error`.
        total:
          type: integer
          minimum: 0
          description: Total items processed; equals `len(results)`.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`. Every
            per-item result reflects the dry-run path: success items
            carry the would-be edge (subject to `response_mode`) with
            the nil-UUID sentinel id on the create path or the
            existing edge id on a natural-key hit, and no state was
            written.

    BulkMetadataItem:
      type: object
      additionalProperties: false
      required: []
      description: >-
        One metadata patch request inside a bulk batch. Mirrors
        `UpdateMetadataRequest` plus the `document_id` carried in the
        request body (since the bulk endpoint does not address documents
        via the URL path).
      properties:
        document_id:
          type: string
          description: >-
            Target document id for this item. Accepts `doc_id` as a
            back-compatible alias; supply exactly one of `document_id` or
            `doc_id` per item.
        doc_id:
          type: string
          description: >-
            Back-compatible alias for the per-item `document_id`; supply
            exactly one of `document_id` or `doc_id` per item.
        title:
          type: string
          description: New human-readable title; omit to leave unchanged.
        version_label:
          type: string
          description: New caller-supplied version label; omit to leave unchanged.
        project:
          type: string
          description: New project scope for the document; omit to leave unchanged.
        tags:
          $ref: "#/components/schemas/ListFieldPatch"
        doc_type:
          type: string
          description: Must be a valid value in the vault's document_types configuration.
        authority_scope:
          type: string
          nullable: true
          description: New authority scope; omit to leave unchanged.
        document_date:
          type: string
          format: date
          description: Document calendar date (YYYY-MM-DD).
        tier3_metadata:
          $ref: "#/components/schemas/Tier3Patch"
        expected_version:
          type: string
          nullable: true
          description: >-
            Optimistic-concurrency token (CAS-ADR-038 Primitive B). Same
            semantics as `UpdateMetadataRequest.expected_version`: when
            supplied, verified against the per-item document's current
            version inside its per-document lock; mismatch surfaces a
            structured `stale_read` per-item error envelope without
            aborting the batch (CAS-ADR-029 partial-success semantics).
            When omitted, the per-item write is last-writer-wins.

    BulkMetadataRequest:
      type: object
      required: [items]
      description: >-
        Request body for `POST /sage_vaults/{vault_id}/metadata`.
        Carries an ordered list of per-item metadata-patch requests. The
        list may be empty; the response then has an empty `results`
        array.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BulkMetadataItem"
          description: >-
            Items processed in order. Each item runs in its own
            per-document lock and its own database transaction; the batch
            as a whole is NOT atomic (CAS-ADR-029). A bad item does not
            roll back earlier-or-later successful items.
        response_mode:
          $ref: "#/components/schemas/ResponseMode"
          nullable: true
          description: >-
            Per-item payload depth. "full" returns each
            success item's complete `document` body (including the
            potentially-large `semantic_abstract`); "light" strips the
            per-item `document` field entirely, returning only identity
            + status + warnings + error so the response stays inside
            the MCP inline-output budget. Failure entries carry the
            full structured error envelope regardless of mode. When
            unset, batches with more than 5 items default to "light",
            smaller batches default to "full".
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, every item runs in dry-run
            mode — validators execute, the would-be projection of the
            post-state is computed, and each per-item result carries a
            `changes` block enumerating field-level deltas
            (preserved under `response_mode=light`). No persistence
            occurs. Per-item override is not supported.
            **Limitation:** each item's dry-run is evaluated against
            the committed state at batch start; no item's would-be
            effects are visible to subsequent items. For full preview
            accuracy under sequential dependencies (e.g., item N adds
            tag X and item N+1 tries to add the same tag), dry-run
            each item separately.

    BulkMetadataItemResult:
      type: object
      required: [status]
      description: Outcome record for a single item inside a bulk metadata response.
      properties:
        document_id:
          type: string
          nullable: true
          description: >-
            The target document id from the corresponding request item.
            Null only when the item supplied neither `document_id` nor
            `doc_id` (a `missing_document_identifier` error).
        status:
          type: string
          enum: [success, error]
          description: >-
            `success` if the per-item patch committed; `error` if the
            item raised a SAGEError and the batch continued with the
            next item.
        document:
          $ref: "#/components/schemas/Document"
          description: >-
            The updated document record when `status=success`. Absent
            on error entries. Also absent on success entries when the
            request's `response_mode=light`.
        warnings:
          type: array
          items:
            type: string
          description: >-
            Advisory messages; reserved for parity with
            `BulkLifecycleItemResult`. Not currently emitted by
            `update_metadata`.
        error:
          type: object
          description: >-
            Error envelope when `status=error`. Shape matches the MCP
            `error_response` envelope: `{error: <code>, message: <text>,
            detail: <dict>}` where `detail` is present iff the
            underlying SAGEError carries one.
        changes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldChange"
          description: >-
            Field-level deltas the per-item patch would persist
            on a real run. Populated only when the envelope's
            `dry_run=true` and the per-item patch succeeds; null on
            real-run responses, error entries, and patches that touch
            no caller-supplied fields. Tier3 changes enumerate per-key
            with dotted paths (e.g., `tier3_metadata.severity`); tags
            carry the full ordered before/after lists. Preserved under
            `response_mode=light`.

    BulkMetadataResponse:
      type: object
      required: [results, success_count, error_count, total]
      description: >-
        Response body for the bulk metadata endpoint. Carries per-item
        outcomes plus aggregate counts. Aggregate counts are redundant
        with iterating `results` and exist for caller ergonomics.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkMetadataItemResult"
          description: Per-item outcomes in request order.
        success_count:
          type: integer
          minimum: 0
          description: Number of items with `status=success`.
        error_count:
          type: integer
          minimum: 0
          description: Number of items with `status=error`.
        total:
          type: integer
          minimum: 0
          description: Total items processed; equals `len(results)`.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`. Every
            per-item result reflects the dry-run path: success items
            carry the would-be projection of the post-patch document
            (subject to `response_mode`) and a `changes` block
            enumerating field-level deltas, and no state was written.

    UpdateMetadataResponse:
      type: object
      required: [document]
      description: >-
        Wrapper for single-item `update_metadata`. Promotes the
        bare-Document return so the dry-run flag has a home. The
        `document` field is the post-patch state — persisted on a real
        run, computed in memory on a dry-run (the "would-be projection").
      properties:
        document:
          $ref: "#/components/schemas/Document"
          description: >-
            The updated document record. On a real run, this is what
            was persisted (with `updated_at` advanced and
            `metadata_confirmed=true`). On a dry-run, this is the
            would-be projection of the post-patch state without those
            side effects.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`; in that
            case no state was written and `document` carries the
            would-be projection of the post-patch state.
        changes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldChange"
          description: >-
            Field-level deltas the patch would persist on a
            real run. Populated only when `dry_run=true`; null on
            real-run responses and on dry-runs that touch no
            caller-supplied fields. Scalar field changes use the bare
            field name as `path`; tier3 changes enumerate per-key with
            dotted paths (e.g., `tier3_metadata.severity`); tags carry
            the full ordered before/after lists in `before`/`after`.
            Entries are sorted by `path` for determinism.

    LinkResponse:
      type: object
      required: [edge, created]
      description: >-
        Wrapper for `create_edge` return. Promotes the
        previously-hand-constructed `{edge, created, ...}` dict to a
        real schema so the dry-run flag has a home.
      properties:
        edge:
          $ref: "#/components/schemas/Edge"
          description: >-
            The edge record. On a real run, this is the persisted edge
            (with `created=true`) or the existing edge that was matched
            by the natural-key idempotency check (with
            `created=false`). On a dry-run, this is the would-be edge
            with the nil-UUID sentinel id
            `00000000-0000-0000-0000-000000000000` (or the existing
            edge id on a natural-key hit).
        created:
          type: boolean
          description: >-
            True iff a new edge would be (or was) created. False on
            the natural-key idempotency path where an edge already
            exists for `(source, target, edge_type)`.
        existing_rationale:
          type: string
          nullable: true
          description: >-
            When `created=false`, the rationale stored on the existing
            edge that satisfied the idempotency check. Null otherwise.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`; in that
            case no state was written and `edge` carries the would-be
            projection of the edge that would be persisted (nil-UUID
            sentinel id, or the existing edge id on a natural-key hit).
            Note: link is an edge mutation, not a document field
            mutation, so the change surface is the existing `edge`
            field rather than a separate `changes` block.

    IngestResponse:
      type: object
      description: >-
        Returned by `POST /sage_vaults/{vault_id}/documents` after the
        three-stage pipeline completes. The REST endpoint is
        synchronous: `pipeline_status` is at a terminal value
        (`abstraction_complete`, `abstraction_skipped`, or `failed`)
        by the time this response is returned. The MCP `ingest_document`
        wrapper inverts this and returns early with a non-terminal
        status; that behavior is MCP-specific and does not affect the
        REST surface.
      required: [document, pipeline_status]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        pipeline_status:
          $ref: "#/components/schemas/PipelineStatus"

    ReadMeta:
      type: object
      description: >-
        Self-describing markers for a SAGE read response (CAS-ADR-039).
        Nested as `read_meta` on every read-path response model so a
        caller can tell a delivered success apart from a transport-truncated
        fragment, and a thin/empty body apart from a populated one. The same
        carrier rides the error envelope with `success=false`.
      required: [success, body_present]
      properties:
        success:
          type: boolean
          description: >-
            True on a delivered success response; the complete sub-object's
            presence distinguishes a real response from a transport-truncated
            fragment.
        body_present:
          type: boolean
          description: Whether a content body is present.
        body_length:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Body length when present; null for write-to-path delivery or
            no-body responses.
        projection_status:
          type: string
          enum: [current, stale]
          nullable: true
          description: >-
            Freshness of the projection on a projection read: 'current' when
            the stored projection is up to date with the source, 'stale' when
            the source was modified after the projection last ran (an
            administrative deficit, not a thin document). Null where the
            response is not a projection read.
        projection_recovery:
          type: string
          nullable: true
          description: >-
            Name of the tool that recomputes a stale projection
            (recompute_abstract). Populated only when projection_status is
            'stale'; null otherwise. Gives a caller an actionable recovery
            pointer without a second probing round-trip.

    DocumentWithContent:
      description: >-
        Document record optionally accompanied by file-delivery
        information. Returned by GET /documents/{document_id}. Fields
        beyond the base Document are populated based on the request
        mode: `include_content=true` fills `content` and `content_size`
        (base64 bytes inline); `write_to_path=<path>` fills `written_to`,
        `content_size`, and `content_hash` (bytes delivered to disk).
        A default request omits all extra fields.
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          properties:
            content:
              type: string
              nullable: true
              description: >-
                Base64-encoded bytes of the vault-local source file at
                `storage_root/source_path`. Present only when the request
                specified `include_content=true`. Decodes to the exact
                bytes of the authoritative file.
            content_size:
              type: integer
              nullable: true
              minimum: 0
              description: >-
                Byte count of the vault-local source file. Populated
                when the request specified `include_content=true` or
                `write_to_path`.
            content_hash:
              type: string
              nullable: true
              description: >-
                Hex digest of the vault-local source file bytes
                (same algorithm as Document.source_content_hash).
                Populated only when the request specified
                `write_to_path`, for caller-side verification that the
                on-disk bytes match the vault record.
            written_to:
              type: string
              nullable: true
              description: >-
                Absolute path where SAGE wrote the source file bytes.
                Populated only when the request specified
                `write_to_path`. Equals the caller-supplied value.
            read_meta:
              $ref: "#/components/schemas/ReadMeta"
            body_form:
              type: string
              nullable: true
              enum: [text, binary]
              description: >-
                Form of the document's source body (CAS-ADR-039): `text` for
                a source whose bytes are scannable text, `binary` for a
                binary-container source (`.docx`, `.pptx`, `.pdf`, `.xlsx`) whose
                bytes
                are a zipped or streamed package. Stamped on every
                `get_document` response so a caller never has to infer the form
                from the bytes; `include_content=true` against a
                binary-container source is refused with
                `binary_content_refused` (400), directing the caller to
                `read_projection`. Null only on responses that carry no source
                form (e.g. an error envelope).

    TraverseResponse:
      type: object
      required: [start_id, nodes]
      description: Response body for the traverse endpoint; carries the discovered nodes with their incoming edges and edge-type counts.
      properties:
        start_id:
          type: string
          description: The document ID traversal started from.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TraversalNode"
          description: Traversal nodes ordered by depth, then by edge insertion order.
        resolution_path:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ResolutionPathEntry"
          description: >-
            Per-event trace of chain-scoped resolution decisions.
            Present only when the request set `debug: true`; otherwise
            null / omitted. Useful for diagnosing why an expected edge
            was suppressed or why an unexpected edge surfaced.

    ResolutionPathEntry:
      type: object
      required: [event_type, edge_id]
      description: >-
        One decision event from the chain-scoped edge resolver
        (CAS-ADR-017). Discriminated by `event_type`.
      properties:
        event_type:
          type: string
          enum:
            - anchor_hit
            - anchor_miss
            - retracts_applied
            - tombstone_applied
          description: >-
            anchor_hit: the edge's anchor was found in the queried
            version's supersedes lineage and the edge surfaced.
            anchor_miss: anchor lay outside the lineage; edge
            suppressed. retracts_applied: a `retracts` edge in the
            queried lineage caused this edge to be suppressed.
            tombstone_applied: a `merged_from` tombstone
            (valid_until_version set) caused this edge to be suppressed
            at the queried version.
        edge_id:
          type: string
          description: The edge id whose resolution produced this event.
        anchor_field:
          type: string
          nullable: true
          enum: [source_valid_from_version, target_valid_from_version]
          description: >-
            Which anchor was checked. Populated for anchor_hit and
            anchor_miss.
        anchor_version:
          type: string
          nullable: true
          description: >-
            The document ID stored in the anchor field at the time of
            the check. Populated for anchor_hit and anchor_miss.
        retracted_edge_id:
          type: string
          nullable: true
          description: >-
            On retracts_applied: the edge id of the `retracts` edge
            whose application produced this event.
        tombstone_version:
          type: string
          nullable: true
          description: >-
            On tombstone_applied: the valid_until_version that
            tombstoned the edge.

    TraversalNode:
      type: object
      description: >-
        A node encountered during graph traversal, with the edge that
        led to it and the depth at which it was found. When multiple
        edges connect to the same target, the target appears once with
        the most recent edge shown and edge_counts providing per-type
        totals.
      required: [document, edge, depth, edge_counts]
      properties:
        document:
          $ref: "#/components/schemas/DocumentSummary"
        edge:
          $ref: "#/components/schemas/Edge"
          description: >-
            The most recent edge leading to this document (by created_at).
        depth:
          type: integer
          description: Traversal depth (1 = direct neighbor of start node).
        edge_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: >-
            Edge count by type. Keys are edge type strings, values are
            the number of edges of that type connecting to this document
            from the traversal path. When the traversal is filtered by
            edge_type, only the filtered type(s) appear as keys.

    ChainResponse:
      type: object
      required: [chain, head_id, tail_id, query_position, length, total_length, is_linear]
      description: Response body for the chain walk endpoint; carries the ordered chain with head/tail anchors and a fork-detection flag.
      properties:
        chain:
          type: array
          items:
            $ref: "#/components/schemas/ChainEntry"
          description: >-
            Ordered list of documents in the chain, from tail (position 0)
            to head. Each entry's position is its index in the full chain,
            so a page taken with limit or offset keeps those absolute
            positions rather than renumbering from zero.
        head_id:
          type: string
          description: Document ID of the chain head (latest version / terminal node).
        tail_id:
          type: string
          description: Document ID of the chain tail (original / root node).
        query_position:
          type: integer
          minimum: 0
          description: >-
            Zero-based position of the queried document within the chain.
        length:
          type: integer
          minimum: 0
          description: >-
            Number of entries carried in this response, after limit and
            offset are applied. Read total_length for the size of the
            whole chain.
        total_length:
          type: integer
          minimum: 1
          description: Total number of documents in the full chain.
        is_linear:
          type: boolean
          description: >-
            True if the chain is strictly linear (no forks or merges).
            False indicates a data quality issue where multiple documents
            share a predecessor or successor of the specified edge type.
        available_edge_types:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Other edge types observed on the queried document, surfaced as
            a hint when the requested edge_type produced no chain.

    ChainEntry:
      type: object
      required: [id, title, lifecycle_status, position]
      description: One entry in a chain walk result; identifies a document and its ordinal position within the chain.
      properties:
        id:
          type: string
          description: Document ID.
        title:
          type: string
          description: Human-readable title of this chain entry's document.
        version_label:
          type: string
          nullable: true
          description: Caller-supplied version label for this entry, when set; null otherwise.
        lifecycle_status:
          type: string
          description: Lifecycle state of this entry's document at the time the chain was walked.
        document_date:
          type: string
          format: date
          nullable: true
          description: Authoritative content date (YYYY-MM-DD) if available.
        position:
          type: integer
          minimum: 0
          description: >-
            Zero-based ordinal position in the chain (0 = tail, length-1 = head).

    PreconditionResult:
      type: object
      required: [function_id, satisfied, checks]
      description: Response body for the precondition-check endpoint; carries an aggregate satisfaction flag and per-target check details.
      properties:
        function_id:
          type: string
          description: Identifier of the workflow function whose preconditions were checked.
        satisfied:
          type: boolean
          description: True if all dependencies are satisfied.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PreconditionCheck"
          description: Per-target check results making up this precondition evaluation.

    PreconditionCheck:
      type: object
      required: [target_id, required, actual, satisfied]
      description: One per-target check result inside a precondition evaluation.
      properties:
        target_id:
          type: string
          description: Document ID of the dependency target.
        required:
          type: string
          description: >-
            Required condition, derived from the vault's lifecycle
            configuration: the states whose satisfies_dependency setting
            resolves true (e.g., "active or completed" under the base
            lifecycle).
        actual:
          type: string
          description: Actual state found (e.g., "active", "not found").
        satisfied:
          type: boolean
          description: True when the actual state meets the required condition for this target.

    EditorList:
      type: object
      required: [document_id, editors]
      description: Response body for the get-editors endpoint; carries the document id and its current editor list.
      properties:
        document_id:
          type: string
          description: Id of the document whose editor list is being reported.
        editors:
          type: array
          items:
            $ref: "#/components/schemas/User"
          description: >-
            Current editors. Empty array means default-open access.

    EvalRetrievalResult:
      type: object
      required: [vault_id, passed, assertion_count, failure_count, failures]
      description: Response body for the retrieval-eval endpoint; aggregates assertion outcomes for the vault's retrieval-health suite.
      properties:
        vault_id:
          type: string
          description: Identifier of the vault whose assertions were evaluated.
        passed:
          type: boolean
          description: True if all assertions passed.
        assertion_count:
          type: integer
          description: Total number of assertions evaluated.
        failure_count:
          type: integer
          description: Number of assertions that did not pass.
        failures:
          type: array
          items:
            $ref: "#/components/schemas/AssertionFailure"
          description: Per-assertion failure details.

    AssertionFailure:
      type: object
      required: [query, expected_document_id, top_k_checked, found]
      description: One failing assertion from a retrieval-eval run.
      properties:
        query:
          type: string
          description: The assertion query that failed.
        expected_document_id:
          type: string
          description: Document ID expected in the top-k results.
        top_k_checked:
          type: integer
          description: How many top results were checked.
        found:
          type: boolean
          description: Whether the expected document appeared in top-k.
        actual_rank:
          type: integer
          nullable: true
          description: >-
            Rank at which the expected document appeared, if found
            outside the assertion's top-k threshold.

    # -------------------------------------------------------------------------
    # Vault Listing and Statistics
    # -------------------------------------------------------------------------

    VaultDocTypeEntry:
      type: object
      required: [value, label]
      description: One entry in a vault summary's doc_types list; pairs the doc_type identifier with its UI-display label.
      properties:
        value:
          type: string
          description: Doc type identifier (e.g. "design_spec").
        label:
          type: string
          description: Human-readable label for UI display.

    VaultLifecycleState:
      type: object
      required: [value, label, is_terminal]
      description: One entry in a vault summary's lifecycle_states list; pairs a state value with its UI label and terminal flag.
      properties:
        value:
          type: string
          description: Lifecycle state identifier (e.g. "active", "archived").
        label:
          type: string
          description: Human-readable label for UI display.
        is_terminal:
          type: boolean
          description: Terminal states cannot be transitioned out of.

    VaultAdapterInfo:
      type: object
      required: [source_type, extensions]
      description: One entry in a vault summary's adapters list; reports a source-adapter's handled file extensions.
      properties:
        source_type:
          $ref: "#/components/schemas/SourceType"
        extensions:
          type: array
          items:
            type: string
          description: File extensions handled by this adapter (e.g. [".md", ".markdown"]).

    VaultSummary:
      type: object
      required: [id, name, document_count]
      description: Compact vault description used in vault-listing responses; carries identity, a document count, configured doc types and lifecycle states, and adapter info.
      properties:
        id:
          type: string
          description: Unique vault identifier.
        name:
          type: string
          description: Human-readable vault name.
        description:
          type: string
          nullable: true
          description: Vault-config description text; null when no description was authored.
        document_count:
          type: integer
          description: >-
            Number of documents in the vault across every lifecycle state,
            including archived predecessors; the vault-stats read gives the
            per-state breakdown.
        doc_types:
          type: array
          items:
            $ref: "#/components/schemas/VaultDocTypeEntry"
          description: Doc-type vocabulary configured for this vault.
        lifecycle_states:
          type: array
          items:
            $ref: "#/components/schemas/VaultLifecycleState"
          description: Lifecycle states configured for this vault, in display order.
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/VaultAdapterInfo"
          description: Source adapters this SAGE process can project, with the file extensions each handles. Process-wide capability, identical for every vault (CAS-ADR-046).
        projects:
          type: array
          items:
            type: string
          description: >-
            Distinct project identifiers observed across the vault's
            documents. Derived from the project metadata field at
            response time.

    HealthIndicators:
      type: object
      required:
        - pending_metadata_count
        - pending_edge_count
        - failed_ingestion_count
        - interrupted_abstract_count
      description: Aggregate health signals for a vault, surfaced inside vault-stats responses.
      properties:
        pending_metadata_count:
          type: integer
          description: Documents whose extracted metadata is unconfirmed.
        pending_edge_count:
          type: integer
          description: Tier 2 staging edges awaiting review.
        deferred_abstract_count:
          type: integer
          nullable: true
          description: >-
            Documents with pipeline_status=abstraction_skipped. Null when
            abstraction is disabled in the vault config.
        failed_ingestion_count:
          type: integer
          description: Documents with pipeline_status=failed.
        interrupted_abstract_count:
          type: integer
          description: >-
            Documents with pipeline_status=abstraction_interrupted:
            abstraction work a stopped worker dropped rather than
            attempted. Counted apart from failed_ingestion_count because
            no stage failed and nothing is wrong with the document; the
            next server start re-runs it, and the bulk reabstract sweep
            reaches it before then.

    LastOptimizeSummary:
      type: object
      required:
        - at
        - bytes_reclaimed
        - versions_cleaned
        - fragments_merged
      description: Summary of a vault's most recent content-store optimize, surfaced inside vault-stats responses.
      properties:
        at:
          type: string
          format: date-time
          description: UTC timestamp of the most recent content-store optimize.
        bytes_reclaimed:
          type: integer
          description: Bytes reclaimed by the most recent optimize.
        versions_cleaned:
          type: integer
          description: Dataset versions pruned by the most recent optimize.
        fragments_merged:
          type: integer
          description: Fragments merged by the most recent optimize.

    VaultStatsResponse:
      type: object
      required:
        - total_documents
        - by_lifecycle_status
        - by_doc_type
        - by_source_type
        - total_edges
        - by_edge_type
        - staging_edge_count
        - graph_store_size_bytes
        - content_store_size_bytes
        - content_store_chunk_count
        - content_store_version_count
        - content_store_small_fragment_count
        - health
      description: Response body for the vault-stats endpoint; carries document, edge, and storage counts plus health indicators.
      properties:
        total_documents:
          type: integer
          description: Total number of documents in the vault.
        by_lifecycle_status:
          type: object
          additionalProperties:
            type: integer
          description: Document count per lifecycle status.
        by_doc_type:
          type: object
          additionalProperties:
            type: integer
          description: Document count per doc_type.
        by_source_type:
          type: object
          additionalProperties:
            type: integer
          description: Document count per source_type.
        total_edges:
          type: integer
          description: Total number of production edges in the vault graph.
        by_edge_type:
          type: object
          additionalProperties:
            type: integer
          description: Edge count per edge_type.
        staging_edge_count:
          type: integer
          description: Number of edges in the Tier 2 staging table awaiting review.
        graph_store_size_bytes:
          type: integer
          description: Live on-disk byte footprint of the graph store (CAS-ADR-042) -- the summed relation size of the documents/edges/staging_edges/users/document_tags tables.
        content_store_size_bytes:
          type: integer
          description: On-disk size of the content store in bytes.
        content_store_chunk_count:
          type: integer
          description: Total chunk row count across all documents.
        content_store_version_count:
          type: integer
          description: Count of retained content-store dataset versions for the chunks table; rises with un-optimized write churn.
        content_store_small_fragment_count:
          type: integer
          description: Count of small (un-compacted) content-store fragments for the chunks table; rises with un-optimized write churn and is merged away by optimize.
        last_ingestion_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent successful ingestion, if any.
        health:
          $ref: "#/components/schemas/HealthIndicators"
        last_optimize:
          $ref: "#/components/schemas/LastOptimizeSummary"

    # -------------------------------------------------------------------------
    # Vault Configuration
    # -------------------------------------------------------------------------

    CreateVaultRequest:
      type: object
      required: [config]
      description: >-
        Request body for the create-vault endpoint. The single `config`
        field carries the complete vault configuration; SAGE does not
        synthesize defaults at this boundary. Callers that want a vault
        with sensible defaults should construct the dict via
        ``sage.services.vault_registry.VaultRegistryService.get_default_config(vault_id, name, owner)``
        and pass the result through.
      properties:
        config:
          type: object
          description: >-
            Full vault configuration object. Structure defined by
            ``docs/fs/sage/vault_config.schema.json``; validation is
            performed against that schema before any filesystem writes.
          additionalProperties: true

    UpdateVaultConfigRequest:
      type: object
      description: >-
        Section-level config update. Each provided top-level section
        replaces the current section wholesale; omitted sections are
        preserved unchanged. Section structure follows
        docs/fs/sage/vault_config.schema.json.
      properties:
        vault:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the vault section of vault_config.yaml; structure per vault_config.schema.json. Omit to leave unchanged.
        document_types:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the document_types section; structure per document_types.schema.json. Omit to leave unchanged.
        lifecycle:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the lifecycle section; structure per lifecycle.schema.json. Omit to leave unchanged.
        metadata_extraction:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the metadata_extraction section; structure per metadata_extraction.schema.json. Omit to leave unchanged.
        adapter_defaults:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the adapter_defaults section; structure per vault_config.schema.json. Omit to leave unchanged.
        edge_inference:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the edge_inference section; structure per edge_inference.schema.json. Omit to leave unchanged.
        abstraction:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the abstraction section of vault_config.yaml. Omit to leave unchanged.
        access_control_defaults:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the access_control_defaults section of vault_config.yaml. Omit to leave unchanged.
        retrieval_health:
          type: object
          nullable: true
          additionalProperties: true
          description: Replacement for the retrieval_health section of vault_config.yaml. Omit to leave unchanged.
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, validate the merged config and
            compute the would-be projection of which sections would
            change plus destructive-change warnings, but do NOT write
            the yaml or reload the registry. The response carries
            `status='previewed'`, `dry_run=true`, `warnings` (always
            populated when present), and a `preview` listing which
            top-level sections would change. Note: vault-config updates
            are a config mutation, not a document field mutation, so
            the change surface is the existing `preview.changed_sections`
            field rather than a separate `changes` block.
            **On dry-run, `force` is a no-op**: dry-run never raises
            `destructive_config_change`; warnings are always returned
            in the response body so the caller can plan a follow-up
            real-run with `force=true` if appropriate.

    UpdateVaultConfigResponse:
      type: object
      required: [status, vault_id, warnings]
      description: Response body for the update-vault-config endpoint (real-run or dry-run preview); confirms the outcome and surfaces any destructive-change warnings.
      properties:
        status:
          type: string
          enum: [updated, previewed]
          description: >-
            `updated` on a successful real-run write. `previewed` on a
            dry-run preview; no yaml or registry state was
            modified.
        vault_id:
          type: string
          description: Id of the vault whose config was (or would be) updated.
        warnings:
          type: array
          items:
            type: string
          description: >-
            Destructive-change warnings. Populated when `force=true` was
            used on a real-run to override the 409 rejection, OR when
            `dry_run=true` returned a preview that would trip
            destructive-change detection (dry-run always
            surfaces warnings in the response body rather than raising).
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the request set `dry_run=true`; in that
            case no yaml or registry state was modified and `preview`
            carries the would-be projection of the config sections that
            would change. Note: vault-config updates are a config
            mutation, not a document field mutation, so the change
            surface is the existing `preview` field rather than a
            separate `changes` block.
        preview:
          $ref: "#/components/schemas/VaultConfigPreview"
          nullable: true
          description: >-
            Structural diff populated on dry-run; null on a
            real-run. This is the would-be projection of the config
            sections that would change.

    VaultConfigPreview:
      type: object
      required: [changed_sections]
      description: >-
        structural diff of a would-be vault config update.
        Populated only on dry-run responses; lists which top-level
        sections of the vault config would change if the request were
        committed.
      properties:
        changed_sections:
          type: array
          items:
            type: string
          description: >-
            Names of the top-level config sections (e.g.,
            `document_types`, `lifecycle`, `adapter_defaults`) whose
            merged value differs from the currently-persisted value.
            Empty list when the request is a no-op (every supplied
            section is byte-identical to the current state).

    # -------------------------------------------------------------------------
    # Hash Check
    # -------------------------------------------------------------------------

    HashCheckRequest:
      type: object
      required: [hashes]
      description: Request body for the hash-check endpoint; carries a batch of content hashes to test for existence in the vault.
      properties:
        hashes:
          type: array
          items:
            type: string
          description: SHA-256 hex digests to check for existence.

    HashCheckMatch:
      type: object
      required: [exists]
      description: One per-hash result from a hash-check response; reports existence and (when present) the matching document id.
      properties:
        exists:
          type: boolean
          description: True when a document with this hash already exists in the vault.
        document_id:
          type: string
          nullable: true
          description: Document id when exists=true; null otherwise.

    # -------------------------------------------------------------------------
    # Staging Edges
    # -------------------------------------------------------------------------

    StagingEdge:
      type: object
      required: [id, source_id, target_id, edge_type, inference_evidence, created_at]
      description: One entry in the staging-edges queue; carries an inferred edge awaiting human confirm/dismiss.
      properties:
        id:
          type: string
          description: Unique identifier for this staging edge.
        source_id:
          type: string
          description: Origin document id for the proposed edge.
        target_id:
          type: string
          description: Target document id for the proposed edge.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
        inference_evidence:
          type: string
          description: >-
            Free-text rationale produced by the inference strategy that
            proposed this edge (e.g. "filename code 'PV07' matches
            covered document").
        confidence_tier:
          type: integer
          default: 2
          description: Inference tier (Tier 2 = staged for review).
        created_at:
          type: string
          format: date-time
          description: Timestamp when this staging edge was created.

    StagingEdgeConfirmResponse:
      type: object
      required: [confirmed, staging_edge_id, production_edge_id]
      description: Response body for the confirm-staging-edge endpoint; reports the staging-to-production promotion outcome.
      properties:
        confirmed:
          type: boolean
          enum: [true]
          description: Discriminator confirming the staging edge was promoted; always true.
        staging_edge_id:
          type: string
          description: Id of the staging edge that was promoted (now deleted).
        production_edge_id:
          type: string
          description: Id of the production edge created.

    StagingEdgeDismissResponse:
      type: object
      required: [dismissed, staging_edge_id]
      description: Response body for the dismiss-staging-edge endpoint; confirms the staging edge was discarded.
      properties:
        dismissed:
          type: boolean
          enum: [true]
          description: Discriminator confirming the staging edge was dismissed; always true.
        staging_edge_id:
          type: string
          description: Id of the staging edge that was dismissed (now deleted).

    # -------------------------------------------------------------------------
    # Pending Metadata
    # -------------------------------------------------------------------------

    ExtractedField:
      type: object
      required: [source]
      description: One per-field annotation surfaced inside a pending-metadata item; carries the inferred value and its origin.
      properties:
        value:
          type: string
          nullable: true
          description: The extracted value, or null if unavailable.
        source:
          type: string
          enum: [filename, content, default]
          description: How this field was derived.
        alt_value:
          type: string
          nullable: true
          description: Optional alternative candidate value.
        alt_source:
          type: string
          nullable: true
          description: Source label for alt_value.

    PendingMetadataItem:
      type: object
      required: [document, extracted_fields]
      description: One entry in the pending-metadata queue; pairs a document with the per-field annotations awaiting human confirmation.
      properties:
        document:
          $ref: "#/components/schemas/Document"
        extracted_fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExtractedField"
          description: >-
            Per-field annotation. Keys include "title", "doc_type",
            "project", "tags", "document_date" depending on which
            fields were extracted.

    # -------------------------------------------------------------------------
    # Document Read and OS Open
    # -------------------------------------------------------------------------

    ReadProjectionResponse:
      type: object
      required: [document_id, title, lifecycle_status, source_path]
      description: Response body for the read-projection endpoint; returns the canonical text projection for a document along with identifying metadata.
      properties:
        document_id:
          type: string
          description: Id of the document whose projection was read.
        title:
          type: string
          description: Human-readable title of the document.
        version_label:
          type: string
          nullable: true
          description: Caller-supplied version label for the document, when set; null otherwise.
        lifecycle_status:
          type: string
          description: Current lifecycle state of the document.
        doc_type:
          type: string
          nullable: true
          description: Vault-domain document type from the doc_types vocabulary; null when not classified.
        source_path:
          type: string
          description: Vault-local path to the document's source file.
        projection_text:
          type: string
          nullable: true
          description: >-
            Full canonical projection text reassembled from stored chunks. Populated when the read returns the projection inline. Null when the caller supplied write_to_path and the projection bytes were delivered to disk instead.
        written_to:
          type: string
          nullable: true
          description: >-
            Absolute path where SAGE wrote the projection text. Populated only when the request specified write_to_path. Equals the caller-supplied value.
        content_size:
          type: integer
          nullable: true
          description: >-
            Byte count of the projection text written to disk. Populated only when the request specified write_to_path.
        read_meta:
          $ref: "#/components/schemas/ReadMeta"

    ReadSectionResponse:
      type: object
      required: [document_id, title, heading_path, chunk_count, section_text]
      description: Response body for the read-section endpoint; returns the text spanned by a heading-path prefix within a document.
      properties:
        document_id:
          type: string
          description: Id of the document whose section was read.
        title:
          type: string
          description: Human-readable title of the document.
        heading_path:
          type: string
          description: Heading-path prefix that scoped the section read.
        chunk_count:
          type: integer
          description: Number of chunks matched by the heading_path prefix.
        section_text:
          type: string
          description: Concatenated text of all chunks under the heading path.
        read_meta:
          $ref: "#/components/schemas/ReadMeta"

    ListHeadingsResponse:
      type: object
      required: [document_id, title, headings]
      description: >-
        Response body for the list-headings endpoint; returns the distinct
        heading paths of a document in document order. Body content is not
        included. The synthetic header chunk is excluded.
      properties:
        document_id:
          type: string
          description: Id of the document whose headings were listed.
        title:
          type: string
          description: Human-readable title of the document.
        headings:
          type: array
          items:
            type: string
          description: >-
            Distinct heading paths in document order, suitable for passing
            to read_section.

    OpenDocumentResponse:
      type: object
      required: [opened, path]
      description: Response body for the open-document endpoint; confirms the OS opener was dispatched and reports the resolved file path.
      properties:
        opened:
          type: boolean
          enum: [true]
          description: Discriminator confirming the OS opener was dispatched; always true.
        path:
          type: string
          description: Absolute filesystem path that was dispatched to the OS opener.

    DocumentDownloadUrlResponse:
      type: object
      required: [download_url]
      description: Response body for the download-url endpoint; carries a short-lived pre-authenticated URL for direct browser delivery of a document's source.
      properties:
        download_url:
          type: string
          description: >-
            Short-lived, pre-authenticated URL from which the document's
            source file can be fetched directly, bypassing SAGE. Valid for
            a limited time.

    # -------------------------------------------------------------------------
    # Utilities
    # -------------------------------------------------------------------------

    ExportProjectionResponse:
      type: object
      required: [document_id, output_path]
      description: Response body for the export-projection endpoint; confirms the projection write and reports the resolved output path.
      properties:
        document_id:
          $ref: "#/components/schemas/DocumentId"
          description: The document whose projection was exported.
        output_path:
          type: string
          description: Absolute path where the projection file was written.

    RefreshViewsResponse:
      type: object
      required: [vault_id, views_generated]
      description: Response body for the refresh-views endpoint; reports the vault and the count of regenerated view artifacts.
      properties:
        vault_id:
          $ref: "#/components/schemas/VaultId"
          description: The vault whose views were refreshed.
        views_generated:
          type: integer
          description: Number of view artifacts regenerated.

    # -------------------------------------------------------------------------
    # Maintenance (CAS-ADR-029)
    # -------------------------------------------------------------------------

    MigrationReportEntry:
      type: object
      required: [table, column]
      description: One schema migration that was applied to a vault by migrate_vault.
      properties:
        table:
          type: string
          description: Table name whose schema was altered (e.g., 'documents', 'edges').
        column:
          type: string
          description: Column name added to the table by this migration.

    MigrationReport:
      type: object
      required: [vault_id, columns_added, backfills_applied]
      description: Result of a migrate_vault call -- what changed on disk.
      properties:
        vault_id:
          $ref: "#/components/schemas/VaultId"
          description: Identifier of the vault whose schema was inspected.
        columns_added:
          type: array
          items:
            $ref: "#/components/schemas/MigrationReportEntry"
          description: Per-column entries for every ALTER TABLE that was applied. Empty when no schema work was pending.
        backfills_applied:
          type: array
          items:
            type: string
          description: Names of data backfills that were detected as pending and applied. Empty when no backfills were needed.
        source_paths_normalized:
          type: array
          items:
            $ref: "#/components/schemas/SourcePathNormalization"
          description: >-
            Per-document entries for every record whose stored source path was
            reduced to its plain form. Empty when no record held another
            spelling. A path that walks out of the vault's source tree has no
            plain form inside it and is left as recorded; `verify_vault_source_files`
            reports those.
        tier3_uniqueness_activations:
          type: array
          items:
            $ref: "#/components/schemas/Tier3UniquenessActivation"
          description: >-
            Per-(doc_type, field) entries for each `unique_keys` declaration
            whose underlying partial UNIQUE index was created or confirmed by
            this migration. Empty when no `unique_keys` are declared
            or all were already active.
        tier3_uniqueness_collisions:
          type: array
          items:
            $ref: "#/components/schemas/Tier3UniquenessCollision"
          description: >-
            Per-(doc_type, field, value) entries for every collision that
            prevented activation of a `unique_keys` declaration.
            Non-empty means at least one declaration is NOT live; the
            substrate refuses to activate the constraint while collisions
            remain (CAS-ADR-031 §5). The operator resolves via renumber,
            supersede, or archive-and-recreate, then re-runs the migration.

    SourcePathNormalization:
      type: object
      required: [document_id, previous_source_path, normalized_source_path]
      description: >-
        One record whose stored source_path was reduced to its plain form.
        Ingest records a vault-relative source path in one spelling, but
        records written before it did can still hold another -- a `.` segment,
        a doubled separator, or a trailing one. The read side resolves those
        and the write-time guard refuses them, so such a record names a path
        its own bytes cannot be written back to. The migration rewrites the
        stored value once.
      properties:
        document_id:
          $ref: "#/components/schemas/DocumentId"
          description: Identifier of the document whose stored source path was rewritten.
        previous_source_path:
          type: string
          description: The spelling the record held before the migration rewrote it.
        normalized_source_path:
          type: string
          description: The plain form the record holds after the migration.
        path_shared_with:
          type: array
          items:
            $ref: "#/components/schemas/DocumentId"
          description: >-
            Other documents that hold the normalized path once this migration
            completes -- those that already held it, and those the same pass
            rewrote onto it. Empty in the ordinary case. Non-empty means the
            rewrite left more than one record naming a single stored file,
            which the differing spellings had until now kept apart; the
            migration reports it rather than choosing between them.

    Tier3UniquenessActivation:
      type: object
      required: [doc_type, field]
      description: >-
        One (doc_type, field) pair whose partial UNIQUE index was created
        or confirmed by the migration (CAS-ADR-031).
      properties:
        doc_type:
          type: string
          description: Document type opted into uniqueness.
        field:
          type: string
          description: The tier3_metadata field whose values are now unique.

    Tier3UniquenessCollision:
      type: object
      required: [doc_type, field, value, document_ids]
      description: >-
        One value held by multiple chain heads of the same doc_type.
        Surfaced by the migration scan when a vault's
        `unique_keys` declaration cannot be activated because the existing
        portfolio violates the constraint. Per CAS-ADR-031 §5 the substrate
        refuses to activate (does not auto-resolve, does not flag-and-pass);
        the operator must resolve the collision via renumbering,
        supersession, or archive-and-recreate before the constraint can
        take effect.
      properties:
        doc_type:
          type: string
          description: Document type whose unique_keys declaration was scanned.
        field:
          type: string
          description: The tier3_metadata field whose values collided.
        value:
          description: The colliding value held by more than one chain head.
        document_ids:
          type: array
          items:
            type: string
          description: >-
            All chain-head document ids holding this value (length >= 2).
            Each id is the head of a distinct supersession chain; resolving
            the collision means making all-but-one of these no longer carry
            the value.

    ReabstractOutcome:
      type: string
      enum: [success, skipped_pdf, llm_failure, still_skipped, timeout, interrupted]
      description: >-
        Per-document outcome classification in a ReabstractReport.
        `success`: the document's pipeline_status transitioned to
        abstraction_complete. `skipped_pdf`: the document is source_type=pdf
        and was excluded because include_pdf was False. `llm_failure`:
        dispatch raised, background generation raised, or the document
        terminated in pipeline_status='failed'. `still_skipped`: the
        document settled back at pipeline_status='abstraction_skipped',
        having declined abstraction rather than failed at it. `timeout`:
        the document had not reached a terminal pipeline_status when the
        wait ceiling elapsed, and was abandoned while its abstraction may
        still have been running. `interrupted`: the document settled at
        pipeline_status='abstraction_interrupted', its work dropped by a
        stopped queue without reaching a provider, and the next server
        start re-runs it. The last four all count toward
        failed_count, which counts documents that did not reach
        abstraction_complete; they are reported apart because only
        `llm_failure` indicates an error the provider actually raised.

    ReabstractRequest:
      type: object
      description: Request body for recompute_deferred_vault_abstracts.
      properties:
        include_pdf:
          type: boolean
          default: false
          description: >-
            When False (default), documents whose source_type is 'pdf' are
            skipped: scanned PDFs typically have no extractable text and
            reabstract returns a degenerate abstract. When True, PDFs are
            included in the worklist.

    OptimizeContentStoreRequest:
      type: object
      description: Request body for optimize_vault_content_store.
      properties:
        cleanup_older_than_days:
          type: integer
          minimum: 0
          default: 7
          description: >-
            Accepted for the port contract; has no effect on the Postgres
            binding, whose VACUUM reclaims every eligible dead tuple
            regardless of age.

    OptimizeContentStoreReport:
      type: object
      required:
        - vault_id
        - cleanup_older_than_days
        - started_at
        - finished_at
        - pre_bytes
        - post_bytes
        - bytes_reclaimed
        - pre_versions
        - post_versions
        - pre_fragments
        - post_fragments
        - pre_small_fragments
        - post_small_fragments
      description: >-
        Result of an optimize_vault_content_store call. The underlying
        VACUUM returns nothing; the caller-visible evidence of
        reclamation is the delta between pre- and post-optimize
        observations of relation byte size, dead-tuple count, and page
        counts captured by this report.
      properties:
        vault_id:
          $ref: "#/components/schemas/VaultId"
          description: Identifier of the vault whose content store was optimized.
        cleanup_older_than_days:
          type: integer
          minimum: 0
          description: >-
            The pruning threshold the operation ran with. Echoes the
            request body value (or the 7-day default when no body was
            sent) for audit-log alignment.
        started_at:
          type: string
          format: date-time
          description: UTC timestamp recorded immediately before the optimize call.
        finished_at:
          type: string
          format: date-time
          description: UTC timestamp recorded immediately after the optimize call returns.
        pre_bytes:
          type: integer
          minimum: 0
          description: Total relation size (table plus indexes and toast) immediately before optimize was called.
        post_bytes:
          type: integer
          minimum: 0
          description: Total relation size immediately after optimize returned.
        bytes_reclaimed:
          type: integer
          minimum: 0
          description: >-
            max(0, pre_bytes - post_bytes). Bounded at zero because
            optimize can occasionally leave the relation the same size
            on a near-clean table.
        pre_versions:
          type: integer
          minimum: 0
          description: Dead-tuple count (MVCC row versions pending reclamation) before optimize.
        post_versions:
          type: integer
          minimum: 0
          description: Dead-tuple count after optimize.
        pre_fragments:
          type: integer
          minimum: 0
          description: Table length in pages before optimize.
        post_fragments:
          type: integer
          minimum: 0
          description: Table length in pages after optimize.
        pre_small_fragments:
          type: integer
          minimum: 0
          description: Free space in pages before optimize.
        post_small_fragments:
          type: integer
          minimum: 0
          description: Free space in pages after optimize.

    ReabstractReportEntry:
      type: object
      required: [document_id, outcome]
      description: One per-document outcome record in a ReabstractReport.
      properties:
        document_id:
          type: string
          description: Document id whose reabstract outcome this entry records.
        outcome:
          $ref: "#/components/schemas/ReabstractOutcome"
          description: >-
            Per-document classification (success / skipped_pdf /
            llm_failure / still_skipped / timeout / interrupted).
        error_message:
          type: string
          nullable: true
          description: >-
            Failure description when outcome is 'llm_failure',
            'still_skipped', 'timeout', or 'interrupted'; null otherwise.
        elapsed_seconds:
          type: number
          nullable: true
          description: >-
            Wall-clock seconds from dispatch to terminal status for this
            document; null for skipped_pdf entries (no work was done).

    StalenessBasis:
      type: string
      enum:
        [content_drift, chain_advanced_no_content_change, recorded_null, chain_nonlinear]
      description: >-
        Per-edge drift classification in a DriftReport.
        `content_drift`: recorded hash differs from the head's hash —
        real drift, action required. `chain_advanced_no_content_change`:
        chain advanced past recorded version but content unchanged —
        informational. `recorded_null`: neither synced_from_* field
        recorded (legacy edge or unknown provenance). `chain_nonlinear`:
        target's supersedes chain has multiple heads — data-quality
        flag, not drift.

    DriftEntry:
      type: object
      required: [edge_id, edge_type, source_id, target_id, staleness_basis]
      description: >-
        Per-edge entry in a DriftReport. Surfaced when an
        active sync_target / derived_from edge no longer matches the
        current head of its target's supersedes chain. Hash is the
        authoritative comparator; version doc-id is a display key.
      properties:
        edge_id:
          type: string
          description: Identifier of the drifted edge.
        edge_type:
          $ref: "#/components/schemas/EdgeType"
          description: "`sync_target` or `derived_from` (the two provenance-bearing edge types)."
        source_id:
          type: string
          description: Edge source document id (the dependent).
        target_id:
          type: string
          description: Edge target document id (the canonical/source document).
        recorded_version_id:
          type: string
          nullable: true
          description: >-
            The `synced_from_version` recorded on the edge (a document
            id), or null when not recorded.
        recorded_version_label:
          type: string
          nullable: true
          description: >-
            The `version_label` of the recorded synced-from document at
            the time the drift report was generated, when resolvable.
        recorded_content_hash:
          type: string
          nullable: true
          description: >-
            The `synced_from_content_hash` recorded on the edge, or
            null when not recorded.
        current_head_id:
          type: string
          nullable: true
          description: >-
            Document id of the current head of the target's supersedes
            chain. Null when `staleness_basis = chain_nonlinear`
            (multiple heads — see `competing_head_count`).
        current_head_version_label:
          type: string
          nullable: true
          description: Version label of the current chain head, when resolvable.
        current_head_content_hash:
          type: string
          nullable: true
          description: >-
            `source_content_hash` of the current chain head. Null on
            `chain_nonlinear` and on `recorded_null` rows where we did
            not need to compute it.
        competing_head_count:
          type: integer
          nullable: true
          description: >-
            Number of heads observed when `staleness_basis =
            chain_nonlinear`; null otherwise. Operators follow up via
            `chain` for full forensics.
        staleness_basis:
          $ref: "#/components/schemas/StalenessBasis"
          description: Why this edge appears in the drift report.

    DriftReport:
      type: object
      required: [vault_id, total_edges_walked, summary, entries]
      description: >-
        Result of a verify_vault_drift call. Per-vault
        audit of sync_target / derived_from edges whose recorded
        provenance has diverged from the current source-chain head.
        Entries with `staleness_basis = content_drift` are stale and
        require action; `chain_advanced_no_content_change` and
        `recorded_null` are informational; `chain_nonlinear` is a
        data-quality flag. Edges whose recorded state still matches
        the head are absent from the report.
      properties:
        vault_id:
          type: string
          description: Identifier of the vault whose edges were walked.
        total_edges_walked:
          type: integer
          description: >-
            Total count of active `sync_target` / `derived_from` edges
            the detector inspected. Equals the universe; `len(entries)`
            is the subset that triggered a report row.
        summary:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Per-basis counts. Keys are `StalenessBasis` enum values;
            each value is the count of `entries` carrying that basis.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DriftEntry"
          description: >-
            Per-edge report rows; one row per edge whose state
            warranted operator attention.

    SourceFileIntegrityRequest:
      type: object
      description: Request body for the verify-source-files maintenance operation.
      properties:
        check_hashes:
          type: boolean
          default: false
          description: >-
            When true, recompute each present file's SHA-256 and compare
            against the recorded source_content_hash, surfacing
            `hash_mismatch` rows. Adds a full file read per document;
            default false performs an existence check only.

    SourceFileIntegrityEntry:
      type: object
      required:
        [document_id, title, source_path, lifecycle_status, integrity_status, expected_content_hash]
      description: >-
        Per-document entry in a SourceFileIntegrityReport. Surfaced when a
        document's backing source file is absent under the vault storage
        root (`missing`), when the recorded path is a link rather than the
        retained copy (`symlinked`), when it resolves outside the vault's
        source tree (`out_of_root`), or, when hash verification is enabled,
        present but no longer hashing to the digest recorded for the
        retained copy (`hash_mismatch`).
      properties:
        document_id:
          type: string
          description: Identifier of the document with the integrity issue.
        title:
          type: string
          description: Human-readable title of the document.
        source_path:
          type: string
          description: The document's vault-relative source_path.
        lifecycle_status:
          type: string
          description: Lifecycle state of the document (active, archived, ...).
        version_label:
          type: string
          nullable: true
          description: Version indicator of the document, when set.
        integrity_status:
          type: string
          enum: [missing, hash_mismatch, symlinked, out_of_root]
          description: >-
            `missing` — the source file does not exist under the storage
            root. `hash_mismatch` — the file exists but its content hash
            differs from the recorded source_content_hash (only emitted
            when check_hashes=True). `symlinked` — the recorded path is a
            link rather than the retained copy itself. `out_of_root` — the
            recorded path resolves outside the vault's source tree. The
            last two are emitted in both modes and never read through:
            neither names a copy the store will repair in place, so it
            refuses to write at such a path, and `out_of_root` outranks
            `missing` because that refusal does not depend on whether
            anything resolves at the far end.
        expected_content_hash:
          type: string
          description: >-
            The digest the audit compared the retained copy against: the
            document's stored_content_hash, or its source_content_hash when
            that is null. This is what the stored bytes were expected to hash
            to, which is not always the document's provenance hash.
        observed_content_hash:
          type: string
          nullable: true
          description: >-
            SHA-256 computed from the on-disk file when check_hashes=True
            and the file was readable; null for `missing`, `symlinked` and
            `out_of_root` rows and whenever check_hashes=False.

    SourceFileIntegrityReport:
      type: object
      required: [vault_id, total_documents_checked, check_hashes, summary, entries]
      description: >-
        Result of a verify_vault_source_files call. Per-vault audit that
        every document's backing source file is present under the vault
        storage root, is the copy itself rather than a link to one, and
        names a path inside the vault's source tree, and — when
        check_hashes is set — that each present file still hashes to its
        recorded source_content_hash. Documents with an intact source
        file are absent from the report.
      properties:
        vault_id:
          type: string
          description: Identifier of the vault whose source files were audited.
        total_documents_checked:
          type: integer
          description: >-
            Total documents inspected across all lifecycle states. Equals
            the universe; `len(entries)` is the subset with a missing or
            mismatched file.
        check_hashes:
          type: boolean
          description: >-
            Whether on-disk hashes were recomputed and compared (true) or
            only existence was checked (false).
        summary:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Counts keyed by `healthy`, `missing`, `hash_mismatch`,
            `symlinked`, and `out_of_root`. The five values sum to
            total_documents_checked.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SourceFileIntegrityEntry"
          description: >-
            Per-document rows; one per document whose source file is
            missing, symlinked, out of root, or hash-mismatched.

    SourceFileRestoreRequest:
      type: object
      required: [source]
      description: Request body for the restore-source-file maintenance operation.
      properties:
        source:
          type: string
          description: >-
            Absolute path to a file holding the bytes that were originally
            ingested. SAGE retains no pristine second copy of a source, so
            the caller supplies the bytes to restore. The target document
            is resolved from their digest, which is why the bytes must be
            the originals rather than a corrected or re-exported version.
        document_id:
          type: string
          nullable: true
          description: >-
            Optional pin naming the document to restore. Not required: the
            target is normally resolved from the delivered bytes' digest.
            Supply it when that resolution is ambiguous (several documents
            share a provenance hash) or impossible (a document ingested
            before delivered and stored digests were recorded separately,
            whose provenance hash describes the stored copy rather than
            the delivered bytes).

    SourceFileRestoreReport:
      type: object
      required:
        [
          vault_id,
          document_id,
          source_path,
          status,
          provenance_verified,
          record_refreshed,
          expected_content_hash,
          stored_content_hash,
        ]
      description: >-
        Result of a restore_vault_source_file call. Repairs one document's
        retained source file by writing the delivered bytes back at the
        vault-relative path the document record already names. The
        counterpart to verify_vault_source_files, which reports a retained
        copy that changed outside SAGE but cannot repair it: a re-ingest
        would read the difference as a name collision and home the document
        at a second path instead of restoring the first.
      properties:
        vault_id:
          type: string
          description: Identifier of the vault whose source file was restored.
        document_id:
          type: string
          description: >-
            Identifier of the document whose retained source file was the
            target.
        source_path:
          type: string
          description: >-
            The document's vault-relative source_path — the path the bytes
            were written to. Unchanged by the restore, which never re-homes
            a document.
        status:
          type: string
          enum: [restored, already_intact]
          description: >-
            Whether bytes were written. `restored` — the retained copy was
            missing or mismatched and the delivered bytes were written over
            it. `already_intact` — the retained copy already hashed to its
            recorded digest and the store was left untouched.
        provenance_verified:
          type: boolean
          description: >-
            Whether the delivered bytes were confirmed to be the target
            document's. True whenever the target was resolved from their
            digest, and whenever a document_id pin was checked against the
            record's provenance. False only for a pinned restore of a
            document carrying no stored digest: its recorded provenance
            describes its stored copy rather than the delivered bytes, so
            nothing on the record can confirm the file handed over is the
            right one.
        record_refreshed:
          type: boolean
          description: >-
            Whether stored_content_hash was updated on the document record.
            True only where the store demonstrably rewrote the bytes it was
            given, which is the sole reason the recorded digest may move.
            False leaves any recorded mismatch reported rather than adopted
            — so a restore can report `restored` with this false, meaning
            the bytes were written but the record still describes a
            different copy.
        expected_content_hash:
          type: string
          description: >-
            The digest the retained copy was required to reproduce before
            the restore: the document's stored_content_hash, or its
            source_content_hash when that is null.
        observed_content_hash:
          type: string
          nullable: true
          description: >-
            SHA-256 of the retained copy as found before the restore; null
            when no copy was present to hash.
        stored_content_hash:
          type: string
          description: >-
            SHA-256 of the retained copy as it stands after the call.
            Differs from expected_content_hash under a binding that rewrites
            its copy at rest, where writing the same bytes back yields a
            fresh stored digest. Whether the document record was updated to
            match is reported separately by record_refreshed — this field
            describes the store, not the record.

    ReabstractReport:
      type: object
      required:
        [vault_id, reabstracted_count, skipped_pdf_count, failed_count, entries]
      description: >-
        Result of a recompute_deferred_vault_abstracts call -- aggregate
        counts and per-document outcomes for the deferred-abstract worklist.
      properties:
        vault_id:
          $ref: "#/components/schemas/VaultId"
          description: Identifier of the vault whose deferred abstracts were processed.
        reabstracted_count:
          type: integer
          description: Number of documents whose pipeline_status transitioned to abstraction_complete by this operation.
        skipped_pdf_count:
          type: integer
          description: Number of source_type=pdf documents excluded because include_pdf was False. Always 0 when include_pdf is True.
        failed_count:
          type: integer
          description: Number of documents whose reabstract attempt did not reach abstraction_complete.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ReabstractReportEntry"
          description: Per-document outcome records. Length equals reabstracted_count + skipped_pdf_count + failed_count.

    ReabstractStartedResponse:
      type: object
      required: [status, document_id, dispatched_at]
      description: >-
        Fire-and-forget acknowledgement returned by recompute_abstract: the
        re-abstraction job for a single document has been accepted and
        dispatched to the background worker. The regenerated abstract is
        written by that job, not by the call that returned this response.
      properties:
        status:
          type: string
          enum: [reabstract_started]
          description: >-
            Fixed discriminator confirming the re-abstraction job was accepted
            and dispatched. Always 'reabstract_started'.
        document_id:
          type: string
          description: Identifier of the document whose abstract is being regenerated.
        dispatched_at:
          type: string
          format: date-time
          description: >-
            UTC timestamp at which the background re-abstraction job was enqueued.
            The abstract is regenerated by that job, not by the call that returned
            this response; wait for a terminal pipeline_status on the document to
            observe the outcome, as a single bounded wait rather than one status
            read per unit of caller work.

    ReabstractProgressEvent:
      type: object
      required: [event_type, processed, total, current_document_id, current_title, status]
      description: >-
        SSE `progress` event payload for recompute_deferred_vault_abstracts.
        Emitted twice per non-PDF document (a `started` event
        before dispatch, then a `completed` or `failed` event after the
        polling loop reaches a terminal pipeline_status) and once per
        skipped PDF (a `skipped` event). Shape mirrors the ingest
        pipeline's ProgressEvent precedent
        (docs/fs/cas_app_api.openapi.yaml).
      properties:
        event_type:
          type: string
          enum: [progress]
          description: Discriminator for the SSE event payload variant; always 'progress'.
        processed:
          type: integer
          description: >-
            Count of documents whose terminal event has already been
            emitted in this stream. Zero on the first `started` event;
            increments by one on each `completed`, `failed`, or `skipped`
            event. Equals `total` once the stream is exhausted.
        total:
          type: integer
          description: >-
            Total document count in the reabstract-deferred worklist for
            this run, including PDFs that will be skipped when
            `include_pdf=False`. Constant across all events in the stream.
        current_document_id:
          type: string
          description: Document id this event refers to.
        current_title:
          type: string
          description: >-
            Human-readable title of the document this event refers to.
            Surfaced so the maintenance panel can show the user what is
            in flight without a separate get_document round-trip.
        status:
          type: string
          enum: [started, completed, failed, skipped]
          description: >-
            Per-document status. `started`: dispatch begun, no outcome
            yet. `completed`: reabstract reached `abstraction_complete`.
            `failed`: dispatch raised, terminal pipeline_status was
            `failed` (outcome=`llm_failure`), or the wait ceiling elapsed
            with the document still non-terminal (outcome=`timeout`), or
            the document settled at `abstraction_interrupted`
            (outcome=`interrupted`). `skipped`: PDF excluded from the worklist by
            `include_pdf=False` (outcome=`skipped_pdf`), or the document
            settled back at `abstraction_skipped`
            (outcome=`still_skipped`). Outcomes widened without widening
            this vocabulary, so a client switching on `status` alone
            keeps working and one needing the distinction reads
            `outcome`.
        outcome:
          $ref: "#/components/schemas/ReabstractOutcome"
          nullable: true
          description: >-
            Per-document terminal classification. Set on `completed`,
            `failed`, and `skipped` events; omitted on the leading
            `started` event. Discriminates within a status: `failed`
            carries `llm_failure`, `timeout` or `interrupted`, and `skipped`
            carries `skipped_pdf` or `still_skipped`.
        error:
          type: string
          nullable: true
          description: >-
            Failure description. Set on every `failed` event and on a
            `skipped` event whose outcome is `still_skipped`, which carries
            one because a document that declined abstraction has something
            to report; omitted on `started`, on `completed`, and on the
            `skipped_pdf` form of `skipped`.
        elapsed_seconds:
          type: number
          nullable: true
          description: >-
            Wall-clock seconds from dispatch to terminal status. Set on
            `completed`, on `failed`, and on the `still_skipped` form of
            `skipped`, all of which dispatched and waited. Omitted on
            `started` (no work yet) and on the `skipped_pdf` form of
            `skipped` (never dispatched).

    ReabstractSummaryEvent:
      type: object
      required:
        [event_type, vault_id, reabstracted_count, skipped_pdf_count, failed_count, entries]
      description: >-
        SSE `summary` event payload for recompute_deferred_vault_abstracts.
        Emitted once at the end of the stream, after all per-
        document progress events. Payload fields (sans the `event_type`
        discriminator) are structurally identical to ReabstractReport so
        the MCP tool aggregator can derive its return dict directly from
        this event.
      properties:
        event_type:
          type: string
          enum: [summary]
          description: Discriminator for the SSE event payload variant; always 'summary'.
        vault_id:
          $ref: "#/components/schemas/VaultId"
          description: Identifier of the vault whose deferred abstracts were processed.
        reabstracted_count:
          type: integer
          description: Number of documents whose pipeline_status transitioned to abstraction_complete by this run.
        skipped_pdf_count:
          type: integer
          description: Number of source_type=pdf documents excluded because include_pdf was False.
        failed_count:
          type: integer
          description: Number of documents whose reabstract attempt did not reach abstraction_complete.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ReabstractReportEntry"
          description: Per-document outcome records. Length equals reabstracted_count + skipped_pdf_count + failed_count.

    # -------------------------------------------------------------------------
    # Unlink
    # -------------------------------------------------------------------------

    UnlinkResponse:
      type: object
      required: [deleted, edge_id]
      description: Response body for the unlink endpoint; confirms an edge was deleted (or previews the deletion on a dry-run) and reports its id.
      properties:
        deleted:
          type: boolean
          description: >-
            True on a successful real-run deletion. False on a dry-run
            preview.
        edge_id:
          type: string
          description: Id of the edge that was (or would be) deleted.
        dry_run:
          type: boolean
          default: false
          description: >-
            True when the unlink call set `dry_run=true`; in
            that case no state was written and `preview_edge` carries
            the would-be projection of the edge that would be deleted.
            Note: unlink is an edge mutation, not a document field
            mutation, so the change surface is the existing
            `preview_edge` field rather than a separate `changes`
            block.
        preview_edge:
          $ref: "#/components/schemas/Edge"
          nullable: true
          description: >-
            On a dry-run, the existing edge that would be
            deleted. Null on a real-run.

    # -------------------------------------------------------------------------
    # Batch ingest (upload + SSE)
    # -------------------------------------------------------------------------

    BatchIngestFileMetadata:
      type: object
      description: >-
        Per-file source type and optional parsed metadata for a bulk upload.
        Aligned by position with the multipart file parts: the Nth entry in
        BatchIngestUploadMetadata.files describes the Nth uploaded file.
      required: [source_type]
      properties:
        source_type:
          type: string
          description: >-
            Source artifact format for this file (closed SourceType
            vocabulary: markdown, docx, xlsx, pptx, pdf). Must be a source
            type with a registered adapter.
        parsed_metadata:
          type: object
          additionalProperties: true
          description: >-
            Optional caller-supplied parsed metadata for this file (keys:
            title, date, project, codes, version, doc_type). When omitted, the
            file stem seeds the title and the vault's FilenameParser fills the
            remaining fields.

    BatchIngestUploadMetadata:
      type: object
      description: >-
        JSON metadata envelope accompanying multipart batch-ingest uploads.
        Sent as the `metadata` form field alongside the `files` parts of a
        multipart/form-data batch-ingest request.
      required: [files]
      properties:
        infer_edges:
          type: boolean
          description: >-
            When true, run two-phase edge inference across the batch after
            ingestion (Tier 1 supersedes via version_chain; Tier 2 covers via
            filename_code_match). When false, no edges are inferred.
        needs_review:
          type: boolean
          description: >-
            When true (default), every document in the batch lands with
            metadata_confirmed=false in the metadata-review queue
            (CAS-ADR-021). When false, caller-supplied metadata is committed
            as authoritative.
        files:
          type: array
          items:
            $ref: "#/components/schemas/BatchIngestFileMetadata"
          description: >-
            Per-file descriptors aligned by position with the uploaded file
            parts. Length must equal the number of uploaded files.

    DocumentsCreated:
      type: object
      description: Nested counter for SummaryEvent.documents_created.
      required: [new, new_version]
      properties:
        new:
          type: integer
          description: Documents newly inserted this batch.
        new_version:
          type: integer
          description: Documents inserted as a new version of an existing chain.

    ProgressEvent:
      type: object
      description: >-
        SSE `progress` event payload. Emitted on file start, completion,
        and error during the per-file ingestion phase.
      required: [event_type, file_index, total_files, filename, stage, status]
      properties:
        event_type:
          type: string
          enum: [progress]
          description: Discriminator for the SSE event payload variant; always 'progress'.
        file_index:
          type: integer
          minimum: 0
          description: Zero-based index of this file in the batch.
        total_files:
          type: integer
          description: Total file count in the batch.
        filename:
          type: string
          description: Filename this progress event refers to.
        stage:
          type: string
          enum: [projection]
          description: Pipeline stage the event applies to.
        status:
          type: string
          enum: [started, completed, failed]
          description: Per-file processing status the event reports.
        document_id:
          type: string
          description: Set when status="completed". Document ID assigned by SAGE.
        error:
          type: string
          description: Set when status="failed". Caller-facing error message.

    EdgeWarning:
      type: object
      description: >-
        A single warning from post-ingest edge resolution: an edge that
        was dropped, an edge whose lifecycle side effects did not fully
        apply, or a chain repair that was withheld.
      required: [source, target, edge_type, reason, detail]
      properties:
        source:
          type: string
          description: >-
            Source document id of the affected edge, or, when reason is
            `ingestion_failed`, the file as the caller named it -- the path
            or filename the caller supplied, never a server-side resolved or
            staging location, the same spelling the `errors` entry for that
            file carries in `source_path`.
        target:
          type: string
          description: >-
            Target document id of the affected edge, or, when reason is
            `ingestion_failed`, the file as the caller named it -- the path
            or filename the caller supplied, never a server-side resolved or
            staging location, the same spelling the `errors` entry for that
            file carries in `source_path`. Both endpoints are reported as
            file references under that reason, including one that did
            resolve.
        edge_type:
          type: string
          description: Edge type of the affected edge (e.g. supersedes).
        reason:
          type: string
          description: >-
            Machine-readable warning reason. One of `ingestion_failed`
            (the source or target file failed to ingest);
            `supersede_target_read_failed` (the supersession target could
            not be read before the edge write); `supersede_target_missing`
            (the supersession target does not exist);
            `supersede_target_not_transitionable` (the target's lifecycle
            state does not permit the supersede transition);
            `chain_repair_withheld` (an edge removal was skipped because a
            related supersession was refused); `edge_removal_failed` (a
            planned edge removal raised); `edge_creation_failed` (the edge
            write raised); `lifecycle_transition_failed` (the edge was
            created but the target's lifecycle write failed);
            `chunk_lifecycle_sync_failed` (the target's lifecycle write
            succeeded but the chunk-store lifecycle sync failed). The
            vocabulary is extensible; consumers should tolerate unknown
            reasons.
        detail:
          type: string
          description: Human-readable explanation of the warning.

    BatchIngestFileError:
      type: object
      description: >-
        One per-file failure recorded during a batch ingest. Every entry
        carries the message-only shape; a failure that was a typed SAGE error
        additionally carries its code and detail, so a caller can branch on
        the code and read the same payload the single-document ingest surface
        returns for that error.
      required: [file_index, filename, source_path, message]
      properties:
        file_index:
          type: integer
          minimum: 0
          description: >-
            Zero-based position of the file in the batch, the same index the
            `progress` events report. Distinguishes two failures whose
            `filename` and `source_path` coincide, as two same-named uploads
            do.
        filename:
          type: string
          description: Basename of the file as staged for ingestion.
        source_path:
          type: string
          description: >-
            The file as the caller named it: the path or filename the caller
            supplied, never a server-side resolved or staging location.
            Distinguishes two failures whose staged basenames coincide.
        message:
          type: string
          description: >-
            Human-readable error text. For a typed SAGE error this is the
            error's own message; otherwise the rendered exception.
        code:
          type: string
          description: >-
            Machine-readable error code, present only when the failure was a
            typed SAGE error. The same code the single-document ingest
            surface returns for that error (e.g. `vault_source_path_refused`,
            `source_file_not_found`, `adapter_not_found`).
        detail:
          type: object
          additionalProperties: true
          description: >-
            Structured error payload, present only when the failure was a
            typed SAGE error that carries one. Shape is per error code; for
            `vault_source_path_refused` it carries `source_path`, the refused
            file as the caller named it.

    SummaryEvent:
      type: object
      description: >-
        SSE `summary` event payload. Emitted once at the end of the
        batch, after all per-file events. Mirrors the IngestSummary
        dataclass returned to non-streaming callers (MCP tool).
      required:
        - event_type
        - documents_created
        - metadata_pending
        - edges_created
        - edges_staged
        - edges_removed
        - edges_dropped
        - abstracts_generated
        - abstracts_deferred
        - error_count
        - errors
      properties:
        event_type:
          type: string
          enum: [summary]
          description: Discriminator for the SSE event payload variant; always 'summary'.
        documents_created:
          $ref: "#/components/schemas/DocumentsCreated"
        metadata_pending:
          type: integer
          description: >-
            Count of documents in this batch whose extracted metadata is
            not yet confirmed.
        edges_created:
          type: object
          additionalProperties:
            type: integer
          description: Tier 1 edges created in production, keyed by edge type.
        edges_staged:
          type: object
          additionalProperties:
            type: integer
          description: Tier 2 edges inserted into staging_edges, keyed by edge type.
        edges_removed:
          type: integer
          description: Pre-existing edges removed during this batch (e.g. supersession cleanup).
        edges_dropped:
          type: integer
          description: >-
            Planned edges dropped rather than created or staged. Causes: a
            referenced file failed to ingest (`ingestion_failed`); a Tier-1
            supersession was refused (`supersede_target_read_failed`,
            `supersede_target_missing`, or
            `supersede_target_not_transitionable`); a chain-repair
            replacement add was withheld after a sibling refusal (no
            warning entry records this drop); or the edge write failed
            (`edge_creation_failed`). Drops and edge_warnings entries are
            not 1:1 -- some warnings report failures that drop no edge.
        abstracts_generated:
          type: integer
          description: Number of documents for which a semantic abstract was generated during this batch.
        abstracts_deferred:
          type: integer
          description: >-
            Documents for which abstraction was skipped (empty projection
            or abstraction disabled in vault config).
        error_count:
          type: integer
          description: Total number of per-file errors recorded during the batch.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BatchIngestFileError"
          description: >-
            Per-file error records for files that failed to ingest in this
            batch, one entry per failure; each names the file's position in
            the batch, the staged filename, the file as the caller named it,
            and the error message, and a typed SAGE error additionally
            carries its code and detail.
        edge_warnings:
          type: array
          items:
            $ref: "#/components/schemas/EdgeWarning"
          description: >-
            Warnings from post-ingest edge resolution, one entry per
            affected edge; each names the source, target, edge type, a
            machine-readable reason, and a human-readable detail. Present
            only when warnings were produced.

    # -------------------------------------------------------------------------
    # Transfer (caller-local byte channel)
    # -------------------------------------------------------------------------

    UploadRecipe:
      type: object
      description: >-
        Returned in place of an ingest result when the call named a
        caller-local source the server cannot read. Carries everything the
        caller's environment needs to deliver the bytes to the upload
        endpoint, after which the originating call is repeated with the
        transfer token to complete the ingest. Every URL and token is used
        verbatim; nothing is composed caller-side.
      required:
        - status
        - method
        - token_header
        - expires_at
        - max_bytes
        - uploads
      properties:
        status:
          type: string
          enum: [upload_required]
          description: >-
            Recipe discriminator. Always `upload_required`: the call cannot
            read the caller-local source, so the caller's environment must
            deliver the bytes to the upload endpoint before repeating the
            call with the transfer token.
        method:
          type: string
          enum: [PUT]
          description: HTTP method of the byte-delivery leg. Always `PUT`.
        token_header:
          type: string
          enum: [X-Upload-Token]
          description: >-
            Name of the request header that carries the upload token on the
            byte-delivery leg. Always `X-Upload-Token`.
        expires_at:
          type: string
          format: date-time
          description: >-
            When the minted tokens lapse. The whole exchange (byte delivery
            plus the completion call) must finish before this instant; after
            it, re-issue the originating call to mint fresh tokens.
        max_bytes:
          type: integer
          description: >-
            Ceiling on a single delivered body in bytes; a larger upload is
            aborted mid-stream.
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadRecipeItem"
          description: >-
            One byte-delivery leg per caller-local source file. Deliver each
            file with its own token to its own URL; a single-file call
            carries exactly one entry.

    UploadRecipeItem:
      type: object
      description: >-
        One byte-delivery leg of an upload recipe: which caller-local file to
        send, where, and with what one-time token.
      required:
        - source
        - transfer_id
        - token
        - url
      properties:
        source:
          type: string
          description: >-
            The caller-local source path this leg delivers, echoed verbatim
            from the originating call.
        transfer_id:
          type: string
          description: >-
            Public identifier of the pending transfer; carried in error
            envelopes and the delivery receipt so legs can be correlated.
        token:
          type: string
          description: >-
            One-time upload token for this leg, presented in the token
            header. Valid for exactly one successful delivery.
        url:
          type: string
          description: Complete URL of the byte-delivery leg, used verbatim.

    DownloadRecipe:
      type: object
      description: >-
        Returned in place of a written file when the call named a
        caller-local target the server cannot write. Carries everything the
        caller's environment needs to fetch the bytes from the download
        endpoint and verify them locally against the promised size and
        digest. Every URL and token is used verbatim; nothing is composed
        caller-side.
      required:
        - status
        - method
        - url
        - token
        - token_header
        - transfer_id
        - expires_at
        - content_hash
        - content_size
        - filename
        - write_to_path
      properties:
        status:
          type: string
          enum: [download_required]
          description: >-
            Recipe discriminator. Always `download_required`: the call cannot
            write to the caller-local target, so the caller's environment
            must fetch the bytes from the download endpoint.
        method:
          type: string
          enum: [GET]
          description: HTTP method of the byte-fetch leg. Always `GET`.
        url:
          type: string
          description: Complete URL of the byte-fetch leg, used verbatim.
        token:
          type: string
          description: >-
            One-time download token, presented in the token header. Consumed
            at redemption; a failed fetch is retried by re-issuing the
            originating call.
        token_header:
          type: string
          enum: [X-Download-Token]
          description: >-
            Name of the request header that carries the download token on the
            byte-fetch leg. Always `X-Download-Token`.
        transfer_id:
          type: string
          description: Public identifier of the pending transfer.
        expires_at:
          type: string
          format: date-time
          description: >-
            When the token lapses; after it, re-issue the originating call to
            mint a fresh one.
        content_hash:
          type: string
          description: >-
            SHA-256 of the bytes the fetch will deliver, in canonical
            `sha256:<hex>` form; verify the fetched file against it.
        content_size:
          type: integer
          description: Exact byte count the fetch will deliver.
        filename:
          type: string
          description: >-
            Basename of the delivered content, suitable as a local filename
            when the requested target is a directory.
        write_to_path:
          type: string
          description: >-
            The caller-local target path echoed verbatim from the originating
            call; the fetched bytes belong there.

    TransferUploadResult:
      type: object
      description: >-
        Receipt for a completed byte delivery: what the server staged, so the
        sender can verify the delivery against the local file before issuing
        the completion call.
      required:
        - transfer_id
        - size
        - sha256
      properties:
        transfer_id:
          type: string
          description: >-
            Public identifier of the pending transfer the bytes were staged
            against.
        size:
          type: integer
          description: Byte count received and staged.
        sha256:
          type: string
          description: >-
            SHA-256 hex digest of the staged bytes, bare hex to compare
            directly against a local checksum of the source file.

    # -------------------------------------------------------------------------
    # Error Response
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      description: >-
        Uniform error envelope for all endpoints.
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Machine-readable error code (e.g., "invalid_lifecycle_transition",
            "document_not_found", "editor_permission_denied").
        message:
          type: string
          description: Human-readable error description.
        detail:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Additional context. Structure varies by error type
            (e.g., current_state and attempted_action for lifecycle
            transition errors).
        read_meta:
          $ref: "#/components/schemas/ReadMeta"

  # ---------------------------------------------------------------------------
  # Tags
  # ---------------------------------------------------------------------------

tags:
  - name: Retrieval
    description: Semantic search, keyword search, catalog enumeration, and deterministic extraction.
  - name: Document Lifecycle
    description: Lifecycle state transitions (CAS-ADR-014).
  - name: Document Metadata
    description: Document record access, mutable metadata updates, and local OS file open.
  - name: Ingestion
    description: Three-stage ingestion pipeline (projection, indexing, abstraction).
  - name: Graph
    description: Edge creation, deletion, graph traversal, and precondition checking.
  - name: Access Control
    description: User registration and editor-based write control.
  - name: Utilities
    description: Projection export, projection/section reads, retrieval health checks, and filesystem views.
  - name: Vault Management
    description: Vault listing, creation, statistics, configuration, and bulk hash checks.
  - name: Staging Edges
    description: Tier 2 inferred edges awaiting review (list, confirm, dismiss).
  - name: Pending Metadata
    description: Documents with unconfirmed extracted metadata.
  - name: Maintenance
    description: >-
      Vault upkeep run out of band: drift detection, source-file verification,
      schema migration, deferred abstraction, content-store optimization, and
      view recomputation.
  - name: Transfer
    description: Token-gated byte legs of the caller-local transfer channel.
