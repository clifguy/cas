classification: patch
summary: >-
  export_projection refuses a target that cannot be written as a file before reading the
  projection or writing anything. The storage root itself (output_path ".") is refused
  with path_traversal_denied, as a strict descendant of the root is required. A target
  inside the root that is not a file location -- an existing directory, or a path running
  through an existing file -- is refused with the new output_path_invalid (400, detail
  output_path and reason). Each of these calls previously failed on the write or on
  creating its parent directories with an unmapped server error -- a 500 on the Core API
  and an untyped tool failure on MCP. The new code is declared in both specifications'
  error schemas, the operation's 400 response, and the tool's error table and Error modes.
detector_override:
  reason: >-
    Replaces an unmapped server error with a typed refusal for the same calls; every call
    that succeeded before still succeeds, and the new code names a condition that had no
    contract.
