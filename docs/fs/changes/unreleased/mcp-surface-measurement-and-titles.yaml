classification: patch
summary: >-
  Publish the MCP input schemas without the framework-generated title on
  each schema node, and remove text each tool published twice about the
  same parameter: ingest_document.source and ingest_document.dry_run no
  longer restate the shared-machine rule and the no-projection rule,
  bulk_ingest_document.dry_run, search.target and the search
  misplaced_filters error entry are reworded, and the list_pending_metadata,
  read_section, update_metadata and verify_vault_source_files descriptions
  drop a sentence their parameter already carries. The BulkLifecycleItem
  action and SourceFileRestoreRequest document_id descriptions are
  shortened in the request model and the specification alike. The MCP tool
  catalog is regenerated. Documentation only; no parameter, type, default
  or behaviour changes.
for_callers: ""
