classification: minor
category:
  - capability
summary: >-
  Deterministic search admits the empty heading path. The empty path addresses text
  under no heading -- the text before a document's first heading, or the whole body of a
  document with no headings -- and read_section and list_headings already accepted and
  listed it, while search with mode="deterministic" refused it as a missing heading_path.
  An explicit empty string now returns the document's text under no heading as one hit,
  whole however the index divided it, with a null heading_path as the scored arms render
  that text; a document with none reports heading_not_found. An omitted heading_path is
  still refused with missing_heading_path. Descriptions change in
  sage_core_api.openapi.yaml and the MCP tool catalog: DiscoverRequest.heading_path says
  the empty string addresses text under no heading, as read_section's heading_path now
  also says, DiscoverHit.heading_path says it is null where the hit carries no chunk and
  where the chunk is text under no heading, and DiscoverHit.chunk_content and search name
  a deterministic request alongside read_section for reading a hit with a null
  heading_path whole. No
  operation, tool, parameter or response field is added or removed.
for_callers: >-
  A search hit with a null heading_path can now be read whole with
  search(mode="deterministic", document_id=..., heading_path=""), as any other hit is read
  with its own heading_path; read_section with an empty heading_path continues to work.
