classification: minor
category: [capability]
summary: >-
  verify_preconditions resolves depends_on through version chains as traverse
  does: edge collection shares traverse's chain-resolution pipeline (lineage
  seeding, anchor filter, retracts, merged_from tombstones), and each target is
  judged on the head of its supersedes chain. PreconditionCheck gains head_id;
  a target chain with more than one head reports actual "forked (N heads)",
  and one that loops back on itself "cyclic (no head)".
  Core API specification, MCP catalog and tool description updated together.
for_callers: >-
  verify_preconditions now resolves dependencies through version chains: a
  superseded document inherits its predecessors' depends_on edges, and each
  dependency is judged on the head of the target's supersedes chain. Each row
  adds head_id (the version judged) beside target_id (the stored edge target),
  and a target whose chain has forked or loops back on itself is reported
  unsatisfied as "forked (N heads)" or "cyclic (no head)".
