classification: minor
category:
  - capability
  - caller-adaptation
summary: >-
  A lifecycle state and a lifecycle transition may each carry an optional doc_types
  list in lifecycle.schema.json. Listed, the entry applies only to documents of those
  doc_types; omitted, it applies to every doc_type, so every existing configuration is
  unchanged. update_lifecycles resolves each item against the document's doc_type: an
  action scoped away from it is invalid_action, whose known_actions is that doc_type's
  roster, and invalid_lifecycle_transition lists only the valid_actions that doc_type
  carries. A supersession consults the predecessor's rows. The configuration loader
  holds three new invariants, refused on vault create and update_vault_config and
  warned-and-loaded from disk: every listed doc_type is declared in document_types; a
  transition's scope lies within the scope of each state it connects, an unscoped
  transition counting as every doc_type; and the '(new)' ingestion row carries no
  doc_types and lands in an unscoped state. update_metadata refuses a doc_type change
  while the document holds a state scoped away from the new doc_type, with the new
  409 lifecycle_state_not_applicable, detail carrying current_state, doc_type and
  state_doc_types; the family joins ErrorResponse as
  LifecycleStateNotApplicableError. The update_lifecycles, verify_preconditions,
  update_metadata and get_vault_config descriptions state the scoping; dependency
  satisfaction stays a property of the state alone.
for_callers: >-
  Nothing changes for a vault whose lifecycle carries no doc_types. A vault operator
  may now declare a state, and the transitions into and out of it, for one doc_type
  without making them legal on every other. A client driving update_lifecycles should
  read known_actions and valid_actions as the document's own doc_type's answers. A
  client retyping documents through update_metadata may now see
  lifecycle_state_not_applicable, and resolves it by transitioning the document to a
  state the new doc_type holds before retrying. A client decoding ErrorResponse may now
  see the lifecycle_state_not_applicable code, which the extension envelope no longer
  admits.
