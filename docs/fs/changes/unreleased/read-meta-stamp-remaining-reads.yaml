classification: minor
category:
  - capability
  - caller-adaptation
summary: >-
  Every remaining read response on the ordinary surface now carries read_meta
  stamped with server_build and vault_config_fingerprint: verify_preconditions
  (PreconditionResult), traverse (TraverseResponse), chain (ChainResponse),
  list_headings (ListHeadingsResponse), list_pending_metadata
  (PendingMetadataPage), get_filename_metadata (ParseFilenameResponse),
  list_staging_edges, verify_hashes, and the MCP list_directory scan.
  list_vaults, which spans every vault, carries the build and no fingerprint.
  Three REST responses that were a bare array or map become objects so they
  can carry the markers: GET /sage_vaults returns VaultListResponse
  ({vaults, count, read_meta}), GET /sage_vaults/{vault_id}/staging-edges
  returns StagingEdgeListResponse ({items, count, read_meta}), and POST
  /sage_vaults/{vault_id}/hash-check returns HashCheckResponse
  ({matches, read_meta}). The MCP verify_hashes result moves to the same
  {matches, read_meta} shape.
for_callers: >-
  Read the vault list from `vaults`, the staging edges from `items`, and the
  per-hash records from `matches` (REST and the MCP verify_hashes tool alike);
  the bare array and map shapes are gone. Every read that is computed under a
  vault's configuration -- including verify_preconditions, whose `required`
  set follows the vault's satisfies_dependency rules -- now reports the
  configuration fingerprint, so compare it with the value recorded earlier to
  learn that an identical answer may now mean something different.
