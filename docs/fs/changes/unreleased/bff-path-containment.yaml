classification: minor
category: [caller-adaptation]
summary: >-
  The hosted backend-for-frontend contains the paths and headers it handles.
  Its SPA catch-all serves only files that resolve inside the built bundle and
  answers an absolute path, a NUL, or a parent-directory segment with the
  route_not_found envelope (404). Its SAGE reverse proxy rebuilds each upstream
  path from the raw request target, refusing an empty, current- or
  parent-directory segment in any encoding as route_not_found (404) and keeping
  an encoded separator inside its segment, and it forwards and relays headers by
  allowlist rather than denylist. It no longer serves the generated
  /openapi.json, /docs, /docs/oauth2-redirect or /redoc. The SPA's API helpers
  encode every identifier they place in a path. No published specification
  changes: the withdrawn routes and the narrowed proxy inputs were never part of
  cas_app_api.openapi.yaml. Ships without a deprecation under the
  security-exposure exemption.
for_callers: >-
  The hosted application backend no longer serves /openapi.json, /docs or
  /redoc; the operations it hosts remain specified in the published CAS
  Application API specification. Its SAGE proxy refuses paths with empty or
  dot segments and forwards only the Accept, Accept-Language, Content-Type and
  User-Agent request headers. Shipped without a deprecation (security exposure).
exemption:
  kind: security-exposure
  reason: >-
    Serving the old forms keeps reachable a disclosure of files outside the SPA
    bundle, proxied requests outside the SAGE vault API, and third-party
    documentation scripts loaded without integrity checks on the signed-in
    origin.
