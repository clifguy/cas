classification: minor
category: [operator-adaptation]
summary: >-
  Key Vault access is granted per secret rather than vault-wide: the SAGE, BFF
  and API Management identities each hold Key Vault Secrets User on exactly the
  secrets they read, and Certificate User is no longer assigned. API Management
  runs as an identity of its own instead of the SAGE identity. SAGE refuses any
  request that does not carry the ingress key the gateway injects (403,
  http_error), except the liveness probe, so its public container ingress
  admits only the gateway; the key is generated by the secret loader, read by
  the gateway through a Key Vault named value and by SAGE through a Key Vault
  secret reference. A keyVaultSecretsLoaded parameter lets a new tenant's first
  deployment run before its secrets are loaded. The secret loader passes every
  value through a file rather than the command line.
for_callers: >-
  Operators must run the Key Vault secret loader, which now generates the
  gateway ingress key, before deploying this release, and afterwards remove the
  SAGE and BFF identities' old vault-wide Key Vault grants, which a deployment
  does not delete (see the cloud deployment stages runbook). Requests made
  directly to SAGE's container hostname, bypassing the gateway, are refused.
