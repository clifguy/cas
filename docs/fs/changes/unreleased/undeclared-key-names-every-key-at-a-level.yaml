classification: minor
category:
  - capability
summary: >-
  UndeclaredKeyErrorDetail gains a required keys array, published in both REST
  specifications, the packaged error-contract projection and the MCP catalog. An
  undeclared_key refusal now names every undeclared key in the object it locates, sorted,
  where it named one per refusal; key stays and is the first of keys. One object is reported
  per refusal -- the lowest file index, then the lowest depth, on the batch surfaces -- and
  when undeclared keys also sit in another object the message says they are reported once
  this one is repaired. Several keys read as "'<p>.<a>', '<p>.<b>' are not declared keys.";
  a single key's message is unchanged. Where a request body is validated by the framework,
  key is now the first undeclared key in sorted order rather than the first the validator
  lists, which is the order the batch surfaces already used. The refusal holds under
  dry_run, and the MCP batch-item tools carry keys through when they restate an item's
  position. keys is required rather than optional so a client never branches on its
  presence; the contract comparison reads the new required property as caller-adaptation,
  which this release already carries for undeclared_key, a code no release has shipped yet.
for_callers: >-
  A caller that met undeclared_key once per misspelled key can repair every key in the
  named object from one refusal: read detail.keys. detail.key is unchanged in meaning for a
  single key and is the first of detail.keys otherwise.
