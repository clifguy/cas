classification: minor
category:
  - capability
  - caller-adaptation
summary: >-
  GET /sage_vaults/{vault_id}/documents/{document_id} with write_to_path, where the
  server cannot reach the caller's filesystem, now returns the DownloadRecipe the
  operation produces instead of failing response validation with a 500: the route and
  sage_core_api.openapi.yaml declare its 200 response as an anyOf of DocumentWithContent
  and DownloadRecipe, as the ingest operation already declares its upload recipe. The
  Core API and the CAS Application backend also render the errors the framework raises
  outside any operation in the ErrorResponse envelope: route_not_found (404) for a path
  no operation serves, method_not_allowed (405, keeping the Allow header) for a method a
  path does not accept, and internal_error (500) for a response the server built that
  its declared model refuses, which is logged and carries none of the refused value.
  The Core API specification's error-envelope introduction names the three codes. The
  contract comparison now reads a bare schema opposite a one-level anyOf or oneOf as
  the one-branch composition of itself, so a reference wrapped beside a null branch is
  reported as the widening it is rather than as a retarget.
for_callers: >-
  A Core API get_document call with write_to_path against a deployment that cannot see
  the caller's filesystem now returns a download recipe (status download_required)
  where it returned a 500. A request to a path no operation serves, with a method the
  path does not accept, or whose response the server could not build now answers in the
  standard error envelope with code route_not_found (404), method_not_allowed (405) or
  internal_error (500), where it answered with the framework's own body.
