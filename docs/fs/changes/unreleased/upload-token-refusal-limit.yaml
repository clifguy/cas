classification: minor
category:
  - capability
  - caller-adaptation
summary: >-
  An upload token now survives a bounded number of refused deliveries. PUT /upload
  counts each delivery it refuses against the token -- a body over the transfer
  ceiling (413 transfer_content_too_large), bytes not matching a bound digest (400
  source_digest_mismatch), and a body abandoned mid-stream -- and each still stages
  nothing and leaves the token retryable, until the refusal that reaches the limit.
  That one is answered 410 transfer_refusal_limit_reached, with detail carrying
  transfer_id and max_refused_deliveries, and the transfer is reclaimed: its staging
  directory is removed and any later presentation of the token is refused as
  transfer_token_invalid. A failure on the server's side does not count. The limit is
  the new stack configuration key transfer.max_refused_deliveries (integer, default 3,
  minimum 2), fixed on each token at mint. The new error family joins ErrorResponse
  as TransferRefusalLimitReachedError. The upload endpoint's 400, 410 and 413
  descriptions, UploadRecipeItem.token, the sha256 descriptions of IngestRequest and
  SourceFileRestoreRequest, and the ingest_document, bulk_ingest_document and
  restore_vault_source_file tool descriptions state the limit.
for_callers: >-
  A client that retries a refused upload on the same token keeps working for the first
  refusals, as before. Once PUT /upload answers 410 transfer_refusal_limit_reached, the
  token is gone: treat it as a lapsed token and re-issue the originating call for a
  fresh recipe. A client decoding ErrorResponse may now see the
  transfer_refusal_limit_reached code. An operator may raise or lower the limit with
  transfer.max_refused_deliveries; nothing needs changing to keep the default.
