classification: minor
category:
  - capability
summary: >-
  An undeclared_key refusal on a batch item (update_lifecycles, update_metadata,
  create_edges, on both surfaces) redirects a misfiled key and marks aliases.
  detail.see_also names each sibling operation on the same surface that accepts
  an undeclared key, with the key and where it goes there (for example
  lifecycle_status in an update_metadata item points at update_lifecycles
  items[].action), and the message says the same. detail.aliases maps an
  accepted alias to its canonical name, and detail.recognized lists canonical
  names only, so doc_id no longer reads as a field distinct from document_id.
  Both keys are emitted only when non-empty. The redirect is derived from the
  item models' declared fields, aliases and ownership markers; an alias
  redirects to its canonical field, and a name several siblings declare is
  redirected to each.
for_callers: >-
  An undeclared_key detail may now carry see_also (a list of {key, operation,
  location}) and aliases (alias to canonical name). For update_lifecycles and
  update_metadata items, recognized no longer lists doc_id; it appears in
  aliases as doc_id -> document_id and is still accepted. A caller that read
  recognized as the complete accepted set should union it with the keys of
  aliases.
