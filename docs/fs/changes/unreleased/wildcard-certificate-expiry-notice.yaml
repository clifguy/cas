classification: minor
category: [operator-adaptation]
summary: >-
  The cloud deployment now tells the wildcard certificate's owner that it
  depends on the certificate. A new operator script,
  deploy/bootstrap/set-certificate-expiry-notice.sh, adds the given addresses
  to the Key Vault's certificate contacts. It also sets the wildcard-tls
  lifetime action to email them a configurable number of days before expiry
  (default 30). The Key Vault loader requires the contact list and runs the
  script after every certificate import. The cloud preflight gains a
  wildcard_tls_expiry check. It reports the expiry served on both custom
  hostnames, and fails when either is within PREFLIGHT_TLS_EXPIRY_WINDOW_DAYS
  (default 30). No API, schema or tool contract changes.
for_callers: >-
  Operators: deploy/bootstrap/load-key-vault-secrets.sh now requires
  CERT_EXPIRY_CONTACTS, the certificate owner's email addresses. On an existing
  deployment, run deploy/bootstrap/set-certificate-expiry-notice.sh once, so
  the vault emails the owner before the wildcard certificate expires. The
  post-deploy preflight now fails a deploy when the served certificate is
  within 30 days of expiry; to change that window, set
  PREFLIGHT_TLS_EXPIRY_WINDOW_DAYS.
