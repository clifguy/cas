classification: minor
category: [capability]
summary: >-
  Bulk ingest takes a caller-settable `needs_review` on every surface, and each
  file entry may carry `tier3_metadata` and `parsed_metadata.tags`. The MCP tool
  passed no `needs_review` to the batch orchestrator, so it always used the
  service default and the value the Core API batch route already published had
  no counterpart there. `tier3_metadata` is a sibling of `parsed_metadata`
  rather than a key in it, because `parsed_metadata` flattens into the per-file
  request's Tier-1 metadata; it is validated per file against the resolved
  doc_type's `metadata_schema` and a payload that schema rejects is reported as
  that file's `tier3_schema_violation` without failing the batch. `codes` and
  `tags` set the same field, so an entry supplying both is refused once for the
  whole call at `files.<n>.parsed_metadata.tags` through a rule the surfaces
  share. Touches the MCP tool catalog, both OpenAPI specifications and the
  frontend type mirror.
for_callers: >-
  Bulk ingest now accepts `needs_review`, so a caller holding metadata it
  already trusts can commit it as authoritative instead of confirming every
  record afterwards; the default still routes a batch through the
  metadata-review queue. Each file entry may also carry `tier3_metadata` and,
  inside `parsed_metadata`, a `tags` list carried whole so a tag containing a
  comma stays one tag. An entry supplying both `codes` and `tags` is refused.
