classification: minor
category:
  - capability
summary: >-
  Each PreconditionCheck row in a verify_preconditions result now carries the
  target's title and doc_type alongside target_id, both null when actual is "not
  found" (doc_type is also null for a target that has none). The values come
  from the read the check already makes of each target, so no read is added. The
  Core API specification's PreconditionCheck schema and verify_preconditions
  description, the Pydantic model, the MCP tool description and the MCP tool
  catalog change together.
for_callers: >-
  verify_preconditions rows (GET /sage_vaults/{vault_id}/preconditions/{document_id}
  and the verify_preconditions tool) now name each target by title and doc_type,
  so a caller can report a blocked dependency without reading each target; both
  are null when the target is not found.
