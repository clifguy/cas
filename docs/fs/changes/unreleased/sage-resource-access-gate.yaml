classification: minor
category: [caller-adaptation, operator-adaptation]
summary: >-
  The Entra bootstrap enforces the access-group gate at the SAGE resource
  itself: the SAGE service principal requires app-role assignment and the
  access group is assigned to its Sage.Reader role, so a token for the SAGE
  audience is issued only to an assigned principal, whichever client requests
  it. The Sage.Access scope becomes admin-consent-only. The bootstrap now
  selects directory objects by exact display name and stops when a name
  matches more than one object, checks for an existing app-role assignment
  before creating one, stops on any failed call instead of continuing, and
  reuses the registration's live scope and role ids on a re-run. The runbook
  and the REST and Claude Code guides describe the gate as implemented.
for_callers: >-
  Operators re-run the Entra bootstrap on each existing tenant to apply the
  resource gate and admin-only consent; confirm first that the CI deploy
  identity holds its Sage.Reader assignment. After that, only members of the
  deployment's access group obtain a token for SAGE, through the web client,
  the MCP connector, Azure CLI or any other client; a non-member is refused at
  token issuance (AADSTS50105) rather than receiving 403, and an application
  needs the Sage.Reader role before its client-credentials request succeeds.
  Users can no longer consent other applications to Sage.Access themselves.
  Shipped without a deprecation (security exposure).
exemption:
  kind: security-exposure
  reason: >-
    Keeping the old registration lets principals outside the access group
    obtain tokens SAGE accepts, contrary to the access model it documents.
