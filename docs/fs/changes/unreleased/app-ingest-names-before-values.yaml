classification: minor
category:
  - caller-adaptation
summary: >-
  POST /app/ingest refuses an undeclared name in a file entry, or in the parsed_metadata it
  carries, before any value in the request is checked, as POST /documents:batch and the
  bulk_ingest_document tool already did. An entry carrying both an undeclared key and a
  malformed sha256, or a malformed parsed_metadata date, was refused on that route as
  invalid_sha256 or invalid_document_date because the request model lists declared fields
  ahead of extra ones; it is now refused as undeclared_key, located and chosen by the rule
  the other two batch surfaces share. The check runs as a dependency of the route ahead of
  the body's own validation, answers for entry names only, and leaves a body it cannot walk,
  or one naming an undeclared top-level field, to the model's own refusal.
for_callers: >-
  A client of POST /app/ingest that sends an entry with both an undeclared key and a
  malformed value now receives undeclared_key first, on every batch ingest surface; repair
  the named keys, then the value refusal follows if the value is still malformed.
