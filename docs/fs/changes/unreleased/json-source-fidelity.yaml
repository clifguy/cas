classification: minor
category: [capability, caller-adaptation, operator-adaptation]
summary: >-
  Preserve JSON member occurrences and numeric lexemes in projection and native
  evidence. Strict JSON refuses nonstandard NaN and Infinity under the data-integrity
  exemption; existing lossy projections require explicitly authorized reprocessing.
for_callers: >-
  Newly processed JSON preserves duplicate members and exact numeric spelling in
  readable and keyword-indexed passages. NaN and Infinity are refused under the
  data-integrity exemption. Operators must explicitly reprocess selected historical
  records to repair older projections; deployment does not relabel them.
exemption:
  kind: data-integrity
  reason: Permissive nonstandard constants can produce invalid JSON projections.
