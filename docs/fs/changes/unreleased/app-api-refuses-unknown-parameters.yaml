classification: minor
category:
  - caller-adaptation
summary: >-
  The CAS Application API's list_directory (POST /app/scan) and bulk_ingest_document
  (POST /app/ingest) refuse a top-level JSON body field or a query parameter they do not
  declare, where both were previously ignored without a word. The refusal is the
  unknown_parameter envelope the Core API and the MCP surface return, carrying tool (the
  published operation id), rejected_params and valid_params, with status 400; an
  undeclared query parameter is reported ahead of an undeclared body field, and an
  undeclared body field wins over any other validation failure in the same request.
  ScanRequest, IngestRequest, IngestFileItem and ParsedMetadata forbid undeclared
  fields, and cas_app_api.openapi.yaml declares additionalProperties false on each; a
  field undeclared inside a file entry or its parsed_metadata is refused as
  invalid_parameter. ParsedMetadata is closed in scan responses as well, which emit only
  its declared fields, so a scan result posted back into ingest is accepted unchanged.
  Both operations' 400 responses name unknown_parameter. The MCP bulk_ingest_document
  tool likewise refuses an undeclared key in a file entry or in its parsed_metadata as
  invalid_parameter, located at the same path, before any file is delivered or
  ingested; its parsed_metadata still does not require a title. The sign-in routes
  under /app/auth are unchanged.
for_callers: >-
  A request to /app/scan or /app/ingest carrying a body field or query parameter the
  operation does not declare is now refused with 400 unknown_parameter instead of
  running as though the name were absent; detail.valid_params lists the body fields the
  operation accepts, or is empty for a query parameter. An undeclared field inside a
  file entry or its parsed_metadata is refused as invalid_parameter, on /app/ingest and
  on the MCP bulk_ingest_document tool alike. Parsed metadata taken from a scan
  response is accepted by ingest as it is.
