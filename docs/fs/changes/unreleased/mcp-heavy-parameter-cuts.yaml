classification: patch
summary: >-
  Shorten the heaviest MCP parameter descriptions to the text that changes
  how a caller builds a call or reads its result: update_lifecycles.items,
  create_edges.items, update_metadata.items, bulk_ingest_document.files and
  infer_edges, ingest_document.dry_run, and search.query and response_mode.
  Implementation detail and design rationale leave the published text; the
  specification's paired operation descriptions for search, create_edges,
  update_lifecycles, update_metadata and ingest_document are cut to match,
  and DiscoverRequest.response_mode drops its opening framing sentence in
  the request model and the specification alike. The MCP tool catalog is
  regenerated. Documentation only; no parameter, type, default or behaviour
  changes.
for_callers: ""
