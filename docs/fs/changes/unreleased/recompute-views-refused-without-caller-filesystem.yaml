classification: minor
category: [capability, caller-adaptation]
summary: >-
  The view-regeneration operation (recompute_views on the MCP maintenance
  surface; POST /sage_vaults/{vault_id}/refresh-views on the Core API) is
  refused under the cloud profile with caller_filesystem_unavailable (501)
  before the existing views are touched, on both surfaces. The operation
  declares the 501 response, the tool's error family and the ErrorResponse
  x-mcp-tool-errors table list the code, and the operation and tool
  descriptions state the per-profile behavior.
for_callers: >-
  Under the cloud profile, recompute_views and POST refresh-views now answer
  caller_filesystem_unavailable (501) instead of reporting views written onto
  container disk no caller can browse. Enumerate documents by doc_type or
  lifecycle_status with search in catalog mode instead. Under the local
  profile the operation is unchanged.
