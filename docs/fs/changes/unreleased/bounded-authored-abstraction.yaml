classification: minor
category: [capability, caller-adaptation, operator-adaptation]
summary: >-
  Generate descriptions from bounded authored evidence with deterministic selected-text
  and structural-breadth sizing, durable call/input/output reservations and independent
  coverage publication. Add explicit served abstract generation identity. The
  data-integrity exemption withdraws source-wide generation and unverified legacy
  passage reconstruction: those paths can silently attribute sampled or generated
  content to the complete retained source. Legacy configuration keys remain accepted
  with explicit bounded clamps and warnings.
for_callers: >-
  Generated abstracts describe supplied selected evidence, not a full-source assessment.
  Inspect abstraction evidence separately from pipeline outcome and compare its generation
  with served_abstraction_generation when a replacement fails. The data-integrity
  exemption prevents unverified legacy evidence from becoming a generated description;
  reprocess retained source to establish evidence. Existing oversized sizing settings
  remain accepted with bounded clamps and warnings. Operators apply the idempotent
  vault schema migration to add durable abstraction evidence and reservation state.
exemption:
  kind: data-integrity
  reason: >-
    Keeping full-projection generation or unverified legacy passage reconstruction
    alongside bounded evidence would permit descriptions to claim an unchanged source
    scope after provider truncation or to attribute stale/generated content to authored
    evidence. Such wrong-source coverage cannot coexist with trustworthy provenance.
