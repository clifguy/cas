classification: patch
summary: >-
  Publish per-parameter documentation in the MCP input schema for chain,
  search and ingest_document, taken from the matching request-model field
  descriptions, and cut each tool description to 2,048 characters or fewer: no
  Args block, a shorter prose body, and error modes reduced to their codes.
  The tripwire parameter descriptions on search and ingest_document are
  shortened. Rationale citations are dropped from the use_abstract_prefilter
  field and from five IngestRequest field descriptions, on the OpenAPI
  specification and the request models alike. The MCP tool catalog is
  regenerated. Documentation only; no parameter, type, default or behaviour
  changes.
for_callers: ""
