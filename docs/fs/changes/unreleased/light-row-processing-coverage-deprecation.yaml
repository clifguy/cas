classification: minor
category: [capability, caller-adaptation]
summary: >-
  Deprecates the full processing_coverage carried on DocumentSummaryLight, the
  light catalog row that search and list_pending_metadata return. The field is
  still served unchanged and is marked deprecated in the Core API specification.
  The deprecation registry gains a response-field form, judged on the rows a
  response actually carries, so an unset-mode catalog response the inline budget
  degrades to light rows warns too. PendingMetadataPage gains a warnings list to
  carry the warning; search carries it in hints.warnings.
for_callers: >-
  The processing_coverage object on light document rows (search in catalog mode
  with response_mode light, or an unset mode degraded to light, and light
  list_pending_metadata pages) is deprecated. From 2027-01-04 light rows may carry
  a bounded coverage summary in its place. Read the full object with get_document,
  or with response_mode full on a smaller page. Responses carrying light rows now warn so, in
  hints.warnings for search and in the new warnings field for
  list_pending_metadata.
deprecates:
  - surface: sage_core_api
    pointer: components/schemas/DocumentSummaryLight/properties/processing_coverage
    replacement: get_document, or response_mode full on a smaller page, for the full object
    earliest_adaptation: "2027-01-04"
