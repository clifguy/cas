classification: patch
summary: >-
  The restore_vault_source_file description again says what
  record_refreshed and provenance_verified false mean, and names the pair that
  tells whether the record matches (stored_content_hash equal to
  expected_content_hash), so status restored no longer reads as a record that
  matches its copy; the recompute_deferred_vault_abstracts description names
  every per-document outcome value; the paired operation descriptions carry
  the same text. The record_refreshed property no longer states one of the
  two cases its false value covers as its only meaning. The two
  SourceFileRestoreReport properties that qualify its status declare so with
  an x-qualifies-success extension naming the status field, in the
  specification and the response model alike. The restore description drops
  the internal account of why re-ingesting cannot stand in. The MCP tool
  catalog is regenerated. Documentation and annotation only; no parameter,
  type, default or behaviour changes.
for_callers: ""
