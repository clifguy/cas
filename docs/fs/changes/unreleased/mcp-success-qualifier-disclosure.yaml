classification: patch
summary: >-
  The restore_vault_source_file description again says what
  record_refreshed and provenance_verified false mean, so status restored no
  longer reads as a record that matches its copy, and the
  recompute_deferred_vault_abstracts description names every per-document
  outcome value; the paired operation descriptions carry the same text. The
  two SourceFileRestoreReport properties that qualify its status declare so
  with an x-qualifies-success extension naming the status field, in the
  specification and the response model alike. The restore description drops
  the internal account of why re-ingesting cannot stand in. The MCP tool
  catalog is regenerated. Documentation and annotation only; no parameter,
  type, default or behaviour changes.
