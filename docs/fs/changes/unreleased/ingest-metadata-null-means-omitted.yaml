classification: minor
category: [capability]
summary: >-
  A null value inside the single-document ingest's `metadata` is accepted and
  means the key was omitted, on POST /documents and the ingest_document tool.
  It had been refused as invalid_parameter at a location naming one arm of the
  value's type (`metadata.doc_type.str`), where the batch surfaces' per-file
  `parsed_metadata` already accepted a null for the same keys and an optional
  request property's null already meant omission. The chain-inheritance rule
  now counts a key as caller-supplied only when its value is not null, so a
  null `doc_type`, `project` or `authority_scope` on a supersession inherits
  the predecessor's value rather than landing on the derived default. The
  `metadata` property in the Core API specification gains a null arm on its
  values, and its description in both the model and the specification states
  the rule.
for_callers: >-
  A client that serializes absent optional fields as null can now send them
  inside `metadata` on an ingest; each null behaves exactly as leaving the key
  out, including on a supersession, where it inherits the predecessor's
  doc_type, project or authority_scope. This supersedes, within the same
  release, the statement in undeclared-key-names-the-accepted-set.yaml that a
  null value inside `metadata` is refused at the boundary. A top-level argument
  spelled inside `metadata` is still refused as misplaced_top_level_field
  whatever its value.
