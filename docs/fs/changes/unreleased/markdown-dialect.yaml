classification: minor
category:
  - capability
  - caller-adaptation
summary: >-
  The markdown adapter (0.8.0) reads a document in the dialect it was written in,
  GFM or Pandoc Markdown, rather than reading every document as CommonMark. Pandoc
  Markdown rules its tables with dash lines, which CommonMark reads as thematic breaks
  and setext heading underlines, so a Pandoc table's last row and closing rule were
  read as a heading and the rest of the document was sectioned under it. A document
  is read as Pandoc Markdown when the markdown adapter's dialect setting declares it,
  or, unset, when it carries a construct only Pandoc Markdown writes: a column rule
  beside a table row, a grid table, or a title block opening the document, none of
  them counted inside code or front matter. Read as Pandoc Markdown, its simple,
  multiline and grid tables and its title block hold no heading. Any other document
  is read as GFM, which is CommonMark with its tables, and its headings are those
  CommonMark read, with one exception: a pipe table directly followed by a dash rule
  is a table, so its rows are no longer read as a heading. vault_config.schema.json
  gains the dialect property under adapter_defaults, taking gfm or pandoc; any other
  value is refused when the vault config is written, and a per-ingest config naming
  one is refused when the document is projected. The IngestRequest config description
  in sage_core_api.openapi.yaml and the ingest_document description in the MCP tool
  catalog name the setting. The ingest_document description and the adapter_defaults
  entry in vault_config.schema.json stop saying an adapter rejects a config key it
  does not recognize: such a key is ignored, as it always was. recompute_pipeline now
  records the version of the adapter that re-projected a document as its
  adapter_version, which kept the version of the document's last ingestion, and
  the Document adapter_version description says so. No operation, tool,
  parameter or response field is added or removed.
for_callers: >-
  A Pandoc Markdown document no longer lists a table row as a heading, so a cached
  heading path or a section read that addressed one now reads differently. Documents
  indexed before this release keep their old passages until each is re-projected, for
  example with recompute_pipeline, which now also updates the document's
  adapter_version. A dialect can be declared in a vault's
  adapter_defaults, or per ingest in config; a per-ingest declaration is not kept, so
  recompute_pipeline reads the document with the vault's setting or, absent one,
  detects its dialect again.
