classification: minor
category: [capability]
summary: >-
  Full edge rows from search with target="edges" carry created_at, the time the
  edge was written, beside the existing created_by, created_client and
  created_agent provenance. The store already recorded it; the EdgeHit
  projection now passes it through. Light rows are unchanged. The Core OpenAPI
  EdgeHit schema, the search response_mode description and the MCP catalog are
  updated to match.
for_callers: >-
  search with target="edges" and a full response now returns created_at on
  every edge row, so a caller can select the edges drawn since a given time.
  Light rows still carry only the identity columns.
