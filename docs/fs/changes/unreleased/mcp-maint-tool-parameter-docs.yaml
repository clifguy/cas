classification: patch
summary: >-
  Publish per-parameter documentation in the MCP input schema for the
  maintenance tools -- create_vault, export_projection,
  get_default_vault_config, get_vault_config, get_vault_stats, migrate_vault,
  optimize_vault_content_store, recompute_deferred_vault_abstracts,
  recompute_views, reload_vault, restore_vault_source_file,
  update_vault_config, verify_vault_drift, verify_vault_retrieval and
  verify_vault_source_files -- and cut each tool description to 2,048
  characters or fewer: no Args block and compact error-mode lists. Every
  registered tool now fits the description budget. The migrate_vault,
  restore_vault_source_file, recompute_deferred_vault_abstracts and
  verify_vault_source_files operation descriptions are condensed with their
  tool descriptions. The migrate_vault operation no longer claims to apply
  ALTER TABLE migrations or to need other server sessions restarted, and the
  source-file integrity descriptions name the digest the audit compares --
  the retained copy's stored_content_hash, falling back to
  source_content_hash -- in the request model and the specification alike.
  The MCP tool catalog is regenerated. Documentation only;
  no parameter, type, default or behaviour changes.
for_callers: ""
