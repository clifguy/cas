classification: minor
category:
  - caller-adaptation
summary: >-
  A well-formed vault_id naming no registered vault is refused on the same terms on
  both request surfaces (CAS-ADR-052). Every vault-addressed MCP tool now returns the
  vault_not_found envelope the REST surface returns, where it returned unknown_vault with
  no detail; the refusal is one typed error beneath both surfaces. Its detail now carries
  available_vaults, the sorted ids of the registered vaults, beside vault_id, and its
  message names them, on every Core API and CAS Application API operation as on the MCP
  tools. Every vault-addressed tool's description in the MCP tool catalog declares
  vault_not_found (404), which seven named as unknown_vault and twenty did not name. Every
  vault-scoped operation in sage_core_api.openapi.yaml and cas_app_api.openapi.yaml now
  declares vault_not_found and detail.available_vaults in its 404 response, where
  twenty-eight described the case loosely as a vault not found or omitted it. The
  update_staging_edge tool now refuses an action other than confirm or dismiss as
  invalid_action (400) with detail.attempted_action and detail.known_actions, as its
  description already declared, where it returned internal_error. No operation, tool,
  parameter or response field is added or removed.
for_callers: >-
  An MCP tool called with an unregistered vault_id now returns error vault_not_found
  rather than unknown_vault, so a caller matching unknown_vault must match vault_not_found
  instead. On both surfaces the refusal's detail carries vault_id and available_vaults,
  the registered vault ids, and a REST caller reading the message sees them listed.
  update_staging_edge returns invalid_action rather than internal_error for an unknown
  action.
