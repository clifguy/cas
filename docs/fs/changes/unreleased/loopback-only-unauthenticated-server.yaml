classification: minor
category: [caller-adaptation, operator-adaptation]
summary: >-
  A server running without authentication now admits only same-machine,
  same-site requests: every surface, REST and each MCP mount alike, refuses a
  request whose Host is not 127.0.0.1, localhost or [::1], or that carries a
  non-loopback Origin or Sec-Fetch-Site cross-site, with 403 and the http_error
  envelope. The guard is absent when authentication is enabled. python -m sage
  refuses a non-loopback --host while authentication is disabled unless
  --allow-unauthenticated-network is passed, and the cloud profile refuses to
  start without an enabled auth block. An unexpected exception in an MCP tool
  call now returns internal_error with a reference instead of the exception's
  text, and a rejected bearer token's challenge carries a fixed description.
for_callers: >-
  Without authentication, SAGE answers only requests addressed to a loopback
  host from this machine; a request by another host name, or from a web page on
  another site, is refused with 403 http_error. Operators who bind a
  non-loopback interface without authentication must pass
  --allow-unauthenticated-network, and a cloud-profile configuration must enable
  authentication to start. MCP internal errors no longer carry exception text;
  the message names a reference to look up in the server log.
