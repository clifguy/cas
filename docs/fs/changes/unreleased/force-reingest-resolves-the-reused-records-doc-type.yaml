classification: minor
category:
  - capability
summary: >-
  A force re-ingest that names no doc_type now resolves the doc_type it validates and
  reports from the record it reuses, the one it already wrote. The ingest dry run reported
  IngestPreview.resolved_doc_type as it would for a new document, falling through to the
  predecessor or misc, and both the preview and the real run checked tier3_metadata against
  that value, so a payload valid for the reused record's doc_type was refused as
  tier3_schema_violation. Both paths now read one resolution -- caller, filename parse, the
  reused record (the pinned one under a document_id pin), predecessor, misc -- which also
  feeds the preview's retype guard. On a force re-ingest the tier3 check therefore runs once
  the reused record is known, after the identical-content, pin and path checks rather than
  before them. The upload-first dry run, which has no bytes to hash, finds the reused record
  through the document_id pin or the declared sha256; with neither, and no doc_type named,
  it leaves the tier3 check to the call that delivers the bytes and omits tier3_metadata from
  the leg's dry_run_validated rather than checking against a doc_type the write would not
  carry. With a declared sha256 it also holds a force pin to that digest as the run holds it
  to the delivered hash, so a pin naming no document or another document's bytes is refused
  as force_reingest_pin_mismatch before the upload rather than after it, and the leg's
  dry_run_validated names that check as force_pin, a new DryRunValidator value. The descriptions of
  IngestPreview.resolved_doc_type and DocTypeRequirements.is_declared (in both
  specifications), of IngestRequest.metadata, and of
  the upload leg's dry_run_validated name the added rung and the deferred check.
for_callers: >-
  A force re-ingest that names no doc_type now validates tier3_metadata against, and
  previews resolved_doc_type as, the doc_type of the record it reuses, so a payload valid for
  that record is no longer refused. An upload-first ingest dry run that declares sha256 and
  pins a force re-ingest with document_id now refuses a pin the digest rules out before the
  upload, and reports the check in the leg's dry_run_validated as the new value force_pin;
  a client matching dry_run_validated against a closed list should admit it.
