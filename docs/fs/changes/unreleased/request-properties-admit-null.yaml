classification: patch
summary: >-
  Every optional request property whose derived model accepts an explicit null now
  declares a null arm in its specification, so the published contract states the
  request the surface already accepts: forty-seven properties in
  sage_core_api.openapi.yaml, among them IngestRequest.config and created_by, every
  optional member of RetrievalFilters, UpdateMetadataRequest, BulkMetadataItem and
  BulkLifecycleItem, the optional DiscoverRequest selectors, TraverseRequest.edge_type,
  ListFieldPatch, Tier3Patch, SetLifecycleRequest.successor_id,
  SourceFileIntegrityRequest.document_ids and BatchIngestFileMetadata.parsed_metadata,
  and IngestFileItem.parsed_metadata in cas_app_api.openapi.yaml. A null on an optional
  request property means the same as leaving it out. SetLifecycleResponse.warnings
  gains the same arm, matching its model. A property previously declared as a bare
  reference is now an anyOf of that reference and null, carrying the description its
  model states. The rule is recorded beside the response rule in docs/fs/CLAUDE.md, and
  a gate compares every model field's nullability with its property's, request and
  response components alike, in both directions.
detector_override:
  reason: >-
    Every null-arm finding declares behaviour the server already had. The
    type-widened findings are null arms added to a type, and the branch-added findings
    under components are null branches added beside a reference. Each of these request
    models accepted an explicit null before the change and treated it as the property's
    absence, so a caller that sent null was already served and a caller that omits the
    property is unaffected. No request is accepted, refused or interpreted differently.
    The branch added to the get_document 200 response is not one of these; its own
    record classifies it.
