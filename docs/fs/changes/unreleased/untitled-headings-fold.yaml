classification: minor
category:
  - caller-adaptation
  - operator-adaptation
summary: >-
  A heading with no text is no longer a heading. The markdown (0.7.0), docx (0.6.0)
  and PDF (0.7.0) adapters read a heading whose text was empty or only whitespace as a
  heading, so its path was the empty heading path that addresses text under no
  heading, or carried an empty segment. A document with text before its first heading
  and such a heading stored both at the empty path, and read_section with an empty
  heading_path returned both. Each adapter now drops the heading and keeps its content
  in the section before it, or in the text before the first heading when no named
  heading precedes it. A heading nested under it attaches to the nearest named
  ancestor. A docx heading carrying a list number is titled by that number and stays a
  heading. A PDF outline entry with no title is dropped rather than titled with its
  object representation, and an outline made only of such entries is treated as no
  outline. migrate_vault's store_text_before_first_heading backfill now also
  re-projects documents whose stored passages hold such a heading: a path with an
  empty segment, or an empty path that sits beside other paths from an adapter older
  than the text before the first heading, or whose section opens with a bare heading
  mark. A document whose empty path is its text under no heading is still not read.
  Descriptions change in sage_core_api.openapi.yaml and the MCP tool catalog:
  list_headings says a heading with no text is not listed, and migrate_vault names the
  documents the backfill now moves. No operation, tool, parameter or response field is
  added or removed.
for_callers: >-
  A heading with no text is no longer listed by list_headings, and no path contains an
  empty segment. The text under such a heading is read in the section before it, so
  read_section with an empty heading_path returns only the text before the document's
  first named heading. A cached path that addressed such a heading, or a section read
  that included its text, now reads differently. Documents indexed before this release
  keep the old addresses until an operator runs migrate_vault on each vault, which
  re-reads the affected sources and reports store_text_before_first_heading in
  backfills_applied.
