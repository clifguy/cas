classification: patch
summary: >-
  Publish per-parameter documentation in the MCP input schema for the read
  tools -- get_document, get_filename_metadata, list_directory, list_headings,
  list_pending_metadata, list_staging_edges, read_projection, read_section,
  traverse, verify_hashes and verify_preconditions -- and cut each tool
  description to 2,048 characters or fewer: no Args block and compact
  error-mode lists. get_filename_metadata now names the registered source
  types rather than formats with no adapter. traverse and chain now name the
  edge types their edge_type parameter accepts. The verify_preconditions
  operation description is condensed with its tool description, and a
  rationale citation is dropped from the TraverseRequest debug field
  description, on the OpenAPI specification and the request model alike. The
  MCP tool catalog is regenerated. Documentation only; no parameter, type,
  default or behaviour changes.
for_callers: ""
