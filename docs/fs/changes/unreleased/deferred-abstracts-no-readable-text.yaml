classification: minor
category: [capability, caller-adaptation]
summary: >-
  recompute_deferred_vault_abstracts no longer dispatches a document whose
  recorded coverage marks its projection empty_readable_projection. Such a
  document is reported with the new ReabstractOutcome member no_readable_text
  (SSE status skipped, no error or elapsed time), counted in the new
  no_readable_text_count on ReabstractReport and ReabstractSummaryEvent, and
  excluded from failed_count. Previously every sweep dispatched it, the
  dispatch was refused for want of passages, and it was reported as
  dispatch_failed on every pass. The decision reads the same coverage
  limitation ingestion records, through one shared predicate. Documents
  without that coverage mark keep the earlier path. The out-of-band bulk sweep
  is unchanged and always reports a zero count. sage_core_api.openapi.yaml,
  the Pydantic models, the MCP tool description and catalog, and the CAS
  Application types and maintenance panel change together. The
  caller-adaptation category is an author judgment the comparison cannot see:
  failed_count and dispatch_failed stop covering these documents. No
  deprecation precedes it because the two classifications of one document
  cannot be served side by side; the new count is optional with a default of
  zero, so no required response key is added.
for_callers: >-
  The deferred-abstract sweep reports documents with no readable text as
  no_readable_text, counted in a new no_readable_text_count, instead of as
  dispatch_failed; they no longer count toward failed_count. A caller that
  switches exhaustively on the reabstract outcome must handle the new value.
