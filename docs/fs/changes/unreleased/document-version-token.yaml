classification: minor
category: [capability, caller-adaptation]
summary: >-
  Documents carry a version_token, returned on every read, that a metadata
  patch, a lifecycle transition, a supersede or a content replacement advances
  and pipeline work does not. update_metadata's expected_version and
  ingest_document's expected_head_version compare against it, so a token read
  while a document is still being indexed or abstracted stays valid. The
  earlier token, a timestamp compared with updated_at, is still accepted with
  its earlier comparison and is deprecated: a call using it is warned in
  ingest_document's warnings or in the update_metadata item's warnings. The
  ingest and recompute descriptions now say what is usable as soon as the call
  returns. The change-record gate accepts a deprecated value format, addressed
  as .../format/<name>.
for_callers: >-
  Read version_token from get_document and pass it as expected_version or
  expected_head_version; pipeline work no longer invalidates it. An updated_at
  timestamp is still accepted as before but is deprecated, draws a warning, and
  may stop being accepted from 2026-12-01. A document can be read, patched,
  linked and superseded as soon as ingest_document returns; only passage search
  and the semantic abstract wait on the background stages.
deprecates:
  - surface: sage_core_api
    pointer: components/schemas/IngestRequest/properties/expected_head_version/format/timestamp
    replacement: the predecessor's version_token
    earliest_adaptation: "2026-12-01"
  - surface: sage_core_api
    pointer: components/schemas/UpdateMetadataRequest/properties/expected_version/format/timestamp
    replacement: the document's version_token
    earliest_adaptation: "2026-12-01"
  - surface: sage_core_api
    pointer: components/schemas/BulkMetadataItem/properties/expected_version/format/timestamp
    replacement: the document's version_token
    earliest_adaptation: "2026-12-01"
  - surface: mcp
    pointer: sage/ingest_document/inputSchema/properties/expected_head_version/format/timestamp
    replacement: the predecessor's version_token
    earliest_adaptation: "2026-12-01"
  - surface: mcp
    pointer: sage/update_metadata/inputSchema/properties/items/items/properties/expected_version/format/timestamp
    replacement: the document's version_token
    earliest_adaptation: "2026-12-01"
