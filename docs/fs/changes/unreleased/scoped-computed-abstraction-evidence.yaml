classification: minor
category: [capability]
summary: >-
  Bounded abstraction may describe explicitly supplied deterministic observations
  with their inspected scope and exactness. Preserve the authored attestation
  baseline independently of added observations and retain existing repair limits.
for_callers: >-
  Generated discovery descriptions may include scoped SAGE-computed measurements.
  Measurements and descriptions remain derived and cannot independently admit a
  search result; successful generation does not establish factual correctness.
