classification: patch
summary: >-
  SAGE's raw document content route and transfer download route add
  X-Content-Type-Options: nosniff and Content-Security-Policy: sandbox to the
  attachment disposition they already sent; the Core API specification's
  descriptions of both routes say so. The hosted backend-for-frontend sends a
  page content-security policy (report-only unless enabled), nosniff, a
  no-referrer policy and frame protection on every response, and
  Strict-Transport-Security under the cloud profile; it relays SAGE's two
  delivery headers on proxied document bytes. The local development server
  refuses framing. No request, response body, status or error code changes,
  and no caller has to adapt: the bytes were already delivered as an
  attachment.
for_callers: ""
