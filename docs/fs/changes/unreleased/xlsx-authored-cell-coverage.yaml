classification: minor
category: [capability, caller-adaptation, operator-adaptation]
summary: >-
  Full sparse authored-cell XLSX projection and keyword coverage replace preview-only
  canonical content under the data-integrity exemption. A nullable passage keyword
  evidence column separates generated orientation and unverified formula caches
  from authored matches; existing vault keyword vectors require migration.
for_callers: >-
  XLSX projection includes all supported authored cells by default, including hidden
  sheets and distant sparse cells; preview_rows remains accepted but no longer truncates
  canonical reads. This immediate correction uses the data-integrity exemption because
  preview-only reads silently omitted authored data. max_sheets remains an explicit
  limited-coverage cap. Operators must run migrate_vault to rebuild existing keyword
  vectors before processing new XLSX projections; this does not reprocess historical
  preview records, which require an explicit reprocessing decision.
exemption:
  kind: data-integrity
  reason: Preview-only canonical reads silently omitted authored cells and could substitute formula caches for authored formulas.
