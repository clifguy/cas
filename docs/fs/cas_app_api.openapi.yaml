# =============================================================================
# CAS Application API — OpenAPI Specification
# =============================================================================
#
# Formal Substrate artifact for CAS (Clif's Agentic System).
# Target path: ~/repos/cas/docs/fs/cas_app_api.openapi.yaml
#
# Source authority: CAS Application Spec, maintained in the CAS SAGE vault
# (see docs/ref/README.md for vault access).
#
# This specification defines the HTTP surface of the CAS Application
# backend. Routes are mounted under the /app prefix to keep the CAS
# Application surface architecturally distinct from the SAGE Core API
# (sage_core_api.openapi.yaml). The two specs are validated together
# by tests/sage/test_openapi_conformance.py.
#
# Scope: workflow tools that wrap SAGE Core operations with UI-oriented
# behaviors (filename parsing, batch ingestion with edge inference,
# directory scans). Does NOT define MCP tool schemas; those are derived
# by the MCP adapter layer.
#
# Architectural invariants:
#   - Vault scoping: every mutating operation includes vault_id in
#     the request body and resolves it against the running registry.
#   - SSE for long operations: batch ingestion streams progress events
#     so the UI can render per-file status during the run.
#
# Related artifacts:
#   - SAGE Core API: docs/fs/sage/sage_core_api.openapi.yaml
#   - Vault config schema: docs/fs/sage/vault_config.schema.json
# =============================================================================

openapi: "3.1.0"

info:
  title: CAS Application API
  version: "2.5"
  description: >-
    HTTP API for the CAS Application backend. Provides workflow tools
    (directory scan, batch ingest with two-phase edge inference) that
    wrap SAGE Core operations behind UI-oriented entry points, mounted at
    the /app prefix. The server that hosts the SAGE Core API serves them,
    walking its own filesystem, under every profile, authenticated as the
    Core API is. A hosted deployment also serves them from the separate
    backend-for-frontend its single-page app is reached through; that
    process shares no filesystem with SAGE, so there the directory scan and
    path-based ingest answer 501 and file content is uploaded to the SAGE
    Core API's batch-ingest endpoint instead.
  contact:
    name: CAS Project
  license:
    name: Proprietary

servers:
  - url: https://cas.{baseDomain}
    description: >-
      A deployed CAS Application edge. Each deployment owns its own domain and
      Entra tenant, so `baseDomain` selects the target deployment.
    variables:
      baseDomain:
        default: cor.org
        description: Owned base domain of the target deployment.
  - url: http://localhost:8000
    description: Local profile (FastAPI).

# No `securitySchemes` block, and no operation-level `security`. A hosted
# deployment's backend-for-frontend requires the `cas_session` cookie opened by
# the OIDC callback on `/app/scan` and `/app/ingest`, and refuses a request without a signed-in
# session with `auth_required` 401 before its parameters are bound or refused, so
# the refusal is the same whatever the request carries; the server hosting the
# SAGE Core API authenticates these routes as it does the Core API, and the local
# profile carries no identity and requires nothing. The cookie also
# governs on-behalf-of access to the SAGE Core API through the proxy routes --
# which are the SAGE Core API's own surface and are specified there, not here.
# The cookie is expressible as an `apiKey` scheme `in: cookie`; it is not
# declared because this one document also specifies the local profile, which
# requires it on no operation, so the asymmetry with the SAGE Core API spec
# (which declares a bearer scheme on every operation) is accurate rather than an
# omission.

# Tag declarations for the groups the operations below reference. The server
# that hosts these routes also hosts the SAGE Core API and publishes both as one
# schema document, so a tag used here but declared nowhere would reach a caller
# as a bare group label.
tags:
  - name: Scan
    description: >-
      Filesystem directory listing with per-file ingest status and parsed
      filename metadata.
  - name: Ingest
    description: >-
      Batch file ingestion with two-phase edge inference and streamed progress.
  - name: Auth
    description: >-
      Browser sign-in against the deployment's identity provider, and the
      cookie-backed session it opens.

# =============================================================================
# Paths
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # Directory scan
  # ---------------------------------------------------------------------------

  /app/scan:
    post:
      operationId: list_directory
      summary: Scan a filesystem directory and return file status with parsed metadata.
      description: >-
        Walks a directory (optionally bounded by max_depth), classifies each
        file by file extension against the vault's registered source
        adapters, parses filename metadata using the vault's configured
        filename_extraction rules, hashes file contents with SHA-256, and
        cross-references against the vault's graph store to determine
        per-file ingestion status.


        Status values returned per file:

        - **new**: hash is unknown to the vault; eligible for ingestion.

        - **modified**: source_path is known but content hash differs.

        - **unchanged**: source_path and content hash both match an
          existing document.

        - **no_adapter**: no registered adapter handles this extension.


        Used by the Ingest view to preview a directory before triggering
        batch ingestion.
      tags: [Scan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "400":
          description: >-
            `invalid_directory`: `directory` does not exist or is not
            readable.

            `invalid_vault_id`: a vault id in the request is not
            well-formed.

            `unknown_parameter`: the request carries a body field or query
            parameter the operation does not declare.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            `auth_required`: a hosted deployment's backend-for-frontend
            received the request without a signed-in session. Sign in and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `vault_not_found`: no vault registered with that id;
            `detail.available_vaults` lists the registered vaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: >-
            `local_profile_only`: a hosted deployment's backend-for-frontend
            received the request.
            Its backend shares no filesystem with SAGE, so it cannot walk a
            directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `auth_not_configured`: a hosted deployment's backend-for-frontend
            received the request, and interactive sign-in is not configured for
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Batch ingest with SSE streaming
  # ---------------------------------------------------------------------------

  /app/ingest:
    post:
      operationId: bulk_ingest_document
      summary: Ingest a batch of files with two-phase edge inference, streamed via Server-Sent Events.
      description: >-
        Three-phase pipeline:


        - Phase 1: build the edge plan from the supplied parsed_metadata
          and the existing vault graph (version_chain Tier 1 supersedes,
          filename_code_match Tier 2 covers).

        - Phase 2: per-file sequential ingestion with metadata application
          and per-file error isolation (one failure does not abort the
          batch).

        - Phase 3: post-ingest edge resolution -- Tier 1 via link(),
          Tier 2 via staging_edges insertion. Planned edges can be dropped
          rather than created: edges referencing failed-ingest files, and
          Tier-1 supersessions refused because the target cannot be read,
          does not exist, or is in a lifecycle state that does not permit
          the transition. Drops are counted in the summary's
          `edges_dropped` and reported per edge in `edge_warnings`
          (EdgeWarning entries).


        Response is `text/event-stream` with two event types:


        - `progress` events emitted on file start, completion, and error,
          carrying file_index, total_files, filename, stage, status, and
          (on success) document_id or (on error) error message.

        - `summary` event emitted once at the end, carrying the
          batch summary (counts of new docs, edges created/staged/
          dropped, metadata pending, abstracts generated/deferred, per-file
          errors as BatchIngestFileError entries -- a typed SAGE error
          carrying its code and detail -- and edge warnings when any were
          produced).


        Divergence from `ingest_document`: `needs_review` defaults to
        true here and false there, so a batch is a confirmation-queue feeder
        unless the caller says otherwise. The value is the caller's on both and
        only the default differs: the batch flow exists to surface inferred
        values for review, so callers curate metadata up-front and a human or
        follow-up agent confirms each record via `update_metadata`.
        A caller holding metadata it already trusts passes `needs_review=false`
        and the documents land at `metadata_confirmed=true` with no queue entry
        and no second call. While `needs_review=true`, the vault's filename
        parsing runs and may populate `date`, `project`, `codes`, `version`,
        and `doc_type` from the filename when the caller omits them from
        `parsed_metadata` (the exact fields are vault-config-defined under
        `metadata_extraction.filename_extraction.segment_fields`).


        A failure of the batch itself, which can only surface after the 200
        is committed, ends the stream: it emits no further events -- there is
        no `error` event variant -- and closes the connection without a
        `summary`. A stream that ends without one did not complete, and the
        cause is logged server-side rather than sent. Clients should treat
        the `summary` event, not the end of the stream, as the completion
        signal.


        See ScanResponse for how files are first classified before being
        passed to this endpoint.
      tags: [Ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Server-Sent Event stream of progress and summary events.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE stream. Each event is a `data:` line with a JSON
                  payload conforming to ProgressEvent or SummaryEvent.
                  See components.schemas.ProgressEvent and
                  components.schemas.SummaryEvent.
        "400":
          description: >-
            `empty_file_list`: `files` was empty. Choose at least one file
            or skip the call.

            `invalid_vault_id`: a vault id in the request is not
            well-formed.

            `invalid_sha256`: a file digest is not a well-formed content hash;
            `detail` locates it at `files.<index>.sha256`. Refused before any ingestion.

            `invalid_document_date`: a document date in the request is not
            a well-formed calendar date (`YYYY-MM-DD`).

            `unknown_parameter`: the request carries a body field or query
            parameter the operation does not declare.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            `auth_required`: a hosted deployment's backend-for-frontend
            received the request without a signed-in session. Sign in and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            `vault_not_found`: no vault registered with that id;
            `detail.available_vaults` lists the registered vaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: >-
            `local_profile_only`: a hosted deployment's backend-for-frontend
            received the request.
            Its backend shares no filesystem with SAGE, so it cannot read files
            by path; upload their content to the SAGE Core API's batch-ingest
            endpoint instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            `auth_not_configured`: a hosted deployment's backend-for-frontend
            received the request, and interactive sign-in is not configured for
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Interactive sign-in (backend-for-frontend)
  #
  # The OIDC redirect callback (GET /app/auth/callback) is a browser-facing
  # redirect mechanism, not a documented JSON API operation, so it is excluded
  # from this surface (include_in_schema=False on the route; allowlisted in the
  # OpenAPI conformance gate's infra-paths).
  # ---------------------------------------------------------------------------

  /app/auth/login:
    get:
      operationId: begin_login
      summary: Begin interactive sign-in and return the identity-provider authorization URL.
      description: >-
        Starts the confidential-client authorization-code flow and returns the
        identity-provider authorization URL the single-page app navigates the
        browser to. A short-lived pre-login record is held server-side so the
        callback can validate the round-trip; no tokens are issued to the
        browser here. Available only when the deployment is configured for
        interactive auth; otherwise returns 503 `auth_not_configured`.
      tags: [Auth]
      responses:
        "200":
          description: The authorization URL and anti-forgery state to begin sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeResponse"
        "503":
          description: >-
            `auth_not_configured`: interactive sign-in is not configured for
            this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /app/auth/me:
    get:
      operationId: get_session
      summary: Report whether the caller has a live session.
      description: >-
        Reads the session cookie and reports whether it resolves to a live
        server-side session, returning the signed-in user's identity claims
        when it does. Used by the single-page app to decide whether to render
        the signed-in experience or send the user to sign in. Available only
        when the deployment is configured for interactive auth; otherwise
        returns 503 `auth_not_configured`.
      tags: [Auth]
      responses:
        "200":
          description: The caller's session state and, when present, their identity claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfoResponse"
        "503":
          description: >-
            `auth_not_configured`: interactive sign-in is not configured for
            this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /app/auth/logout:
    post:
      operationId: end_session
      summary: End the session and clear the session cookie.
      description: >-
        Deletes the caller's server-side session and clears the session cookie.
        Idempotent: returns 204 whether or not a live session was present.
        Available only when the deployment is configured for interactive auth;
        otherwise returns 503 `auth_not_configured`.
      tags: [Auth]
      responses:
        "204":
          description: The session was ended and the cookie cleared.
        "503":
          description: >-
            `auth_not_configured`: interactive sign-in is not configured for
            this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# =============================================================================
# Components
# =============================================================================

components:

  schemas:

    # -------------------------------------------------------------------------
    # Scan
    # -------------------------------------------------------------------------

    ScanRequest:
      type: object
      additionalProperties: false
      required: [vault_id, directory]
      description: Request body for the directory-scan endpoint.
      properties:
        vault_id:
          type: string
          description: Target vault identifier.
        directory:
          type: string
          description: >-
            Absolute or user-relative directory path. Surrounding single
            or double quotes are stripped to tolerate paste-with-quotes
            from terminals or finder.
        max_depth:
          type: [integer, "null"]
          minimum: 0
          description: >-
            Optional recursion ceiling. 0 = scan the directory root only,
            1 = root plus one subdirectory level, etc. Null = the server's
            default depth ceiling; a scan cut by that default is reported
            as truncated.

    ScanResponse:
      type: object
      required: [files, warnings]
      description: Response body for the directory-scan endpoint; lists per-file scan results and any non-fatal warnings.
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ScanResultResponse"
          description: Per-file scan results in directory-walk order.
        warnings:
          type: array
          items:
            type: string
          description: >-
            Non-fatal scan warnings (e.g. unreadable file, malformed
            symlink). Files that produced warnings may also appear in
            files[] with status "no_adapter" or be omitted depending on
            the warning class.
        truncated:
          type: boolean
          description: >-
            True when a scan ceiling (file count, hashed bytes, or the
            default depth) cut the walk short; the warnings list names
            the ceiling that fired.

    ScanResultResponse:
      type: object
      required: [file_path, file_hash, source_modified_at, parsed_metadata, sage_status]
      description: One per-file result inside a scan response; carries identity, parsed metadata, and the vault-relative ingestion status.
      properties:
        file_path:
          type: string
          description: Absolute file path on disk.
        file_hash:
          type: string
          description: SHA-256 hex digest of file contents.
        source_modified_at:
          type: string
          format: date-time
          description: File mtime (st_mtime) as an ISO 8601 timestamp.
        source_type:
          type: [string, "null"]
          description: >-
            Source artifact format matching this extension, or null
            when no registered adapter handles the extension.
        parsed_metadata:
          $ref: "#/components/schemas/ParsedMetadata"
        sage_status:
          type: string
          enum: [new, modified, unchanged, no_adapter]
          description: Vault-relative status for this file. See operation description.

    ParsedMetadata:
      type: object
      additionalProperties: false
      required: [title]
      description: Filename-derived metadata for one file; surfaced inside scan results and used as caller-authoritative input to ingest.
      properties:
        title:
          type: string
          description: Human-readable title extracted from the filename or content.
        date:
          type: [string, "null"]
          format: date
          description: Document calendar date (YYYY-MM-DD) extracted from filename.
        project:
          type: [string, "null"]
          description: >-
            Project identifier extracted from filename when the vault's
            project_identifier rule matches a segment.
        codes:
          type: array
          items:
            type: string
          description: >-
            Code identifiers extracted from filename via known_code_patterns
            (e.g. "PV07", "CD-2"). Order preserved from the filename.
        version:
          type: [string, "null"]
          description: Canonical version label (e.g. "v1.2.0", "v3.0").
        doc_type:
          type: [string, "null"]
          description: >-
            Document type resolved by the vault's keyword_to_doc_type and
            code_to_doc_type rules. Null if no rule matches.
        tags:
          type: array
          items:
            type: string
          description: >-
            Tags for the document, in order, each carried whole: a tag that
            contains a comma stays one tag. `codes` sets the same field, so an
            entry supplying both is refused at
            `files.<n>.parsed_metadata.tags` before any file is ingested.

    # -------------------------------------------------------------------------
    # Ingest
    # -------------------------------------------------------------------------

    IngestRequest:
      type: object
      additionalProperties: false
      required: [vault_id, files]
      description: Request body for the batch-ingest endpoint; identifies the target vault and the files to ingest with optional edge inference.
      properties:
        vault_id:
          type: string
          description: Target vault identifier.
        files:
          type: array
          items:
            $ref: "#/components/schemas/IngestFileItem"
          description: Files to ingest. Empty list returns 400.
        infer_edges:
          type: boolean
          default: true
          description: >-
            When true, the post-ingest phase runs version_chain (Tier 1
            supersedes) and filename_code_match (Tier 2 covers) edge
            inference. When false, edges are not inferred; ingestion is
            otherwise unchanged.
        needs_review:
          type: boolean
          default: true
          description: >-
            When true (default), every document in the batch lands with
            metadata_confirmed=false in the metadata-review queue
            (CAS-ADR-021). When false, caller-supplied metadata is committed
            as authoritative.
        dry_run:
          type: boolean
          default: false
          description: >-
            When true, evaluate every file and report one preview or
            one refusal per entry without persisting anything. No
            source is retained, no projection, indexing or abstraction
            runs, no record is written, and edge inference does not
            run whatever `infer_edges` says. Items are evaluated
            against committed state as it stood at batch start, so a
            sequential dependency within one batch is not reflected:
            two entries carrying identical bytes each report no
            duplicate.

    IngestFileItem:
      type: object
      additionalProperties: false
      required: [file_path, source_type]
      description: One file entry in a batch-ingest request; pairs a path with its source_type and optional caller-supplied parsed metadata.
      properties:
        file_path:
          type: string
          description: Absolute file path on disk.
        source_type:
          type: string
          description: Source artifact format name to use for this file.
        sha256:
          type: [string, "null"]
          description: >-
            Optional SHA-256 of this file, as 64 hex characters in
            either case, bare or `sha256:`-prefixed. Checked before
            retention, including dry runs. A mismatch is a per-file
            `source_digest_mismatch`; a malformed string refuses the
            request with 400 `invalid_sha256` at `files.<index>.sha256`.
            Omission or null leaves the digest undeclared.
        parsed_metadata:
          anyOf:
            - $ref: "#/components/schemas/ParsedMetadata"
            - type: "null"
          description: >-
            Optional caller-supplied parsed metadata for this file; when
            present, used as caller-authoritative input to ingest.
        tier3_metadata:
          type: [object, "null"]
          description: >-
            Optional Tier-3 metadata for this file, validated against the
            `metadata_schema` the vault config declares for the file's
            resolved doc_type (CAS-ADR-028). A payload the schema rejects, or
            any payload for a doc_type declaring no schema, is reported for
            that file as `tier3_schema_violation` and leaves the rest of the
            batch to run. A sibling of `parsed_metadata`, not a key in it:
            `parsed_metadata` carries the Tier-1 fields a filename parser can
            supply, and Tier-3 metadata never comes from a filename.

    ProgressEvent:
      type: object
      description: >-
        SSE `progress` event payload. Emitted on file start, completion,
        and error during the per-file ingestion phase.
      required: [event_type, file_index, total_files, filename, stage, status]
      properties:
        event_type:
          type: string
          enum: [progress]
          description: Discriminator for the SSE event payload variant; always 'progress'.
        file_index:
          type: integer
          minimum: 0
          description: Zero-based index of this file in the batch.
        total_files:
          type: integer
          description: Total file count in the batch.
        filename:
          type: string
          description: Filename this progress event refers to.
        stage:
          type: string
          enum: [projection]
          description: Pipeline stage the event applies to.
        status:
          type: string
          enum: [started, completed, failed]
          description: Per-file processing status the event reports.
        document_id:
          type: [string, "null"]
          description: Set when status="completed". Document ID assigned by SAGE.
        error:
          type: [string, "null"]
          description: Set when status="failed". Caller-facing error message.

    BatchIngestFileError:
      type: object
      description: >-
        One per-file failure recorded during a batch ingest. Every entry
        carries the message-only shape; a failure that was a typed SAGE error
        additionally carries its code and detail, so a caller can branch on
        the code and read the same payload the single-document ingest surface
        returns for that error.
      required: [file_index, filename, source_path, message]
      properties:
        file_index:
          type: integer
          minimum: 0
          description: >-
            Zero-based position of the file in the batch, the same index the
            `progress` events report. Distinguishes two failures whose
            `filename` and `source_path` coincide, as two same-named uploads
            do.
        filename:
          type: string
          description: Basename of the file as staged for ingestion.
        source_path:
          type: string
          description: >-
            The file as the caller named it: the path or filename the caller
            supplied, never a server-side resolved or staging location.
            Distinguishes two failures whose staged basenames coincide.
        message:
          type: string
          description: >-
            Human-readable error text. For a typed SAGE error this is the
            error's own message; otherwise the rendered exception.
        code:
          type: [string, "null"]
          description: >-
            Machine-readable error code, present only when the failure was a
            typed SAGE error. The same code the single-document ingest
            surface returns for that error. A batch builds each file's
            request from its source, source type, declared digest and metadata,
            so the codes that can appear are the single-document codes that
            depend on none of a predecessor, a force re-ingest, a chain-head
            token or a relocation pointer: `adapter_config_invalid`,
            `adapter_not_found`, `duplicate_content`, `invalid_doc_type`, `invalid_document_date`,
            `reserved_transition`, `source_digest_mismatch`, `source_file_not_found`,
            `source_type_unresolved`, `source_unreadable`, `tier3_schema_violation`, `tier3_unique_constraint_violation`,
            `vault_migration_in_flight`, `vault_source_path_refused`,
            `vault_source_store_refused` and `vault_source_store_unavailable`.
            `source_digest_mismatch` reports a declared digest that does not match
            the delivered bytes, before retention, including on dry runs.
            Of these, `vault_migration_in_flight` and
            `vault_source_store_unavailable` are the ones a later attempt at
            the same file may succeed past.
        detail:
          type: [object, "null"]
          additionalProperties: true
          description: >-
            Structured error payload, present only when the failure was a
            typed SAGE error that carries one. Shape is per error code; for
            `vault_source_path_refused` it carries `source_path`, the refused
            file as the caller named it.

    SummaryEvent:
      type: object
      description: >-
        SSE `summary` event payload. Emitted once at the end of the
        batch, after all per-file events. Carries the summary returned
        to non-streaming callers (MCP tool).
      required:
        - event_type
        - documents_created
        - metadata_pending
        - edges_created
        - edges_staged
        - edges_removed
        - edges_dropped
        - abstracts_generated
        - abstracts_deferred
        - error_count
        - errors
      properties:
        event_type:
          type: string
          enum: [summary]
          description: Discriminator for the SSE event payload variant; always 'summary'.
        documents_created:
          type: object
          required: [new, new_version]
          description: Document-creation counts for this batch, split by whether the document opens a chain or extends one.
          properties:
            new:
              type: integer
              description: Documents newly inserted this batch.
            new_version:
              type: integer
              description: Documents inserted as a new version of an existing chain.
        metadata_pending:
          type: integer
          description: >-
            Count of documents in this batch whose extracted metadata is
            not yet confirmed.
        edges_created:
          type: object
          additionalProperties:
            type: integer
          description: Tier 1 edges created in production, keyed by edge type.
        edges_staged:
          type: object
          additionalProperties:
            type: integer
          description: Tier 2 edges inserted into staging_edges, keyed by edge type.
        edges_removed:
          type: integer
          description: Pre-existing edges removed during this batch (e.g. supersession cleanup).
        edges_dropped:
          type: integer
          description: >-
            Planned edges dropped rather than created or staged. Causes: a
            referenced file failed to ingest (`ingestion_failed`); a Tier-1
            supersession was refused (`supersede_target_read_failed`,
            `supersede_target_missing`, or
            `supersede_target_not_transitionable`); a chain-repair
            replacement add was withheld after a sibling refusal (no
            warning entry records this drop); or the edge write failed
            (`edge_creation_failed`). Drops and edge_warnings entries are
            not 1:1 -- some warnings report failures that drop no edge.
        abstracts_generated:
          type: integer
          description: Number of documents for which a semantic abstract was generated during this batch.
        abstracts_deferred:
          type: integer
          description: >-
            Documents for which abstraction was skipped (empty projection
            or abstraction disabled in vault config).
        error_count:
          type: integer
          description: Total number of per-file errors recorded during the batch.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BatchIngestFileError"
          description: >-
            Per-file error records for files that failed to ingest in this
            batch, one entry per failure; each names the file's position in
            the batch, the staged filename, the file as the caller named it,
            and the error message, and a typed SAGE error additionally
            carries its code and detail.
        edge_warnings:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/EdgeWarning"
          description: >-
            Warnings from post-ingest edge resolution, one entry per
            affected edge; each names the source, target, edge type, a
            machine-readable reason, and a human-readable detail. Present
            only when warnings were produced.
        dry_run:
          type: boolean
          default: false
          description: >-
            Echo of the request flag. When true nothing was persisted,
            every creation and edge count above is zero by construction,
            and `previews` carries what the batch would have done.
        previews:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/IngestPreview"
          description: >-
            One preview per file the batch evaluated successfully under
            `dry_run`, in batch order. Files that would have been refused
            appear in `errors` instead, so the two lists together account
            for the batch. Present only on a dry run.

    DocTypeRequirements:
      type: object
      description: >-
        What a vault declares a document type requires of its typed
        metadata. Reported on an ingest preview and carried in the
        detail of a `tier3_schema_violation`, so a caller learns what
        would satisfy the refusal from the refusal itself rather than
        from a second call. The four field sets answer different
        questions and none substitutes for another.
        `required_tier3_fields` is frequently empty, because a schema
        more often refuses through `additionalProperties: false`, a
        pattern, or an enum than through a missing required key; the
        declared property names are what make such a refusal
        actionable.
      required:
        - doc_type
        - is_declared
        - has_metadata_schema
        - declared_tier3_fields
        - required_tier3_fields
        - unique_tier3_fields
        - permitted_source_types
      properties:
        doc_type:
          type: string
          description: The document type these requirements describe.
        is_declared:
          type: boolean
          description: >-
            Whether this doc_type appears in the vault's
            `document_types.doc_types` vocabulary at all. False means
            the value was resolved from caller metadata, a filename
            parse, or predecessor inheritance without ever being
            declared.
        has_metadata_schema:
          type: boolean
          description: >-
            Whether the doc_type declares a `metadata_schema`. A
            doc_type with none refuses any non-empty tier3_metadata
            outright, which is a different condition from a schema
            declaring no properties -- and the two are
            indistinguishable from the field lists alone.
        declared_tier3_fields:
          type: array
          items:
            type: string
          description: >-
            Sorted names of every property the doc_type's
            `metadata_schema` declares. Empty when no schema is
            declared, and also when a declared schema has no
            properties.
        required_tier3_fields:
          type: array
          items:
            type: string
          description: >-
            Sorted names the doc_type's `metadata_schema` lists as
            required. Empty when the schema declares no `required`
            list, which is the common case.
        unique_tier3_fields:
          type: array
          items:
            type: string
          description: >-
            Sorted names the doc_type declares under `unique_keys`,
            whose values must be unique within the vault across all
            lifecycle statuses. A collision raises
            `tier3_unique_constraint_violation`.
        permitted_source_types:
          type: [array, "null"]
          items:
            type: string
          description: >-
            Source types the doc_type declares itself compatible with,
            or null when it declares none. Null means unconstrained,
            which is not the same as an empty list. These steer
            filename-based doc_type inference; they are not an
            ingest-time gate, so an ingest naming a source type
            outside this list is not refused for that reason.

    IngestPreview:
      type: object
      description: >-
        Returned in place of a document when `IngestRequest.dry_run` is
        true. A preview stops short of reading the source into the
        vault, so it can report neither the projected content hash nor
        anything the adapter would have extracted. What it can report
        is every verdict reachable from the delivered bytes and the
        vault's own configuration: the resolved document type, the
        duplicate verdict, the supersession verdict, and the
        requirement set the document type declares.
      required:
        - dry_run
        - would_create
        - resolved_doc_type
        - resolved_source_type
        - source_content_hash
        - duplicate_of
        - predecessor_id
        - would_supersede
        - tier3_validated
        - requirements
      properties:
        dry_run:
          type: boolean
          enum: [true]
          description: >-
            Discriminator confirming nothing was persisted; always
            true.
        would_create:
          type: boolean
          description: >-
            Whether a real run with these arguments would create a new
            document. False when the delivered bytes are already held
            and `force` is not set, in which case a real run raises
            `duplicate_content`.
        resolved_doc_type:
          type: string
          description: >-
            The doc_type a real run would apply, resolved through the
            same precedence chain: caller metadata > filename parse
            (only when `needs_review` is true) > predecessor
            inheritance > `misc`.
        resolved_source_type:
          type: string
          description: >-
            The source type whose adapter a real run would project
            with, after extension-based inference fills an omitted
            value.
        source_content_hash:
          type: [string, "null"]
          description: >-
            Canonical digest of the bytes the caller delivered. Null
            only for a source already resident in the vault store that
            carries no prior document record, whose digest a real run
            recovers from projection -- which a preview does not run.
        duplicate_of:
          type: [string, "null"]
          description: >-
            Identifier of the document already holding these bytes, or
            null when none does. Where several hold them, the one named
            is a version a supersession has not retired, lowest document
            id among equals, so the same call names the same document
            every time. Null is also reported, unevaluated, when
            `source_content_hash` is null.
        predecessor_id:
          type: [string, "null"]
          description: >-
            The supersession target the caller named, echoed back, or
            null.
        would_supersede:
          type: boolean
          description: >-
            Whether a real run would apply the `supersede` transition
            to `predecessor_id`. False when no predecessor was named;
            a predecessor the transition table refuses raises
            `supersede_target_not_active` under dry run rather than
            reporting false here.
        tier3_validated:
          type: boolean
          description: >-
            Whether the reported verdict reflects a tier3_metadata
            validation. False when the caller supplied no payload: a
            real run would fall back to the adapter's extraction,
            which a preview cannot reach, so a real run may still
            refuse.
        requirements:
          $ref: "#/components/schemas/DocTypeRequirements"
          description: >-
            What `resolved_doc_type` declares its typed metadata must
            satisfy. Reported on every preview, not only a refusal, so
            a caller need not provoke an error to learn the shape.

    EdgeWarning:
      type: object
      description: >-
        A single warning from post-ingest edge resolution: an edge that
        was dropped, an edge whose lifecycle side effects did not fully
        apply, or a chain repair that was withheld.
      required: [source, target, edge_type, reason, detail]
      properties:
        source:
          type: string
          description: >-
            Source document id of the affected edge, or, when reason is
            `ingestion_failed`, the file as the caller named it -- the path
            or filename the caller supplied, never a server-side resolved or
            staging location, the same spelling the `errors` entry for that
            file carries in `source_path`.
        target:
          type: string
          description: >-
            Target document id of the affected edge, or, when reason is
            `ingestion_failed`, the file as the caller named it -- the path
            or filename the caller supplied, never a server-side resolved or
            staging location, the same spelling the `errors` entry for that
            file carries in `source_path`. Both endpoints are reported as
            file references under that reason, including one that did
            resolve.
        edge_type:
          type: string
          description: Edge type of the affected edge (e.g. supersedes).
        reason:
          type: string
          description: >-
            Machine-readable warning reason. One of `ingestion_failed`
            (the source or target file failed to ingest);
            `supersede_target_read_failed` (the supersession target could
            not be read before the edge write); `supersede_target_missing`
            (the supersession target does not exist);
            `supersede_target_not_transitionable` (the target's lifecycle
            state does not permit the supersede transition);
            `chain_repair_withheld` (an edge removal was skipped because a
            related supersession was refused); `edge_removal_failed` (a
            planned edge removal raised); `edge_creation_failed` (the edge
            write raised); `lifecycle_transition_failed` (the edge was
            created but the target's lifecycle write failed);
            `chunk_lifecycle_sync_failed` (the target's lifecycle write
            succeeded but the chunk-store lifecycle sync failed). The
            vocabulary is extensible; consumers should tolerate unknown
            reasons.
        detail:
          type: string
          description: Human-readable explanation of the warning.

