          description: Machine-readable error code (e.g., "invalid_lifecycle_transition", "document_not_found", "editor_permission_denied").
        message:
          type: string
          description: Human-readable error description.
        detail:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Additional context. Structure varies by error type (e.g., current_state and attempted_action for lifecycle transition errors).
        read_meta:
          $ref: '#/components/schemas/ReadMeta'
      required:
      - code
      - message
      type: object
    ReadMeta:
      type: object
      description: Self-describing markers for a SAGE read response (CAS-ADR-039). Nested as `read_meta` on every read-path response model so a caller can tell a delivered success apart from a transport-truncated fragment, and a thin/empty body apart from a populated one. The same carrier rides the error envelope with `success=false`.
      required:
      - success
      - body_present
      properties:
        success:
          type: boolean
          description: True on a delivered success response; the complete sub-object's presence distinguishes a real response from a transport-truncated fragment.
        body_present:
          type: boolean
          description: Whether a content body is present.
        body_length:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Body length when present; null for write-to-path delivery or no-body responses.
        projection_status:
          type:
          - string
          - 'null'
          enum:
          - current
          - stale
          - null
          description: 'Freshness of the projection on a projection read: ''current'' when the stored projection is up to date with the source, ''stale'' when the source was modified after the projection last ran (an administrative deficit, not a thin document). Null where the response is not a projection read.'
        projection_recovery:
          type:
          - string
          - 'null'
          description: Name of the tool that recomputes a stale projection (recompute_abstract). Populated only when projection_status is 'stale'; null otherwise. Gives a caller an actionable recovery pointer without a second probing round-trip.

    # -------------------------------------------------------------------------
    # Interactive sign-in (backend-for-frontend)
    # -------------------------------------------------------------------------

    LoginChallengeResponse:
      type: object
      required: [authorization_url, state]
      description: Returned by /app/auth/login to start the interactive sign-in.
      properties:
        authorization_url:
          type: string
          description: >-
            Identity-provider authorization URL the browser is sent to in
            order to sign in. The single-page app navigates the browser to
            this URL.
        state:
          type: string
          description: >-
            Opaque anti-forgery value bound to this sign-in attempt; echoed
            back on the callback and validated server-side.

    UserClaims:
      type: object
      required: [subject]
      description: Identity-provider claims describing the signed-in user.
      properties:
        subject:
          type: string
          description: >-
            Stable identity-provider subject for the signed-in user (the
            directory object id, or the OIDC subject when that is absent).
        name:
          type: [string, "null"]
          description: >-
            Human-readable display name from the identity-provider claims,
            when present.
        email:
          type: [string, "null"]
          description: >-
            Sign-in email or user-principal name from the identity-provider
            claims, when present.

    SessionInfoResponse:
      type: object
      required: [authenticated]
      description: Returned by /app/auth/me describing the caller's session state.
      properties:
        authenticated:
          type: boolean
          description: >-
            True when the request carries a live server-side session; false
            otherwise.
        user:
          description: >-
            The signed-in user's identity claims when authenticated; null
            when no live session is present.
          anyOf:
            - $ref: "#/components/schemas/UserClaims"
            - type: "null"
